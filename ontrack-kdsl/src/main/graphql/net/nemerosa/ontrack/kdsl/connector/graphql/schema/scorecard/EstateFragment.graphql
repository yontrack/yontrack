fragment EstateFragment on Estate {
    id
    name
    description
    labels {
        ...LabelFragment
    }
    marker {
        kind
        levelName
        environment
        qualifier
    }
    readingConfigs {
        key
        windowDays
        target
        direction
    }
    security {
        expectedKinds
        freshnessDays
        criticalTargetDays
        highTargetDays
    }
}
