mutation CreateEstate(
    $name: String!,
    $description: String,
    $labels: [String!]!,
    $marker: EstateMarkerInput,
    $readings: [EstateReadingConfigInput!],
    $security: EstateSecurityInput,
) {
    createEstate(input: {
        name: $name,
        description: $description,
        labels: $labels,
        marker: $marker,
        readings: $readings,
        security: $security,
    }) {
        ...PayloadUserErrors
        estate {
            ...EstateFragment
        }
    }
}
