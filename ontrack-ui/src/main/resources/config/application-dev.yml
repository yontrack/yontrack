ontrack:
  config:
    search:
      index:
        # The dev stack and the KDSL acceptance tests run one instance only: the search documents
        # are rebuilt at once at startup, instead of past the overlap of a rolling upgrade.
        startup-delay: 0
    extension:
      scm:
        mock:
          # The mock SCM, used by the integration and KDSL acceptance tests and by the demo
          # seed. It is off by default everywhere else and must be switched on explicitly -
          # see SCMExtensionConfigProperties.MockSCMConfigProperties.
          enabled: true
      jenkins:
        mock:
          # The `mock-jenkins` notification channel, used by the KDSL acceptance tests and by the
          # demo seed. It is off by default everywhere else and must be switched on explicitly -
          # see JenkinsExtensionConfigProperties.MockJenkinsConfigProperties.
          enabled: true
      workflows:
        mock:
          # The "Simulated gate" node executor, used by the integration and KDSL acceptance
          # tests. It is off by default everywhere else and must be switched on explicitly -
          # see WorkflowConfigurationProperties.MockExecutorConfigProperties.
          enabled: true
