ontrack:
  config:
    extension:
      scm:
        mock:
          # The mock SCM, used by the integration and KDSL acceptance tests and by the demo
          # seed. It is off by default everywhere else and must be switched on explicitly -
          # see SCMExtensionConfigProperties.MockSCMConfigProperties.
          enabled: true
      workflows:
        mock:
          # The "Simulated gate" node executor, used by the integration and KDSL acceptance
          # tests. It is off by default everywhere else and must be switched on explicitly -
          # see WorkflowConfigurationProperties.MockExecutorConfigProperties.
          enabled: true
