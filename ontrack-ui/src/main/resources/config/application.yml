# Application properties

# Spring configuration
spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8008/realms/ontrack
  # Default database connection
  datasource:
    url: "jdbc:postgresql://localhost/ontrack"
    username: ontrack
    password: ontrack
    # The default pool of 10 connections is well below the steady-state working set: the queue
    # listeners alone (notifications, workflows, auto-versioning) hold about 27 consumer threads,
    # on top of the workflow engine's own IO threads.
    hikari:
      maximum-pool-size: 30
      minimum-idle: 5
      connection-timeout: 30000
      leak-detection-threshold: 60000
  # Rabbit MQ configuration
  rabbitmq:
    host: localhost
    username: ontrack
    password: ontrack
  # Default profile
  profiles:
    default: prod
  # GraphQL
  graphql:
    schema:
      introspection:
        enabled: true
      printer:
        enabled: true
      locations: "classpath*:graphql/**"
    # No `cors` section: CORS on /graphql is set by `ontrack.config.security.cors.allowed-origins`,
    # like on the rest of the API - see WebConfig (#1771).

# Compression of web resources
server:
  compression:
    enabled: true

# Management
management:
  metrics:
    tags:
      application: ontrack
      application_instance: ontrack
  # Listening on a specific port
  server:
    port: 8800
  # The management port is not authenticated (see WebSecurityConfig) and must never be exposed
  # publicly: only the overall health status is shown (#1772)
  endpoint:
    health:
      show-details: when-authorized
    # Getting a token for an account is used only for testing and must be explicitly granted
    account:
      access: none
  # Custom URL for the management end points
  endpoints:
    web:
      # Only what the platform probes & scrapes. Anything else (graphql, account, env...) must be
      # re-enabled explicitly where it is needed - see the "Management port" page of the docs (#1772)
      exposure:
        include: "health,info,prometheus"
      base-path: "/manage"
  # Default settings for the metrics
  prometheus:
    metrics:
      export:
        enabled: true
  # Health indicators
  health:
    # Disable LDAP health indicator
    ldap:
      enabled: false
    # Disable the ElasticSearch health indicator by default
    elasticsearch:
      enabled: false

# The version information is generated in /config/application.properties by the build
info:
  app:
    name: Ontrack
    description: Continuous Delivery Traceability and Monitoring

