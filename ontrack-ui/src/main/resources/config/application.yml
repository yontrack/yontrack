# Application properties

# Spring configuration
spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8008/realms/ontrack
  # Default database connection
  datasource:
    url: "jdbc:postgresql://localhost/ontrack"
    username: ontrack
    password: ontrack
    # The default pool of 10 connections is well below the steady-state working set: the queue
    # listeners alone (notifications, workflows, auto-versioning) hold about 27 consumer threads,
    # on top of the workflow engine's own IO threads.
    hikari:
      maximum-pool-size: 30
      minimum-idle: 5
      connection-timeout: 30000
      leak-detection-threshold: 60000
  # Rabbit MQ configuration
  rabbitmq:
    host: localhost
    username: ontrack
    password: ontrack
  # Default profile
  profiles:
    default: prod
  # GraphQL
  graphql:
    schema:
      introspection:
        enabled: true
      printer:
        enabled: true
      locations: "classpath*:graphql/**"
    cors:
      allowed-origins: "*"
      allowed-methods:
        - GET
        - POST
        - OPTIONS
      max-age: 1800s
      allowed-headers: "*"

# Compression of web resources
server:
  compression:
    enabled: true

# Management
management:
  metrics:
    tags:
      application: ontrack
      application_instance: ontrack
  # Listening on a specific port
  server:
    port: 8800
  # Custom URL for the management end points and definition of exposure
  # Exposes details about health
  endpoint:
    health:
      show-details: always
    # Getting a token for an account is used only for testing and must be explicitly granted
    account:
      access: none
  # Custom URL for the management end points
  endpoints:
    web:
      exposure:
        include: "*"
      base-path: "/manage"
  # Default settings for the metrics
  prometheus:
    metrics:
      export:
        enabled: true
  # Health indicators
  health:
    # Disable LDAP health indicator
    ldap:
      enabled: false
    # Disable the ElasticSearch health indicator by default
    elasticsearch:
      enabled: false

# The version information is generated in /config/application.properties by the build
info:
  app:
    name: Ontrack
    description: Continuous Delivery Traceability and Monitoring

