# Version updates. Security updates for npm are enabled in the repository settings and need no
# entry here; npm *version* updates are deliberately not configured (#1749).
#
# github-actions is here to keep the actions pinned by commit SHA up to date - a pin nobody bumps
# is a pin that ages into a vulnerability of its own. Dependabot rewrites the SHA and the version
# comment beside it together.
#
# gradle keeps the backend's dependencies and plugins up to date, lockfiles included (#1752).
# Verified on the first Dependabot gradle pull request (#1776): it rewrites the per-module
# gradle.lockfile files from the root, buildSrc/gradle.lockfile included, but never a
# buildscript-gradle.lockfile. A pull request that bumps a *plugin* version therefore fails the
# STRICT locking until `./gradlew resolveAndLockAll --write-locks` and
# `./gradlew -p buildSrc resolveAndLockAll --write-locks` are run on its branch - see DEVELOPMENT.md.
version: 2
updates:
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
    # A Spring Boot major is a migration to plan, not routine maintenance: the BOM it carries moves
    # every Spring version under it at once. Minor and patch updates stay welcome.
    ignore:
      - dependency-name: "org.springframework.boot*"
        update-types:
          - "version-update:semver-major"
    # A dependency joins the first group it matches, so "everything else" comes last.
    groups:
      # The Spring Boot plugin, which also sets the version of the BOM every project imports.
      spring-boot:
        patterns:
          - "org.springframework.boot*"
      # The Kotlin plugins and libraries, which have to move together.
      kotlin:
        patterns:
          - "org.jetbrains.kotlin*"
          - "org.jetbrains.kotlinx*"
      gradle:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    # "/" covers .github/workflows; the composite actions are one directory each.
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
