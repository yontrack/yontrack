# Submits the resolved Gradle dependency graph to GitHub (#1750).
#
# The GitHub dependency graph does not parse Gradle build files, nor gradle.lockfile: without a
# build-based submission Dependabot knows nothing of the backend's dependencies, transitive ones
# included. This runs the build's own resolution and uploads what it resolved.
#
# Everything is submitted, test classpaths included. Excluding configurations with
# `dependency-graph-exclude-configurations` is only worth it if the alerts they raise turn out to
# be noise.
#
# Pinned by commit SHA with the version in a trailing comment; .github/dependabot.yml keeps the
# pins up to date.
name: Dependency submission

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  dependency-submission:
    name: Submit the Gradle dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # The dependency submission API takes `contents: write`.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: zulu
          java-version: "25"

      # v5 and not v6: from v6 the caching component of gradle/actions is proprietary and using it
      # accepts Gradle's terms of use. See codeql.yml.
      - name: Submit the dependency graph
        uses: gradle/actions/dependency-submission@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
