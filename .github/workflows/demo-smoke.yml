name: Demo smoke

# Verifies a deployment and reports DEMO.SMOKE on the build that was deployed.
#
# Two instances go through it, chosen by the `target` input: the public demo, deployed from
# `main`, and v6.dev.yontrack.com, deployed from the next-major branch (see
# doc/dev-guide/major-branch.md). Everything below is the same for both except the URL, the
# credentials and the concurrency group, each marked where it differs.
#
# On v6 the seed is the point rather than the verification: the environment has no data of its
# own, and this is what provisions it on every deployment.
#
# Dispatched by the slot's RUNNING workflow through the `github-workflow` notification
# channel - see .yontrack/ci.yaml - once the slot has marked the deployment done. That moment
# is when the gitops PR merged, which is well before ArgoCD has synced and the pods are
# serving, so the first thing this workflow does is wait for the version it was told about to
# be the version answering. That poll is the most valuable check here: "the version I asked
# for is the version answering" is the whole deployment contract.
#
# Deliberately thin after that. The heavy suites already ran for BRONZE; re-running them here
# would test the deployment rather than the code, and a fat smoke suite becomes the flaky
# thing that blocks releases.
#
# The polling and the assertions live in scripts/demo-smoke.sh so that
# scripts/demo-smoke-test.sh can exercise them against a stubbed HTTP client.

on:
  workflow_dispatch:
    inputs:
      # Always sent by the `github-workflow` notification channel, whether or not it is asked
      # for: GitHub's API gives no way to learn the run ID of a dispatch, so Yontrack passes a
      # correlation ID and then finds the run by the artifact named after it below. GitHub
      # rejects any input a workflow does not declare, so omitting this fails the dispatch with
      # `422 Unexpected inputs provided: ["id"]`.
      # See ontrack-docs/docs/content/integrations/notifications/github-workflow.md.
      id:
        description: 'Correlation ID, set by Yontrack. "manual" when dispatched by hand.'
        required: true
        default: manual
        type: string
      version:
        description: 'Version deployed (e.g. 5.3.0-rc-41), which the instance must report'
        required: true
        type: string
      # The instance to verify. Everything that is per-instance - URL, API token, UI
      # credentials, concurrency group - is resolved from this one value, so that the two
      # targets cannot drift apart into two workflows.
      target:
        description: 'Instance to verify'
        required: false
        default: demo
        type: choice
        options:
          - demo
          - v6
      project:
        description: 'Yontrack project holding the build'
        required: false
        default: yontrack
        type: string
      branch:
        description: 'Yontrack branch holding the build'
        required: false
        # `main` suits the demo, which is the default target. A v6 dispatch passes `v6`.
        default: main
        type: string

# One thing at a time on a given instance, and queue rather than cancel: the seed wipes it, so
# two overlapping runs would reset it under each other's feet.
#
# Per target, and that is the point: a v6 run has no reason to queue behind a demo run. The
# demo's group is `demo-instance` rather than `demo-smoke` because it is shared with
# .github/workflows/dast-passive.yml (#1765): the passive DAST scan crawls the demo for minutes,
# and a reset starting underneath it would have the scanner walking an instance that is being
# deleted around it - which reads as a broken scan, or worse as a clean one. Anything else that
# touches the demo joins that group too. Nothing scans v6, so `v6-instance` has only this
# workflow in it today.
#
# `github.event.inputs` rather than `inputs`: the `inputs` context is not available to
# `concurrency`, and an unresolved expression here would silently collapse both targets into one
# group.
concurrency:
  group: ${{ github.event.inputs.target == 'v6' && 'v6-instance' || 'demo-instance' }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  YONTRACK_CLI_VERSION: '5.2.0'
  TARGET: ${{ inputs.target }}
  # The instance under test, not the Yontrack instance the validation is reported to. Everything
  # the smoke test asks of it goes through /graphql: the chart's ingress routes only /graphql and
  # /hook to the backend, so /rest/* lands on the Next UI and answers 404.
  #
  # The `vars.*` overrides exist so an instance can be repointed without a commit. The literals
  # are the deployed hostnames.
  DEMO_URL: ${{ inputs.target == 'v6' && (vars.V6_URL || 'https://v6.dev.yontrack.com') || (vars.DEMO_URL || 'https://demo.dev.yontrack.com') }}
  DEMO_SEEDED_PROJECT: petclinic
  DEMO_PROJECT: ${{ inputs.project }}
  DEMO_BRANCH: ${{ inputs.branch }}
  DEMO_VERSION: ${{ inputs.version }}

jobs:
  smoke:
    name: Smoke-test ${{ inputs.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # The target's own credentials, resolved once and mapped onto the DEMO_* names the script and
    # the Playwright spec read. Two instances, two databases, two Keycloak realms: nothing is
    # shared, and a v6 run authenticating with the demo's token would simply be refused.
    #
    # Here rather than in the workflow-level `env` above, which is the natural home for the rest:
    # the `secrets` context is not available to that one.
    #
    # An absent secret is an empty string, which is falsy, so a missing `V6_TOKEN` would fall
    # through to the demo's. That would not touch the demo - DEMO_URL is already v6's - but it
    # would fail deep inside the poll. `Check the target's credentials` below stops it at the door.
    env:
      TARGET_TOKEN: ${{ inputs.target == 'v6' && secrets.V6_TOKEN || secrets.DEMO_TOKEN }}
      TARGET_USERNAME: ${{ inputs.target == 'v6' && secrets.V6_USERNAME || secrets.DEMO_USERNAME }}
      TARGET_PASSWORD: ${{ inputs.target == 'v6' && secrets.V6_PASSWORD || secrets.DEMO_PASSWORD }}
    steps:
      # The run time reported for the validation is measured from here.
      - name: Record the job start
        id: job_start
        run: echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"

      # How Yontrack finds this run: it polls the run's artifacts for this name, 10 times at
      # 10s intervals, and gives up after that. So this goes before the checkout - `fetch-depth:
      # 0` on this repository is far too slow to sit inside that window - and needs no checkout
      # of its own, since the file is empty and only its name carries the ID.
      - name: Correlation preparation
        run: touch inputs.properties

      - name: Correlation file archiving
        uses: actions/upload-artifact@v7
        with:
          name: inputs-${{ inputs.id }}.properties
          path: inputs.properties
          if-no-files-found: error

      # After the correlation artifact and before anything that talks to the instance. Not
      # earlier: a run that dies before the artifact exists is a run Yontrack cannot find, and
      # the promotion's workflow then reports "no run" instead of the real reason.
      #
      # A missing secret otherwise surfaces deep inside the poll, where it reads as a broken
      # deployment rather than as an unconfigured target.
      - name: Check the target's credentials
        run: |
          set -euo pipefail
          missing=""
          for name in TARGET_TOKEN TARGET_USERNAME TARGET_PASSWORD; do
            [ -n "${!name:-}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Target '$TARGET' has no credentials configured:$missing." \
                 "See doc/dev-guide/demo-smoke.md."
            exit 1
          fi
          echo "Target '$TARGET' at $DEMO_URL"

      # The seed builds one project out of the commits since the last release tag, so it needs
      # tags and history. Without this it degrades quietly to an empty changelog project.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Installed directly rather than through ontrack-github-actions-cli-config, which
      # registers a build as a side effect. This workflow validates an existing build; it must
      # not create one.
      - name: Install the Yontrack CLI
        run: |
          set -euo pipefail
          curl -sSfL -o /usr/local/bin/yontrack \
            "https://github.com/nemerosa/ontrack-cli/releases/download/${YONTRACK_CLI_VERSION}/yontrack-linux-amd64"
          chmod +x /usr/local/bin/yontrack
          # --cli only: the bare `version` also asks the server, which is not configured yet.
          yontrack version --cli

      - name: Configure the CLI
        env:
          YONTRACK_URL: ${{ vars.YONTRACK_URL }}
          YONTRACK_TOKEN: ${{ secrets.YONTRACK_TOKEN }}
        run: |
          set -euo pipefail
          yontrack config create prod "$YONTRACK_URL" --token "$YONTRACK_TOKEN" --override

      # DEMO.SMOKE is reported with `yontrack validate --build`, which takes the build *name*.
      # The slot workflow can only pass the version: `${build}` renders the display name, which
      # is the release property, and no templating source exposes the raw name. Resolved first,
      # and outside the smoke steps, so that a failure here reads as "Yontrack does not know
      # this version" rather than as a broken deployment.
      - name: Resolve the build
        id: resolve
        run: scripts/demo-smoke.sh resolve

      # ------------------------------------------------------------------------------------
      # 1. The version that was deployed is the version answering.
      # ------------------------------------------------------------------------------------

      - name: Wait for the deployed version
        id: poll
        env:
          DEMO_TOKEN: ${{ env.TARGET_TOKEN }}
          # 30 minutes. Since rc-350 (2026-09-22) a rollout takes the old pod down before the new
          # one is ready, and the new one has needed more than 10 minutes to answer: two smokes
          # failed on a 503 for their whole 600s and the same build then passed first time. The
          # rest of the job takes ~7 minutes, which still fits in its 45.
          DEMO_POLL_TIMEOUT: '1800'
        run: scripts/demo-smoke.sh poll

      # ------------------------------------------------------------------------------------
      # 2. Reset and seed. The demo's state is a function of the build, not an accumulation.
      # ------------------------------------------------------------------------------------

      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - name: Build the seed program
        run: ./gradlew :ontrack-demo-seed:installDist --console plain

      - name: Reset and seed the instance
        id: seed
        env:
          # The seed talks to the instance under test, not to the Yontrack instance the CLI is
          # configured against. Scoped to this step for that reason.
          YONTRACK_URL: ${{ env.DEMO_URL }}
          YONTRACK_TOKEN: ${{ env.TARGET_TOKEN }}
          # The seed refuses any URL not matching `demo.`/localhost, since it deletes every
          # project. v6 is not `demo.`, so it is allowed explicitly - and only its exact host, so
          # a mistyped V6_URL still stops here. Empty for the demo target: the default applies.
          DEMO_SEED_URL_PATTERN: ${{ inputs.target == 'v6' && '^https://v6\.dev\.yontrack\.com(?=[:/]|$)' || '' }}
        run: ontrack-demo-seed/build/install/ontrack-demo-seed/bin/ontrack-demo-seed

      # ------------------------------------------------------------------------------------
      # 3. Re-apply the configuration as code.
      #
      # The seed deleted and recreated every project, and a project's permissions went with
      # the project. The demo's CasC declares `project-permissions` giving the DAST scanner
      # group `DAST Project` the PARTICIPANT role on the seeded project, so from the first
      # reset onwards `scan-project` would have no project at all and the cross-project
      # authorization scan would test nothing (issue #1768).
      #
      # `reloadCasc` over /graphql is the only remote reload that reaches the instance: the REST
      # reload and upload endpoints are not routed by the chart's ingress. It is declarative
      # and therefore idempotent, which it has to be - this runs on every BRONZE deployment.
      # The canonical declaration of the scanner roles is security/dast/casc.yaml.
      #
      # Runs on every target, and nothing here is demo-specific: the mutation re-applies
      # whatever CasC the *instance* carries, not a file sent from here, so on v6 it restores
      # v6's own declaration after the seed. The project-role assertion that follows it passes
      # on an instance that declares no DAST group at all - see dsm_casc_project_role.
      # ------------------------------------------------------------------------------------

      - name: Re-apply the CasC and check the scanner's project role
        id: casc
        env:
          DEMO_TOKEN: ${{ env.TARGET_TOKEN }}
        run: scripts/demo-smoke.sh casc

      # ------------------------------------------------------------------------------------
      # 4. Assert, thinly.
      # ------------------------------------------------------------------------------------

      - name: Check the seeded dataset over GraphQL
        id: assert
        env:
          DEMO_TOKEN: ${{ env.TARGET_TOKEN }}
        run: scripts/demo-smoke.sh assert

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ontrack-web-tests/package-lock.json

      - name: Install Playwright
        working-directory: ontrack-web-tests
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium

      # Keycloak login plus one entity page: what only a real deployment can break - the realm
      # the chart provisions, and the UI pod reaching the backend pod.
      - name: Check the UI signs in and renders
        id: playwright
        working-directory: ontrack-web-tests
        env:
          DEMO_USERNAME: ${{ env.TARGET_USERNAME }}
          DEMO_PASSWORD: ${{ env.TARGET_PASSWORD }}
        run: npm run test-demo

      - name: Upload the Playwright report
        if: ${{ !cancelled() && steps.playwright.outcome != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: demo-smoke-playwright
          path: |
            ontrack-web-tests/reports/demo
            ontrack-web-tests/test-results
          retention-days: 7
          if-no-files-found: ignore

      # ------------------------------------------------------------------------------------
      # 5. Report, whatever happened.
      # ------------------------------------------------------------------------------------

      # `!cancelled()` and not `success()`: an instance that never came up must land a FAILED
      # DEMO.SMOKE on the build rather than leave the stamp absent, which is indistinguishable
      # from "not deployed yet" and is how a broken deployment times out silently.
      - name: Validate DEMO.SMOKE
        if: ${{ !cancelled() && steps.resolve.outputs.build != '' }}
        env:
          STARTED: ${{ steps.job_start.outputs.started }}
          POLL: ${{ steps.poll.outcome }}
          SEED: ${{ steps.seed.outcome }}
          CASC: ${{ steps.casc.outcome }}
          ASSERT: ${{ steps.assert.outcome }}
          PLAYWRIGHT: ${{ steps.playwright.outcome }}
          BUILD: ${{ steps.resolve.outputs.build }}
        run: |
          set -uo pipefail
          run_time_flag=""
          if [ -n "${STARTED:-}" ]; then
            run_time_flag="--run-time $(( $(date +%s) - STARTED ))"
          fi
          # A skipped step is a failure here: it means an earlier one stopped the run.
          if [ "$POLL" = "success" ] && [ "$SEED" = "success" ] && [ "$CASC" = "success" ] \
            && [ "$ASSERT" = "success" ] && [ "$PLAYWRIGHT" = "success" ]; then
            status=PASSED
          else
            status=FAILED
          fi
          {
            echo "### Smoke \`$TARGET\` \`$DEMO_VERSION\` - \`$status\`"
            echo
            echo "| Step | Outcome |"
            echo "|---|---|"
            echo "| Version \`$DEMO_VERSION\` answering at $DEMO_URL | ${POLL:-skipped} |"
            echo "| Reset and seed | ${SEED:-skipped} |"
            echo "| CasC re-applied, scanner project role back | ${CASC:-skipped} |"
            echo "| Seeded dataset over GraphQL | ${ASSERT:-skipped} |"
            echo "| UI signs in and renders | ${PLAYWRIGHT:-skipped} |"
          } >> "$GITHUB_STEP_SUMMARY"
          # shellcheck disable=SC2086  # deliberate: run info is a set of flags, not one word
          yontrack validate \
            --project "$DEMO_PROJECT" --branch "$DEMO_BRANCH" --build "$BUILD" \
            --validation DEMO.SMOKE --status "$status" \
            $run_time_flag \
            --source-type github-workflow \
            --source-uri "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --trigger-type "${GITHUB_EVENT_NAME}" \
            --trigger-data "$DEMO_VERSION"
