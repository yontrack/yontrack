# Yontrack CI.
#
# Replaces the former Jenkins multibranch pipeline. Two things shape the layout:
#
#  * One Yontrack build per workflow run. The `yontrack` job registers it and every other job
#    links to it by commit. Calling the `-config` action more than once would register a
#    different build per job and every validation would then fail with `Build not found`.
#  * The Jenkins agent ran with the Docker socket mounted and `--network host`, so compose's
#    published ports resolved as `localhost`. A `container:` job does not reproduce that —
#    compose publishes on the runner host, not inside the job container — so no job uses one.
name: CI

on:
  # The Jenkins job was a multibranch pipeline building every branch, so there is no branch
  # filter here either. This is also what makes the workflow verifiable from a working branch.
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      SKIP_KDSL_ACCEPTANCE:
        description: Skipping KDSL acceptance tests
        type: boolean
        default: false
      SKIP_NEXT_UI_TESTS:
        description: Skipping legacy acceptance tests
        type: boolean
        default: false
      SKIP_GITHUB_IT:
        description: Skipping integration tests for GitHub
        type: boolean
        default: true
      SKIP_BITBUCKET_CLOUD_IT:
        description: Skipping integration tests for Bitbucket Cloud
        type: boolean
        default: true
      SKIP_GITLAB_IT:
        description: Skipping integration tests for GitLab
        type: boolean
        default: true
      # Coverage is collected on main, release/* and the next-major branch only (#1821). This
      # forces it on for a run started by hand, which is the only way to exercise the whole chain
      # -- five test jobs, the artefacts and the report job - from a working branch before it is
      # merged.
      COVERAGE:
        description: Collecting test coverage on this branch too
        type: boolean
        default: false
      # The Gradle state, build cache included, is written from main, release/* and the next-major
      # branch only (#1870). This forces it on for a run started by hand: a branch changing the
      # build can then be measured warm, by running it twice.
      GRADLE_CACHE_WRITE:
        description: Writing the Gradle cache from this branch too
        type: boolean
        default: false

# Keyed on the commit, not the branch. A group of `ci-refs/heads/main` serialised the whole
# repository -- the workflow merges into main and never pushes the working branch, so every run
# there is -- and two sessions working in parallel queued behind each other for 9-14 minutes on
# top of the ~21 the run itself costs. Different commits now run at the same time; a re-run of
# the *same* commit still cannot overlap itself, which is what keeps two runs from writing
# validations onto one Yontrack build. See ADR 0014.
#
# Still no cancel-in-progress: `disableConcurrentBuilds()` queued rather than cancelled, and
# every push to main needs its own Yontrack build validated for the promotion chain to mean
# anything.
concurrency:
  group: ci-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  # The versioning plugin appends `-dev` unless CI is set. GitHub sets this already; stated
  # here so the version shape does not depend on an implicit runner default.
  CI: "true"
  # Pinned: an unpinned CLI lets a Yontrack release turn a green pipeline red in a repository
  # nobody touched. 5.8.0 for `validate … findings`, which the findings mirror uses (#1869).
  YONTRACK_CLI_VERSION: "5.8.0"
  # Run info reported with every validation. The Jenkins shared library computed this silently;
  # the Go CLI is purely declarative and sends `runInfo: null` unless the flags are spelled out,
  # which is how the migration dropped it (#1655) and left a hole in
  # `ontrack_run_VALIDATION_RUN_time_seconds`. Held as one string because the four values are the
  # same at every call site — a URL, an event name and a SHA, none of which contain whitespace,
  # so the unquoted expansion below is safe. The run time is per-job and is added at each site.
  #
  # The source type matches what the GitHub ingestion already records (WorkflowRunInfo.TYPE), so
  # a run reported by this workflow and one reported by a webhook read the same way in the UI.
  #
  # Each job records its start in a first `run:` step and every validation in that job measures
  # from there, so the reported time covers the job rather than one step of it — checkout,
  # toolchain setup and cache restore included. Two spans stay outside it and cannot be brought
  # in: the runner's own "Set up job", which precedes every step, and anything the job does after
  # the validation has been recorded.
  #
  # Every call site still builds its own `run_time_flag` and leaves it empty when there is no
  # recorded start. Recording the validation matters more than timing it, so a missing start drops
  # the flag instead of failing the step on `$(( ... - ))` and losing the stamp altogether. The
  # dropped flag arrives as `runTime: 0` rather than as nothing - the CLI carries the run time as a
  # plain Go `int` with no `omitempty`, so it cannot express the absence - and Yontrack normalises
  # that zero back to no run time, so an untimed validation leaves the duration metric alone
  # instead of feeding it a zero.
  YONTRACK_RUN_INFO: >-
    --source-type github-workflow
    --source-uri ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    --trigger-type ${{ github.event_name }}
    --trigger-data ${{ github.sha }}
  # How many legs the `integration` matrix has. Held here because integration-report has to know
  # what a *complete* set of shard artefacts looks like — see the check there. Keep in step with
  # the matrix; getting it wrong fails the INTEGRATION stamp loudly, which is the safe direction.
  INTEGRATION_SHARDS: "5"
  # The same, for the two other sharded matrices. Only the `coverage` job reads them — it is what
  # a *complete* set of execution data looks like, and a session missing from that set is a leg
  # whose data was silently lost (#1821). Keep them in step with the matrices below; getting one
  # wrong fails the coverage job loudly, which is the safe direction.
  KDSL_SHARDS: "2"
  UI_MAIN_SHARDS: "3"
  # Run-scoped tag used to hand the Docker images from `build` (backend) and `build-ui` to the
  # jobs that consume them. Keyed on the run, deliberately not on the attempt: re-running just the
  # failed jobs must still find the images the original attempts pushed. A re-run of either job
  # overwrites the same tag, which is what you want for the same commit.
  GHCR_ONTRACK: ghcr.io/${{ github.repository }}/ontrack
  GHCR_ONTRACK_UI: ghcr.io/${{ github.repository }}/ontrack-ui
  RUN_TAG: run-${{ github.run_id }}
  # See ontrack-docs/build.gradle.kts
  YONTRACK_DOCS_EDIT: edit/${{ github.ref_name }}/ontrack-docs/docs

jobs:

  # ---------------------------------------------------------------------------------------------
  # Version and parameters, resolved once for the whole run.
  # ---------------------------------------------------------------------------------------------

  setup:
    name: Setup
    # `on: push` carries no branch filter, so a branch living in this repo is already built by
    # its push event. Building it again for the pull request doubles every run for no extra
    # signal: the push run targets the same head SHA, so its checks show on the pull request
    # anyway, and main requires no status checks. Fork pull requests are the exception — no
    # push event reaches this repo for them, so `pull_request` is the only trigger they get.
    #
    # Every other job needs this one, so skipping it here skips the whole duplicate run.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
      base_version: ${{ steps.version.outputs.base_version }}
      full_run: ${{ steps.params.outputs.full_run }}
      coverage: ${{ steps.params.outputs.coverage }}
      skip_kdsl_acceptance: ${{ steps.params.outputs.skip_kdsl_acceptance }}
      skip_next_ui_tests: ${{ steps.params.outputs.skip_next_ui_tests }}
      skip_github_it: ${{ steps.params.outputs.skip_github_it }}
      skip_bitbucket_cloud_it: ${{ steps.params.outputs.skip_bitbucket_cloud_it }}
      skip_gitlab_it: ${{ steps.params.outputs.skip_gitlab_it }}
      gradle_cache_read_only: ${{ steps.params.outputs.gradle_cache_read_only }}
    steps:
      - uses: actions/checkout@v7
        with:
          # findLatestPatchVersion() reads `git tag -l`; without the tags every version
          # computes as `.0`.
          fetch-depth: 0

      # The nemerosa/ontrack-build image carried a global git identity, and the tests rely on
      # it: GitRepo.commit() runs `git commit` in a freshly `git init`ed repo, which fails
      # outright on a runner with no user.name/user.email. init.defaultBranch matches what the
      # image set, so the branch names the tests assert on stay the same.
      - name: Configure git
        run: |
          git config --global user.email "yontrack@nemerosa.net"
          git config --global user.name "Yontrack"
          git config --global init.defaultBranch main

      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: "25"

      # `inputs` is only populated on workflow_dispatch, so every parameter needs a fallback
      # for `push` and `pull_request`. The booleans arrive as the strings "true"/"false".
      - name: Resolve the parameters
        id: params
        env:
          EVENT_NAME: ${{ github.event_name }}
          IN_SKIP_KDSL_ACCEPTANCE: ${{ inputs.SKIP_KDSL_ACCEPTANCE }}
          IN_SKIP_NEXT_UI_TESTS: ${{ inputs.SKIP_NEXT_UI_TESTS }}
          IN_SKIP_GITHUB_IT: ${{ inputs.SKIP_GITHUB_IT }}
          IN_SKIP_BITBUCKET_CLOUD_IT: ${{ inputs.SKIP_BITBUCKET_CLOUD_IT }}
          IN_SKIP_GITLAB_IT: ${{ inputs.SKIP_GITLAB_IT }}
          IN_COVERAGE: ${{ inputs.COVERAGE }}
          IN_GRADLE_CACHE_WRITE: ${{ inputs.GRADLE_CACHE_WRITE }}
          ACTOR: ${{ github.actor }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail

          # $1 = value supplied by workflow_dispatch, $2 = default for the other events
          resolve() {
            if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "$1" ]; then
              echo "$1"
            else
              echo "$2"
            fi
          }

          # Yontrack never runs for a pull request, and neither does anything that needs a
          # credential: the GHCR hand-off and the jobs that consume its images.
          #
          # Dependabot is excluded on the same grounds but for a different reason — GitHub gives
          # a Dependabot-triggered run a read-only token and no access to Actions secrets, and
          # that applies to its `push` events as well as its pull requests. Keying this on the
          # event alone left the Yontrack job failing on every Dependabot branch and taking the
          # whole run down with it.
          #
          # What is left for a pull request is what §6 already described for forks: compile,
          # unit tests, the Docker image build and the credential-free integration tests.
          if [ "$EVENT_NAME" = "pull_request" ] || [ "$ACTOR" = "dependabot[bot]" ]; then
            full_run=false
          else
            full_run=true
          fi

          # Test coverage (#1821) is collected on the push builds of `main`, `release/*` and the
          # next-major branch `v<major>` only — the ones CI registers in Yontrack and records the
          # COVERAGE.* stamps on. `full_run` is not that gate: it is true on any non-Dependabot
          # push, working branches included, so keying coverage off it would instrument every
          # branch build for figures nobody reads.
          #
          # The workflow_dispatch input forces it on, which is how the whole chain is exercised
          # from a working branch before it is merged.
          coverage=false
          if [ "$full_run" = "true" ]; then
            case "$REF" in
              refs/heads/main|refs/heads/release/*) coverage=true ;;
              refs/heads/v[0-9]|refs/heads/v[0-9][0-9]) coverage=true ;;
            esac
            if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$IN_COVERAGE" = "true" ]; then
              coverage=true
            fi
          fi

          # Which runs write the Gradle state back to the GitHub cache (#1870). setup-gradle's own
          # default is the default branch only, which left the next-major branch restoring main's
          # state on every job — another Gradle distribution, another dependency set, all of it
          # downloaded again each time — and never saving its own. The long-lived branches are
          # what every later run of that branch restores from, so they write; a working branch
          # only reads, since an entry it saves is visible to that branch alone and would only
          # evict the ones that matter from the repository's quota.
          #
          # Keyed on the ref and not on `full_run`, for the same reason as coverage above. The
          # workflow_dispatch input forces it on, which is how a branch is measured warm.
          gradle_cache_read_only=true
          if [ "$EVENT_NAME" != "pull_request" ]; then
            case "$REF" in
              refs/heads/main|refs/heads/release/*) gradle_cache_read_only=false ;;
              refs/heads/v[0-9]|refs/heads/v[0-9][0-9]) gradle_cache_read_only=false ;;
            esac
            if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$IN_GRADLE_CACHE_WRITE" = "true" ]; then
              gradle_cache_read_only=false
            fi
          fi

          {
            echo "full_run=$full_run"
            echo "coverage=$coverage"
            echo "gradle_cache_read_only=$gradle_cache_read_only"
            echo "skip_kdsl_acceptance=$(resolve "$IN_SKIP_KDSL_ACCEPTANCE" false)"
            echo "skip_next_ui_tests=$(resolve "$IN_SKIP_NEXT_UI_TESTS" false)"
            echo "skip_github_it=$(resolve "$IN_SKIP_GITHUB_IT" true)"
            echo "skip_bitbucket_cloud_it=$(resolve "$IN_SKIP_BITBUCKET_CLOUD_IT" true)"
            echo "skip_gitlab_it=$(resolve "$IN_SKIP_GITLAB_IT" true)"
          } >> "$GITHUB_OUTPUT"

          cat "$GITHUB_OUTPUT"

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ steps.params.outputs.gradle_cache_read_only }}

      - name: Compute the version
        id: version
        env:
          BRANCH_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          ./gradlew writeVersion --stacktrace --parallel --console plain

          # What Gradle tags the Docker images with.
          BASE_VERSION="$(cat build/version.txt)"
          VERSION="$BASE_VERSION"

          # Every build on a release branch is a release candidate: this workflow no longer
          # produces a release version at all. `release.yml` publishes an rc build under its base
          # version, which is where `5.0.42` comes from now (#1672).
          #
          # `release/*` is a patch branch for the previous minor (#1702): its builds go through
          # the same pipeline and are published by release.yml just as main's are, so their GHCR
          # tags need the same `-rc-<run>` suffix to keep from colliding with a published version.
          # See doc/dev-guide/patch-release.md.
          #
          # `v<major>` is the development branch of the next major - a second `main`, with its own
          # VERSION file, its own promotion chain and its own environment - so it produces release
          # candidates just as main does. See doc/dev-guide/major-branch.md. Two patterns rather
          # than a regex because `case` globs cannot express `v[0-9]+`; `v6-spring-boot-4` is a
          # feature branch and deliberately matches neither, exactly as in `VersionCalculator`.
          case "$BRANCH_NAME" in
            main|release/*|v[0-9]|v[0-9][0-9]) VERSION="${BASE_VERSION}-rc-${RUN_NUMBER}" ;;
          esac

          echo "base_version=$BASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Base version = $BASE_VERSION"
          echo "Version      = $VERSION"
          echo "### Version \`$VERSION\`" >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------------------------
  # Registers the Yontrack build. Runs first and does nothing else.
  # ---------------------------------------------------------------------------------------------

  yontrack:
    name: Yontrack
    needs: setup
    if: needs.setup.outputs.full_run == 'true'
    # The one thing that cannot run in parallel. Yontrack orders builds by insertion id --
    # `StructureJdbcRepository.getPreviousBuild` is `ORDER BY ID DESC`, and the comment above it
    # states that a higher id *is* a later build and that the whole build model rests on it. Two
    # runs registering inside the same few seconds could therefore record main's commits in the
    # wrong order, and `getPreviousBuild` being wrong poisons the change log the SILVER/GOLD
    # notification renders, the "latest BRONZE on main" default of demo-deploy.yml, and every
    # auto-versioning boundary.
    #
    # A job-level group keyed on the branch serialises registration -- twelve seconds of it --
    # while the rest of the run stays parallel.
    #
    # Read what that buys precisely: the group makes registration mutually exclusive, it does
    # not order it by commit. Which run enters first is whichever reaches this job first, and a
    # run reaches it 65-95 s after starting (`setup`, then the checkout here). Two pushes
    # further apart than that spread register in order; two pushes inside it can still invert.
    # ADR 0014 records the residual window and what closing it would take.
    concurrency:
      group: ci-yontrack-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      project: ${{ steps.config.outputs.projectName }}
    steps:
      - uses: actions/checkout@v7

      - name: Register the build
        id: config
        uses: nemerosa/ontrack-github-actions-cli-config@v2.0.0
        env:
          YONTRACK_URL: ${{ vars.YONTRACK_URL }}
          YONTRACK_TOKEN: ${{ secrets.YONTRACK_TOKEN }}
          # Forwarded to the ci.yaml template as `--env VERSION=...`; the `environment-regex`
          # condition in .yontrack/ci.yaml keys the release notification off it.
          VERSION: ${{ needs.setup.outputs.version }}
        with:
          version: ${{ env.YONTRACK_CLI_VERSION }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Record the version on the build
        env:
          VERSION: ${{ needs.setup.outputs.version }}
        run: yontrack build set-property release "$VERSION"

  # ---------------------------------------------------------------------------------------------
  # Compile, unit tests, backend Docker image.
  #
  # The frontend is not here: its Jest suite and its image depend on nothing this job produces, so
  # they run beside it in `build-ui` rather than after it (#1870).
  #
  # Integration tests are deliberately excluded: `build` -> `check` -> `integrationTest` drags in
  # 547 IT classes across 34 modules, which is by far the largest cost on a 4 vCPU runner. They
  # run in the sharded `integration` job instead.
  #
  # `buildDocs` is excluded for a different reason: it renders a nav that points at
  # ontrack-docs/docs/content/generated/, which is gitignored and produced by the ontrack-docs
  # integration tests. With those tests moved out of this job the site would silently come out
  # missing every generated section, so the docs are built where their generator runs.
  # ---------------------------------------------------------------------------------------------

  build:
    name: Build
    needs: [setup, yontrack]
    if: ${{ !cancelled() && needs.setup.result == 'success' && needs.yontrack.result != 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      VERSION: ${{ needs.setup.outputs.version }}
      BASE_VERSION: ${{ needs.setup.outputs.base_version }}
      FULL_RUN: ${{ needs.setup.outputs.full_run }}
      COVERAGE: ${{ needs.setup.outputs.coverage }}
    steps:
      # The run time reported for this job's validations is measured from here. A `run:` step is
      # the earliest point a workflow can observe: the runner's own "Set up job" precedes every
      # step and is not visible to any of them. Everything after this — checkout, toolchain setup,
      # cache restore — is part of what the job costs and is counted.
      - name: Record the job start
        id: job_start
        run: echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The nemerosa/ontrack-build image carried a global git identity, and the tests rely on
      # it: GitRepo.commit() runs `git commit` in a freshly `git init`ed repo, which fails
      # outright on a runner with no user.name/user.email. init.defaultBranch matches what the
      # image set, so the branch names the tests assert on stay the same.
      - name: Configure git
        run: |
          git config --global user.email "yontrack@nemerosa.net"
          git config --global user.name "Yontrack"
          git config --global init.defaultBranch main

      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ needs.setup.outputs.gradle_cache_read_only }}

      - name: Link to the Yontrack build
        if: env.FULL_RUN == 'true'
        uses: nemerosa/ontrack-github-actions-cli-library/ontrack-cli-workflow-build@v1.0.3
        with:
          project: ${{ needs.yontrack.outputs.project }}
          yontrack-url: ${{ vars.YONTRACK_URL }}
          yontrack-token: ${{ secrets.YONTRACK_TOKEN }}
          version: ${{ env.YONTRACK_CLI_VERSION }}

      - name: Build
        id: build
        run: |
          set -euo pipefail
          # The versioning plugin's own tests. They gate the version computation every other
          # job depends on, and `build` does not reach into buildSrc on its own.
          ./gradlew :buildSrc:test --stacktrace --console plain

          # Test coverage (#1821). `-Pcoverage` turns the JaCoCo agent on for the `test` tasks
          # (#1818). It is off on every other branch, which is what keeps a pull request's build
          # exactly what it was.
          coverage_args=""
          if [ "${COVERAGE:-false}" = "true" ]; then
            coverage_args="-Pcoverage"
          fi

          # `-x :ontrack-web-core:test` takes the Jest suite, and the npm install in front of it,
          # out of this job: `build-ui` runs it (#1870).
          # shellcheck disable=SC2086  # deliberate: empty or a single word
          ./gradlew build -x integrationTest -x buildDocs -x :ontrack-web-core:test $coverage_args \
            --stacktrace \
            --parallel \
            --console plain

      # `outcome` is empty only when the step was skipped, so a broken build still records
      # FAILED — which is the case worth seeing in Yontrack.
      #
      # BUILD reports the job up to this point. Jenkins did the same: `adaptRunInfo()` gave every
      # validation in a stage that stage's duration. What is left out here is what the job does
      # afterwards: building and pushing the Docker image, which the stamp is not about.
      #
      # `--run-time` goes after the `junit` subcommand: `validateJUnitTestsCmd` redeclares the five
      # run-info flags on itself, so that is where they are read from.
      #
      # The glob names `test-results/test` rather than the whole of `test-results`: this job runs
      # `build -x integrationTest`, so the integration results are not in this workspace anyway,
      # and the wider glob only read as if BUILD still covered them. They land on INTEGRATION,
      # reported from integration-report (#1656).
      - name: Validate BUILD
        if: ${{ !cancelled() && env.FULL_RUN == 'true' && steps.build.outcome != '' }}
        env:
          STARTED: ${{ steps.job_start.outputs.started }}
        run: |
          run_time_flag=""
          if [ -n "${STARTED:-}" ]; then
            run_time_flag="--run-time $(( $(date +%s) - STARTED ))"
          fi
          # shellcheck disable=SC2086  # deliberate: see YONTRACK_RUN_INFO
          yontrack validate --validation BUILD \
            junit --pattern "**/build/test-results/test/*.xml" --fail-when-no-results \
            $run_time_flag $YONTRACK_RUN_INFO

      # Jenkins archived these; without them a unit-test failure is only visible as a class
      # name in the log, with no stack trace.
      - name: Upload the test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-test-reports
          path: |
            **/build/reports/tests/**
            **/build/test-results/**/*.xml
          if-no-files-found: ignore
          retention-days: 7

      # --- Test coverage (#1821) ------------------------------------------------------------
      #
      # always(), not !cancelled() and not failure(): a job killed by timeout-minutes counts as
      # cancelled, and an artefact lost there leaves the report job computing a merged figure over
      # part of the suite — which reads as a real coverage drop rather than as the accident it is.
      # `kdsl` and `ui-tests` already upload their JUnit reports this way for the same reason.
      #
      # 7 days: only the `coverage` job reads these, and it runs minutes later. The reports it
      # produces from them are the 30-day artefacts.

      - name: Upload the unit test coverage
        if: ${{ always() && env.COVERAGE == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-unit
          path: '**/build/jacoco/test.exec'
          if-no-files-found: ignore
          retention-days: 7

      # A JaCoCo report needs the *exact* class files that were executed, plus the sources. The
      # `integration`, `kdsl` and `ui-tests` runners have their own checkouts and their own — or
      # no — build output, and the report job has neither, so they travel from here.
      #
      # These are the production classes Jib packages into the image, which is what makes them
      # valid against the data the agent collects inside that container (#1819).
      #
      # Everything is uploaded and the exclusion list is applied on the report, in
      # scripts/coverage-report.sh: the denominator is one decision written down in one place, and
      # a copy of it in this glob would be a second one, free to drift.
      - name: Upload the classes and sources
        if: ${{ always() && env.COVERAGE == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-classes
          path: |
            **/build/classes/java/main/**
            **/build/classes/kotlin/main/**
            **/src/main/java/**
            **/src/main/kotlin/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Build the Docker image
        run: |
          ./gradlew :ontrack-ui:dockerBuild \
            --stacktrace \
            --parallel \
            --console plain

      # On Jenkins one agent shared a Docker daemon and the images just stayed put. Across
      # runners they have to be transferred; GHCR is free for public repositories and far
      # faster than `docker save` through upload-artifact.
      - name: Log in to GHCR
        if: env.FULL_RUN == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the image to GHCR
        if: env.FULL_RUN == 'true'
        run: |
          set -euo pipefail
          docker tag "nemerosa/ontrack:$BASE_VERSION" "$GHCR_ONTRACK:$RUN_TAG"
          docker push "$GHCR_ONTRACK:$RUN_TAG"

          # `:run-<id>` is scoped to this run and means nothing once it ends. `:$VERSION` is
          # durable and version-shaped, so one identifier spans CI, the Yontrack build name,
          # the gitops diff and the running pod — which is what lets a BRONZE rc build be
          # deployed to an environment at all.
          #
          # This never collides across branches: on main, release/* and the next-major branch the
          # version carries the `-rc-<run_number>` suffix, on a release run it is the release
          # itself, and on a feature branch VersionCalculator already appends the branch name and
          # short commit.
          docker tag "nemerosa/ontrack:$BASE_VERSION" "$GHCR_ONTRACK:$VERSION"
          docker push "$GHCR_ONTRACK:$VERSION"

  # ---------------------------------------------------------------------------------------------
  # Frontend: Jest suite and the UI Docker image, beside `build` rather than after it (#1870).
  #
  # Neither depends on anything the Kotlin build produces, and in series they added the whole of
  # `next build` - two to four minutes - to the job every test job waits on. The jobs consuming the
  # images need both `build` and this one.
  # ---------------------------------------------------------------------------------------------

  build-ui:
    name: Build UI
    needs: [setup, yontrack]
    if: ${{ !cancelled() && needs.setup.result == 'success' && needs.yontrack.result != 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.setup.outputs.version }}
      BASE_VERSION: ${{ needs.setup.outputs.base_version }}
      FULL_RUN: ${{ needs.setup.outputs.full_run }}
      COVERAGE: ${{ needs.setup.outputs.coverage }}
    steps:
      # The run time reported for this job's validations is measured from here. A `run:` step is
      # the earliest point a workflow can observe: the runner's own "Set up job" precedes every
      # step and is not visible to any of them. Everything after this — checkout, toolchain setup,
      # cache restore — is part of what the job costs and is counted.
      - name: Record the job start
        id: job_start
        run: echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"

      # The full history for the same reason as everywhere else: the image is tagged with the
      # project version, which the versioning plugin computes from the tags.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The JDK is for Gradle itself, which drives the node plugin and the image build.
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ needs.setup.outputs.gradle_cache_read_only }}

      # No actions/setup-node: the Gradle node plugin downloads its own Node (24.21.0 for
      # ontrack-web-core), and a runner-level Node would fight it.
      - name: Cache the npm downloads
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('ontrack-web-core/package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      - name: Link to the Yontrack build
        if: env.FULL_RUN == 'true'
        uses: nemerosa/ontrack-github-actions-cli-library/ontrack-cli-workflow-build@v1.0.3
        with:
          project: ${{ needs.yontrack.outputs.project }}
          yontrack-url: ${{ vars.YONTRACK_URL }}
          yontrack-token: ${{ secrets.YONTRACK_TOKEN }}
          version: ${{ env.YONTRACK_CLI_VERSION }}

      # The suite runs once. On a coverage run that is `testCoverage` (#1820), the same suite with
      # `--coverage`, which writes the same JUnit report as `test` does - running `test` as well
      # would only run it a second time. The image build below then skips `test`, which
      # `dockerBuild` depends on, for the same reason.
      - name: UI unit tests
        id: test
        run: |
          set -euo pipefail
          if [ "${COVERAGE:-false}" = "true" ]; then
            ./gradlew :ontrack-web-core:testCoverage -Pcoverage --stacktrace --console plain
          else
            ./gradlew :ontrack-web-core:test --stacktrace --console plain
          fi

      # `outcome` is empty only when the step was skipped, so failing tests still record FAILED.
      #
      # `--run-time` goes after the `junit` subcommand: `validateJUnitTestsCmd` redeclares the five
      # run-info flags on itself, so that is where they are read from.
      - name: Validate UI_UNIT
        if: ${{ !cancelled() && env.FULL_RUN == 'true' && steps.test.outcome != '' }}
        env:
          STARTED: ${{ steps.job_start.outputs.started }}
        run: |
          run_time_flag=""
          if [ -n "${STARTED:-}" ]; then
            run_time_flag="--run-time $(( $(date +%s) - STARTED ))"
          fi
          # shellcheck disable=SC2086  # deliberate: see YONTRACK_RUN_INFO
          yontrack validate --validation UI_UNIT \
            junit --pattern "ontrack-web-core/reports/*.xml" --fail-when-no-results \
            $run_time_flag $YONTRACK_RUN_INFO

      - name: Upload the test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-ui-test-reports
          path: ontrack-web-core/reports/**
          if-no-files-found: ignore
          retention-days: 7

      # always(), not !cancelled(): see the coverage uploads of `build`.
      - name: Upload the Jest coverage
        if: ${{ always() && env.COVERAGE == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-jest
          path: ontrack-web-core/coverage/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Build the Docker image
        run: |
          ./gradlew :ontrack-web-core:dockerBuild -x :ontrack-web-core:test \
            --stacktrace \
            --console plain

      - name: Log in to GHCR
        if: env.FULL_RUN == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The same two tags as the backend image, for the same reasons: see `build`.
      - name: Push the image to GHCR
        if: env.FULL_RUN == 'true'
        run: |
          set -euo pipefail
          docker tag "nemerosa/ontrack-ui:$BASE_VERSION" "$GHCR_ONTRACK_UI:$RUN_TAG"
          docker push "$GHCR_ONTRACK_UI:$RUN_TAG"
          docker tag "nemerosa/ontrack-ui:$BASE_VERSION" "$GHCR_ONTRACK_UI:$VERSION"
          docker push "$GHCR_ONTRACK_UI:$VERSION"

  # ---------------------------------------------------------------------------------------------
  # Integration tests, sharded. Each shard brings up its own compose/docker-compose-it.yml stack
  # (via the integrationTest -> integrationTestComposeUp dependency) — they are isolated per
  # runner, so that is safe. A runner is a fresh clone, so it takes slot 0 and the historical
  # ports; see docs/adr/0012-parallel-integration-test-stacks.md.
  # ---------------------------------------------------------------------------------------------

  integration:
    name: Integration (shard ${{ matrix.shard }})
    needs: [setup, build]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      # Keep INTEGRATION_SHARDS at the top of this file equal to the number of legs below.
      matrix:
        include:
          - shard: 1
            modules: >-
              ontrack-service
              ontrack-extension-notifications
              ontrack-extension-slack
              ontrack-extension-queue
              ontrack-extension-influxdb
              ontrack-extension-jenkins
              ontrack-extension-jira
              ontrack-extension-sonarqube
              ontrack-extension-stale
          - shard: 2
            modules: >-
              ontrack-ui-graphql
              ontrack-extension-casc
              ontrack-ui
              ontrack-repository-impl
          - shard: 3
            modules: >-
              ontrack-extension-general
              ontrack-extension-environments
              ontrack-extension-indicators
              ontrack-extension-chart
              ontrack-extension-config
              ontrack-extension-findings
          - shard: 4
            modules: >-
              ontrack-extension-auto-versioning
              ontrack-extension-git
              ontrack-extension-scm
              ontrack-extension-workflows
              ontrack-extension-stash
          - shard: 5
            modules: >-
              ontrack-extension-github
              ontrack-docs
              ontrack-extension-bitbucket-cloud
              ontrack-extension-hook
              ontrack-extension-tfc
              ontrack-extension-elastic
              ontrack-extension-delivery-metrics
              ontrack-extension-gitlab
              ontrack-extension-vault
              ontrack-extension-recordings
              ontrack-extension-issues
              ontrack-extension-artifactory
    env:
      # Test coverage (#1821). The suffix names this shard in the session ID of the execution data
      # the agent writes — `integration-3` — so that the merged report's Sessions page shows which
      # leg a class was covered from. Set whatever the gate says: without `-Pcoverage` the agent is
      # off and the name is never used.
      COVERAGE: ${{ needs.setup.outputs.coverage }}
      COVERAGE_SESSION_SUFFIX: ${{ matrix.shard }}
      # Bitbucket Cloud system tests, against the test workspace provisioned by
      # ontrack-extension-bitbucket-cloud/scripts/bitbucket-cloud-test-workspace.sh (see the module's README).
      # The tests skip when no credential is set, and fail when only some are.
      ONTRACK_TEST_EXTENSION_BITBUCKET_CLOUD_WORKSPACE: ${{ secrets.ONTRACK_TEST_EXTENSION_BITBUCKET_CLOUD_WORKSPACE }}
      ONTRACK_TEST_EXTENSION_BITBUCKET_CLOUD_PROJECT: ${{ secrets.ONTRACK_TEST_EXTENSION_BITBUCKET_CLOUD_PROJECT }}
      ONTRACK_TEST_EXTENSION_BITBUCKET_CLOUD_REPOSITORY: ${{ secrets.ONTRACK_TEST_EXTENSION_BITBUCKET_CLOUD_REPOSITORY }}
      ONTRACK_TEST_EXTENSION_BITBUCKET_CLOUD_BOT_EMAIL: ${{ secrets.ONTRACK_TEST_EXTENSION_BITBUCKET_CLOUD_BOT_EMAIL }}
      ONTRACK_TEST_EXTENSION_BITBUCKET_CLOUD_BOT_TOKEN: ${{ secrets.ONTRACK_TEST_EXTENSION_BITBUCKET_CLOUD_BOT_TOKEN }}
      ONTRACK_TEST_EXTENSION_BITBUCKET_CLOUD_APPROVER_EMAIL: ${{ secrets.ONTRACK_TEST_EXTENSION_BITBUCKET_CLOUD_APPROVER_EMAIL }}
      ONTRACK_TEST_EXTENSION_BITBUCKET_CLOUD_APPROVER_TOKEN: ${{ secrets.ONTRACK_TEST_EXTENSION_BITBUCKET_CLOUD_APPROVER_TOKEN }}
      ONTRACK_TEST_EXTENSION_BITBUCKET_CLOUD_ACCESS_TOKEN: ${{ secrets.ONTRACK_TEST_EXTENSION_BITBUCKET_CLOUD_ACCESS_TOKEN }}
      ONTRACK_TEST_EXTENSION_BITBUCKET_CLOUD_TOKENS_EXPIRY: ${{ vars.ONTRACK_TEST_EXTENSION_BITBUCKET_CLOUD_TOKENS_EXPIRY }}
      ONTRACK_TEST_EXTENSION_BITBUCKET_CLOUD_IGNORE: ${{ needs.setup.outputs.skip_bitbucket_cloud_it }}
      # Real pipeline tests consume build minutes (Free plan: 50 a month), so they never run in this workflow.
      # Pinned off exactly as the GitLab switch below: .github/workflows/bitbucket-real.yml is the only
      # place which turns this on, on BRONZE of main and behind a cooldown, and reports BITBUCKET.REAL
      # on the promoted build (#1761).
      ONTRACK_TEST_EXTENSION_BITBUCKET_CLOUD_PIPELINES: "false"
      # GitLab system tests, against the gitlab.com group provisioned by
      # ontrack-extension-gitlab/scripts/gitlab-test-project.sh (see the module's README).
      # API-only: nothing here starts a pipeline, so nothing here consumes a compute minute - the
      # pipeline tests get their own workflow (#1835). The tests skip when no credential is set, and
      # fail when only some are.
      ONTRACK_TEST_EXTENSION_GITLAB_GROUP: ${{ secrets.ONTRACK_TEST_EXTENSION_GITLAB_GROUP }}
      ONTRACK_TEST_EXTENSION_GITLAB_PROJECT: ${{ secrets.ONTRACK_TEST_EXTENSION_GITLAB_PROJECT }}
      ONTRACK_TEST_EXTENSION_GITLAB_TOKEN: ${{ secrets.ONTRACK_TEST_EXTENSION_GITLAB_TOKEN }}
      ONTRACK_TEST_EXTENSION_GITLAB_TOKEN_EXPIRY: ${{ vars.ONTRACK_TEST_EXTENSION_GITLAB_TOKEN_EXPIRY }}
      ONTRACK_TEST_EXTENSION_GITLAB_IGNORE: ${{ needs.setup.outputs.skip_gitlab_it }}
      # Pinned off, exactly as the Bitbucket Cloud switch above: the tests which start a pipeline are the
      # ones which cost compute minutes, and .github/workflows/gitlab-real.yml is the only place which
      # turns this on (#1835). Without it a checkout which does have the secrets would start a pipeline
      # per real pipeline test, on every push of every branch.
      ONTRACK_TEST_EXTENSION_GITLAB_PIPELINES: "false"
      # GitHub system tests: credentials first, then the fixture values below, which are plain
      # configuration and deliberately not secrets.
      ONTRACK_TEST_EXTENSION_GITHUB_USER: ${{ secrets.ONTRACK_TEST_EXTENSION_GITHUB_USER }}
      ONTRACK_TEST_EXTENSION_GITHUB_TOKEN: ${{ secrets.ONTRACK_TEST_EXTENSION_GITHUB_TOKEN }}
      ONTRACK_TEST_EXTENSION_GITHUB_APP_PEM: ${{ secrets.ONTRACK_TEST_EXTENSION_GITHUB_APP_PEM }}
      ONTRACK_TEST_EXTENSION_GITHUB_IGNORE: ${{ needs.setup.outputs.skip_github_it }}
      ONTRACK_TEST_EXTENSION_GITHUB_ORGANIZATION: nemerosa
      ONTRACK_TEST_EXTENSION_GITHUB_REPOSITORY: ontrack-github-integration-test
      ONTRACK_TEST_EXTENSION_GITHUB_BRANCH: v1
      ONTRACK_TEST_EXTENSION_GITHUB_PR: "3"
      ONTRACK_TEST_EXTENSION_GITHUB_TEAM: ontrack-integration-tests
      ONTRACK_TEST_EXTENSION_GITHUB_APP_ID: "143291"
      ONTRACK_TEST_EXTENSION_GITHUB_APP_INSTALLATION: nemerosa
      ONTRACK_TEST_EXTENSION_GITHUB_PATHS_IMAGES_PROMOTION: images/iron.png
      ONTRACK_TEST_EXTENSION_GITHUB_PATHS_IMAGES_VALIDATION: images/site.png
      ONTRACK_TEST_EXTENSION_GITHUB_CHANGELOG_FROM: 5b0db7c7132eaf29820b42aef3a018a47e1f411f
      ONTRACK_TEST_EXTENSION_GITHUB_CHANGELOG_TO: 36e95eded56bcfead06a55238ccb315fbfe211a8
      ONTRACK_TEST_EXTENSION_GITHUB_CHANGELOG_MESSAGES: nemerosa/ontrack#978 Promotion image|nemerosa/ontrack#978 Validation image|nemerosa/ontrack#928 Explicitly skipping the jobs|nemerosa/ontrack#928 Sample GitHub ingestion configuration file
      ONTRACK_TEST_EXTENSION_GITHUB_ISSUES_FROM: 36e95eded56bcfead06a55238ccb315fbfe211a8
      ONTRACK_TEST_EXTENSION_GITHUB_ISSUES_ISSUE: "1"
      ONTRACK_TEST_EXTENSION_GITHUB_ISSUES_ISSUE_COMMIT: 901130bc4655a8180c2034f0619768c7343095bb
      ONTRACK_TEST_EXTENSION_GITHUB_ISSUES_ISSUESUMMARY: Test issue
      ONTRACK_TEST_EXTENSION_GITHUB_ISSUES_TO: 901130bc4655a8180c2034f0619768c7343095bb
      ONTRACK_TEST_EXTENSION_GITHUB_ISSUES_MESSAGES: "#1 Commit with issue"
      ONTRACK_TEST_EXTENSION_GITHUB_ISSUES_ISSUELABELS: type:defect
      ONTRACK_TEST_EXTENSION_GITHUB_ISSUES_MILESTONE: v1
      ONTRACK_TEST_EXTENSION_GITHUB_ACTIONS_WORKFLOWID: main.yml
      ONTRACK_TEST_EXTENSION_GITHUB_ACTIONS_BRANCH: main
    steps:
      # The run time reported for this job is measured from here. A `run:` step is the earliest
      # point a workflow can observe: the runner's own "Set up job" precedes every step and is not
      # visible to any of them. Everything after this — checkout, toolchain setup, cache restore —
      # is part of what the job costs and is counted.
      - name: Record the job start
        id: job_start
        run: echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The nemerosa/ontrack-build image carried a global git identity, and the tests rely on
      # it: GitRepo.commit() runs `git commit` in a freshly `git init`ed repo, which fails
      # outright on a runner with no user.name/user.email. init.defaultBranch matches what the
      # image set, so the branch names the tests assert on stay the same.
      - name: Configure git
        run: |
          git config --global user.email "yontrack@nemerosa.net"
          git config --global user.name "Yontrack"
          git config --global init.defaultBranch main

      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ needs.setup.outputs.gradle_cache_read_only }}

      # ontrack-docs' documentation ITs shell out to `dot`.
      - name: Install graphviz
        if: matrix.shard == 5
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y graphviz

      - name: Integration tests
        id: test
        env:
          MODULES: ${{ matrix.modules }}
        run: |
          set -euo pipefail
          TASKS=""
          for module in $MODULES; do
            TASKS="$TASKS :$module:integrationTest"
          done
          echo "Running:$TASKS"
          coverage_args=""
          if [ "${COVERAGE:-false}" = "true" ]; then
            coverage_args="-Pcoverage"
          fi
          # integrationTest forks a 3072m JVM per module and --parallel will happily run
          # several at once; two workers is what a 16 GB runner takes alongside the compose
          # stack without turning into an OOM.
          # shellcheck disable=SC2086
          ./gradlew $TASKS $coverage_args \
            --stacktrace \
            --parallel \
            --max-workers 2 \
            --console plain

      # INTEGRATION is validated from integration-report, which has no span of its own worth
      # reporting — collecting artefacts takes seconds where the tests take tens of minutes. Each
      # shard therefore hands its own job duration over inside its artefact, and the reporting job
      # takes the slowest, which is the wall clock of the parallel shards.
      - name: Record the run time
        if: ${{ !cancelled() && steps.test.outcome != '' }}
        # Bookkeeping for a nice-to-have number: it must never be what turns a passing shard red.
        continue-on-error: true
        env:
          STARTED: ${{ steps.job_start.outputs.started }}
        run: |
          set -euo pipefail
          if [ -z "${STARTED:-}" ]; then
            echo "The integration tests never started; nothing to record."
            exit 0
          fi
          mkdir -p build
          echo "$(( $(date +%s) - STARTED ))" > build/integration-run-time.txt

      # Uploaded whatever the outcome: these are what integration-report validates INTEGRATION
      # from, so a *passing* shard has to publish its results too. Under `if: failure()` the
      # aggregator would have seen an empty set on every green run (#1656).
      - name: Upload the test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: integration-results-shard-${{ matrix.shard }}
          path: |
            **/build/test-results/integrationTest/**/*.xml
            build/integration-run-time.txt
          if-no-files-found: ignore
          retention-days: 7

      # always(), not !cancelled(): see the coverage uploads in `build`.
      - name: Upload the integration test coverage
        if: ${{ always() && env.COVERAGE == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-integration-${{ matrix.shard }}
          path: '**/build/jacoco/integrationTest.exec'
          if-no-files-found: ignore
          retention-days: 7

  # ---------------------------------------------------------------------------------------------
  # One INTEGRATION validation for all the shards. Validating from each matrix job would create
  # one run per shard on the same stamp and the promotion would then read whichever landed last.
  #
  # The shards run on separate runners, so their JUnit reports are never in one workspace: they
  # are collected here from the artefacts instead. Until this job existed the integration results
  # were reported nowhere at all and BRONZE was granted with them red (#1656).
  # ---------------------------------------------------------------------------------------------

  integration-report:
    name: Integration tests report
    needs: [setup, yontrack, integration]
    if: ${{ !cancelled() && needs.setup.outputs.full_run == 'true' && needs.integration.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Collect the test results
        id: collect
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: integration-results-shard-*
          path: integration-results

      # Flattened deliberately. upload-artifact roots each artefact at the least common ancestor
      # of the files it matched, so the depth the reports land at varies with how many modules a
      # shard produced them for; collecting them into one flat directory keeps the stamp's glob
      # independent of that.
      #
      # The name is the shard plus the report's own name — `TEST-<fqcn>.xml`, already unique across
      # modules — rather than the flattened path, which for the longest test class in the suite
      # comes to 242 bytes against ext4's 255-byte limit: one longer class name and `cp` would
      # start failing with ENAMETOOLONG, turning a passing run into a FAILED stamp.
      #
      # Failing here is what makes the stamp FAILED below, so both checks are deliberate errors.
      - name: Lay the reports out
        id: layout
        if: ${{ !cancelled() && steps.collect.outcome != '' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p integration-junit
          while IFS= read -r xml; do
            # integration-results/integration-results-shard-3/... -> shard-3
            rest="${xml#integration-results/}"
            shard="${rest%%/*}"
            cp "$xml" "integration-junit/${shard#integration-results-}_$(basename "$xml")"
          done < <(find integration-results -name '*.xml')
          ls integration-junit

          # Every shard uploads whatever its outcome, so a missing artefact means a leg vanished,
          # not that it had nothing to report. A stamp computed from four fifths of the suite is
          # the same silence #1656 is about, so an incomplete set is as bad as an empty one.
          shards="$(find integration-results -mindepth 1 -maxdepth 1 -type d \
            -name 'integration-results-shard-*' | wc -l)"
          echo "Collected $shards of $INTEGRATION_SHARDS shard artefacts."
          [ -n "$(ls -A integration-junit)" ]
          [ "$shards" -eq "$INTEGRATION_SHARDS" ]

      - name: Link to the Yontrack build
        if: ${{ !cancelled() }}
        uses: nemerosa/ontrack-github-actions-cli-library/ontrack-cli-workflow-build@v1.0.3
        with:
          project: ${{ needs.yontrack.outputs.project }}
          yontrack-url: ${{ vars.YONTRACK_URL }}
          yontrack-token: ${{ secrets.YONTRACK_TOKEN }}
          version: ${{ env.YONTRACK_CLI_VERSION }}

      # If the reports never made it here the stamp still has to say so, rather than the job dying
      # quietly and leaving INTEGRATION absent from the build — which is exactly the hole BRONZE
      # used to be granted through.
      - name: Validate INTEGRATION
        if: ${{ !cancelled() && steps.layout.outcome != '' }}
        env:
          LAYOUT_OUTCOME: ${{ steps.layout.outcome }}
          # The matrix as a whole: `failure` as soon as one shard is red.
          SHARDS_RESULT: ${{ needs.integration.result }}
        run: |
          # The slowest of the shards, written by each leg into its artefact. Left empty when no
          # artefact arrived at all — a made-up duration is worse than none, so the flag is then
          # omitted and the rest of the run info still goes out.
          run_time="$(find integration-results -name 'integration-run-time.txt' -exec cat {} + \
            2>/dev/null | sort -n | tail -n 1 || true)"
          run_time_flag=""
          if [ -n "$run_time" ]; then
            run_time_flag="--run-time $run_time"
          fi

          # A red shard whose reports all look green — killed by an OOM, or a compose stack that
          # never came up — would otherwise pass the stamp on results that were never produced.
          # The JUnit path is kept wherever there *is* a failing test to explain the red, because
          # it reports FAILED with the test counts, which `--status FAILED` cannot carry.
          #
          # The counts are read off the `<testsuite>` header attributes rather than by looking for
          # `<failure>` elements: Gradle captures the tests' stdout into `<system-out>`, so a test
          # that logs a document of its own could otherwise pass for a failure and explain away a
          # red shard that had nothing to do with it.
          unexplained=false
          if [ "$LAYOUT_OUTCOME" = "success" ] && [ "$SHARDS_RESULT" != "success" ] \
            && ! grep -lE '(failures|errors)="[1-9]' integration-junit/*.xml > /dev/null 2>&1; then
            unexplained=true
            echo "The shards reported $SHARDS_RESULT with no failing test to account for it."
          fi

          if [ "$LAYOUT_OUTCOME" != "success" ] || [ "$unexplained" = "true" ]; then
            # shellcheck disable=SC2086  # deliberate: see YONTRACK_RUN_INFO
            yontrack validate --validation INTEGRATION --status FAILED \
              $run_time_flag $YONTRACK_RUN_INFO
          else
            # shellcheck disable=SC2086  # deliberate: see YONTRACK_RUN_INFO
            yontrack validate --validation INTEGRATION \
              junit --pattern "integration-junit/*.xml" --fail-when-no-results \
              $run_time_flag $YONTRACK_RUN_INFO
          fi

  # ---------------------------------------------------------------------------------------------
  # KDSL acceptance tests.
  # ---------------------------------------------------------------------------------------------

  kdsl:
    name: KDSL acceptance tests (shard ${{ matrix.shard }})
    needs: [setup, build, build-ui]
    if: >-
      ${{ !cancelled()
        && needs.build.result == 'success'
        && needs.build-ui.result == 'success'
        && needs.setup.outputs.full_run == 'true'
        && needs.setup.outputs.skip_kdsl_acceptance != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # Two shards takes this job from ~10 minutes to 7.1 and 7.6, measured. Most of a shard is not
      # test execution: the suite runs in 366s and the rest - Gradle configuration, compiling the
      # test source set, the image pull, `compose up` - is ~260s that every shard pays again. A
      # third shard would reach ~6.3, but the band would then be set by the slowest `integration`
      # leg at 6.7, so it buys ~0.9 minutes of critical path for a whole runner. See #1679 and
      # docs/adr/0005-test-suites-are-sharded-by-rule-not-by-list.md.
      #
      # Which class runs where is decided inside the test JVM by ShardingFilter, from the classes
      # the launcher discovered: nothing here lists them, so a new ACC class is always picked up.
      matrix:
        shard: [1, 2]
    env:
      # Read off the matrix rather than restated, so adding a leg is a one-line change and cannot
      # leave the shards computing a partition of the wrong size.
      SHARD_INDEX: ${{ matrix.shard }}
      SHARD_TOTAL: ${{ strategy.job-total }}
      # Test coverage (#1821). The backend of this stack runs in a container, so the agent gets in
      # through the Compose override of #1819 and its data is dumped over TCP below. The suffix
      # names the shard: `kdsl-1`, `kdsl-2`. COVERAGE_SESSION is left alone — this variant's
      # default session type is already `kdsl`; it is the Playwright job that renames it.
      COVERAGE: ${{ needs.setup.outputs.coverage }}
      COVERAGE_SESSION_SUFFIX: ${{ matrix.shard }}
      BASE_VERSION: ${{ needs.setup.outputs.base_version }}
      # The compose files resolve the images as nemerosa/ontrack:${ONTRACK_VERSION:-latest}.
      ONTRACK_VERSION: ${{ needs.setup.outputs.base_version }}
      # Non empty is enough to activate the GitHub tests
      ONTRACK_TEST_EXTENSION_GITHUB_ORGANIZATION: ${{ secrets.ONTRACK_ACCEPTANCE_GITHUB_ORGANIZATION }}
      ONTRACK_ACCEPTANCE_GITHUB_ORGANIZATION: ${{ secrets.ONTRACK_ACCEPTANCE_GITHUB_ORGANIZATION }}
      ONTRACK_ACCEPTANCE_GITHUB_TOKEN: ${{ secrets.ONTRACK_ACCEPTANCE_GITHUB_TOKEN }}
    steps:
      # The run time reported for this job's validations is measured from here. A `run:` step is
      # the earliest point a workflow can observe: the runner's own "Set up job" precedes every
      # step and is not visible to any of them. Everything after this — checkout, toolchain setup,
      # cache restore — is part of what the job costs and is counted.
      - name: Record the job start
        id: job_start
        run: echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The nemerosa/ontrack-build image carried a global git identity, and the tests rely on
      # it: GitRepo.commit() runs `git commit` in a freshly `git init`ed repo, which fails
      # outright on a runner with no user.name/user.email. init.defaultBranch matches what the
      # image set, so the branch names the tests assert on stay the same.
      - name: Configure git
        run: |
          git config --global user.email "yontrack@nemerosa.net"
          git config --global user.name "Yontrack"
          git config --global init.defaultBranch main

      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ needs.setup.outputs.gradle_cache_read_only }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore the Docker images
        run: |
          set -euo pipefail
          docker pull "$GHCR_ONTRACK:$RUN_TAG"
          docker pull "$GHCR_ONTRACK_UI:$RUN_TAG"
          docker tag "$GHCR_ONTRACK:$RUN_TAG" "nemerosa/ontrack:$BASE_VERSION"
          docker tag "$GHCR_ONTRACK_UI:$RUN_TAG" "nemerosa/ontrack-ui:$BASE_VERSION"

      # Both kdslAcceptanceTestComposeUp and the uiTest compose dependencies are guarded behind
      # `isCI` in the Gradle build, so under CI=true the workflow is expected to bring the stack
      # up itself. Each shard runs on its own runner and therefore brings up its own stack, which
      # is what makes the shards independent — the suite shares one admin user and one set of
      # global settings, so two shards could not have shared an instance.
      #
      # `-Pcoverage` matters here as much as on the test step: it is what makes the Compose files
      # include compose/docker-compose-coverage.yml, which mounts the agent into the backend
      # container and publishes its port. Without it on *this* step there is no agent to dump from.
      - name: Start the environment
        run: |
          coverage_args=""
          if [ "${COVERAGE:-false}" = "true" ]; then
            coverage_args="-Pcoverage"
          fi
          # shellcheck disable=SC2086  # deliberate: empty or a single word
          ./gradlew :ontrack-kdsl-acceptance:kdslAcceptanceTestComposeUp $coverage_args \
            --stacktrace --console plain

      - name: KDSL acceptance tests
        id: kdsl
        run: |
          coverage_args=""
          if [ "${COVERAGE:-false}" = "true" ]; then
            coverage_args="-Pcoverage"
          fi
          # shellcheck disable=SC2086  # deliberate: empty or a single word
          ./gradlew :ontrack-kdsl-acceptance:kdslAcceptanceTest $coverage_args \
            -Dshard.index="$SHARD_INDEX" \
            -Dshard.total="$SHARD_TOTAL" \
            --stacktrace \
            --parallel \
            --console plain

      # The stack is brought up by this workflow under `isCI`, so nothing here stops it and the
      # dump is a step of its own rather than a Gradle finalizer. It runs whatever the tests did:
      # `output=tcpserver` means the data is still in the container's agent, and a red suite's
      # coverage is worth exactly as much as a green one's.
      #
      # A dump that cannot reach the agent warns rather than failing (#1819) and writes nothing.
      # The missing file is the signal, and `scripts/coverage-report.sh check` turns it into a
      # named, failing session rather than a quietly smaller figure.
      - name: Dump the coverage of the backend container
        if: ${{ always() && env.COVERAGE == 'true' }}
        run: |
          ./gradlew :ontrack-kdsl-acceptance:kdslAcceptanceTestCoverageDump -Pcoverage \
            --stacktrace --console plain

      # KDSL.ACCEPTANCE is validated from kdsl-report, which has no span of its own worth reporting.
      # Each shard therefore hands its own job duration over inside its artefact and the reporting
      # job takes the slowest, which is the wall clock of the parallel shards. The measured span is
      # the whole job — restoring the images and bringing the environment up included. They are what
      # an acceptance test run costs here, not overhead beside it.
      - name: Record the run time
        if: ${{ !cancelled() && steps.kdsl.outcome != '' }}
        # Bookkeeping for a nice-to-have number: it must never be what turns a passing shard red.
        continue-on-error: true
        env:
          STARTED: ${{ steps.job_start.outputs.started }}
        run: |
          set -euo pipefail
          if [ -z "${STARTED:-}" ]; then
            echo "The KDSL acceptance tests never started; nothing to record."
            exit 0
          fi
          mkdir -p build
          echo "$(( $(date +%s) - STARTED ))" > build/kdsl-run-time.txt

      # always(), not !cancelled(): a shard killed by timeout-minutes counts as cancelled, and
      # skipping the upload there would leave the report job with a partial, all-green set.
      - name: Upload the test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kdsl-results-shard-${{ matrix.shard }}
          path: |
            ontrack-kdsl-acceptance/build/test-results/kdslAcceptanceTest/**/*.xml
            build/kdsl-run-time.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload the KDSL logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: kdsl-logs-shard-${{ matrix.shard }}
          path: ontrack-kdsl-acceptance/build/logs/**
          if-no-files-found: ignore
          retention-days: 7

      # always(), not !cancelled(): see the coverage uploads in `build`. The file is named after
      # its session — `kdsl-1.exec` — by the dump task, which is what lets the report job tell the
      # legs apart without trusting the artefact name.
      - name: Upload the KDSL coverage
        if: ${{ always() && env.COVERAGE == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-kdsl-${{ matrix.shard }}
          path: build/jacoco/*.exec
          if-no-files-found: ignore
          retention-days: 7

  # ---------------------------------------------------------------------------------------------
  # One KDSL.ACCEPTANCE validation for all the shards. Validating from each matrix job would create
  # one run per shard on the same stamp and the promotion would then read whichever landed last.
  #
  # The shards run on separate runners, so their JUnit reports are never in one workspace: they are
  # collected here from the artefacts instead.
  # ---------------------------------------------------------------------------------------------

  kdsl-report:
    name: KDSL acceptance tests report
    needs: [setup, yontrack, kdsl]
    if: ${{ !cancelled() && needs.setup.outputs.full_run == 'true' && needs.kdsl.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Collect the test results
        id: collect
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: kdsl-results-shard-*
          path: kdsl-results

      # Flattened deliberately, for the same reason integration-report flattens: upload-artifact
      # roots each artefact at the least common ancestor of the files it matched, so the depth the
      # reports land at varies with what a shard produced. The name is the shard plus the report's
      # own name — `TEST-<fqcn>.xml`, already unique — rather than the flattened path.
      - name: Lay the reports out
        id: layout
        if: ${{ !cancelled() && steps.collect.outcome != '' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p kdsl-junit
          while IFS= read -r xml; do
            # kdsl-results/kdsl-results-shard-2/... -> shard-2
            rest="${xml#kdsl-results/}"
            shard="${rest%%/*}"
            cp "$xml" "kdsl-junit/${shard#kdsl-results-}_$(basename "$xml")"
          done < <(find kdsl-results -name '*.xml')
          ls kdsl-junit
          [ -n "$(ls -A kdsl-junit)" ]

      - name: Link to the Yontrack build
        if: ${{ !cancelled() }}
        uses: nemerosa/ontrack-github-actions-cli-library/ontrack-cli-workflow-build@v1.0.3
        with:
          project: ${{ needs.yontrack.outputs.project }}
          yontrack-url: ${{ vars.YONTRACK_URL }}
          yontrack-token: ${{ secrets.YONTRACK_TOKEN }}
          version: ${{ env.YONTRACK_CLI_VERSION }}

      # If the reports never made it here the stamp still has to say so, rather than the job dying
      # quietly and leaving KDSL.ACCEPTANCE absent from the build.
      - name: Validate KDSL.ACCEPTANCE
        if: ${{ !cancelled() && steps.layout.outcome != '' }}
        env:
          LAYOUT_OUTCOME: ${{ steps.layout.outcome }}
          # The matrix as a whole: `failure` as soon as one shard is red, and not `success` when a
          # shard was cancelled by its timeout. A shard that dies uploads nothing and a partial set
          # of artefacts is indistinguishable from a complete one — the reports that *did* arrive
          # are all green — so the matrix result decides, not what turned up.
          SHARDS_RESULT: ${{ needs.kdsl.result }}
        run: |
          # The slowest of the shards, written by each leg into its artefact. Left empty when no
          # artefact arrived at all — a made-up duration is worse than none, so the flag is then
          # omitted and the rest of the run info still goes out.
          run_time="$(find kdsl-results -name 'kdsl-run-time.txt' -exec cat {} + \
            2>/dev/null | sort -n | tail -n 1 || true)"
          run_time_flag=""
          if [ -n "$run_time" ]; then
            run_time_flag="--run-time $run_time"
          fi

          if [ "$LAYOUT_OUTCOME" != "success" ] || [ "$SHARDS_RESULT" != "success" ]; then
            # shellcheck disable=SC2086  # deliberate: see YONTRACK_RUN_INFO
            yontrack validate --validation KDSL.ACCEPTANCE --status FAILED \
              $run_time_flag $YONTRACK_RUN_INFO
          else
            # shellcheck disable=SC2086  # deliberate: see YONTRACK_RUN_INFO
            yontrack validate --validation KDSL.ACCEPTANCE \
              junit --pattern "kdsl-junit/*.xml" --fail-when-no-results \
              $run_time_flag $YONTRACK_RUN_INFO
          fi

  # ---------------------------------------------------------------------------------------------
  # Playwright UI tests, one runner per authentication variant, and per shard of the main suite.
  # ---------------------------------------------------------------------------------------------

  ui-tests:
    name: UI tests (${{ matrix.label }})
    needs: [setup, build, build-ui]
    if: >-
      ${{ !cancelled()
        && needs.build.result == 'success'
        && needs.build-ui.result == 'success'
        && needs.setup.outputs.full_run == 'true'
        && needs.setup.outputs.skip_next_ui_tests != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # Two dimensions, and they mean different things. `variant` is the authentication mode the
      # stack runs in; `shard` is a partition of one suite across runners, as in `integration`.
      # Only `main` is sharded: ldap and oidc run `--grep '@auth'` and take three minutes.
      #
      # Two shards took `main` from ~10 minutes to 6.1 and 6.6 (#1679), but the suite kept growing
      # and they reached 8.7 and 9.4 - the slowest legs of the parallel band, above KDSL at 8.4 and
      # the slowest `integration` leg at 7.0. Hence three. See
      # docs/adr/0005-test-suites-are-sharded-by-rule-not-by-list.md.
      matrix:
        include:
          - variant: main
            label: main 1/3
            task: uiTest
            shard: 1
            shards: 3
          - variant: main
            label: main 2/3
            task: uiTest
            shard: 2
            shards: 3
          - variant: main
            label: main 3/3
            task: uiTest
            shard: 3
            shards: 3
          - variant: ldap
            label: ldap
            task: uiLdapTest
            shard: 1
            shards: 1
          - variant: oidc
            label: oidc
            task: uiOidcTest
            shard: 1
            shards: 1
    env:
      BASE_VERSION: ${{ needs.setup.outputs.base_version }}
      ONTRACK_VERSION: ${{ needs.setup.outputs.base_version }}
      # Test coverage (#1821). Two variables, and they do different things.
      #
      # COVERAGE_SESSION renames the one Compose variant two suites share: `docker-compose-kdsl.yml`
      # serves both the KDSL acceptance suite and the `main` Playwright leg, and its default session
      # type is `kdsl`. It is set unconditionally here because Coverage.containerSessionId honours it
      # for that variant *only* — ldap and oidc keep their own names however this is set, which is
      # what stops one job-level variable from collapsing three legs onto one session ID (#1819).
      #
      # COVERAGE_SESSION_SUFFIX applies to every variant, so it is set on the sharded legs only:
      # `ui-main-1`…`ui-main-3`, but plain `ui-ldap` and `ui-oidc`.
      COVERAGE: ${{ needs.setup.outputs.coverage }}
      COVERAGE_SESSION: ui-main
      COVERAGE_SESSION_SUFFIX: ${{ matrix.shards > 1 && matrix.shard || '' }}
    steps:
      # The run time reported for this job's validations is measured from here. A `run:` step is
      # the earliest point a workflow can observe: the runner's own "Set up job" precedes every
      # step and is not visible to any of them. Everything after this — checkout, toolchain setup,
      # cache restore — is part of what the job costs and is counted.
      - name: Record the job start
        id: job_start
        run: echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The nemerosa/ontrack-build image carried a global git identity, and the tests rely on
      # it: GitRepo.commit() runs `git commit` in a freshly `git init`ed repo, which fails
      # outright on a runner with no user.name/user.email. init.defaultBranch matches what the
      # image set, so the branch names the tests assert on stay the same.
      - name: Configure git
        run: |
          git config --global user.email "yontrack@nemerosa.net"
          git config --global user.name "Yontrack"
          git config --global init.defaultBranch main

      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ needs.setup.outputs.gradle_cache_read_only }}

      - name: Cache the npm downloads
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('ontrack-web-tests/package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      - name: Cache the Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('ontrack-web-tests/package-lock.json') }}
          restore-keys: playwright-${{ runner.os }}-

      # Only Playwright's *system* dependencies are installed here. The browsers themselves and
      # Node come from the Gradle node plugin (24.21.0 for ontrack-web-tests).
      - name: Install the Playwright system dependencies
        working-directory: ontrack-web-tests
        run: npx --yes playwright install-deps chromium

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore the Docker images
        run: |
          set -euo pipefail
          docker pull "$GHCR_ONTRACK:$RUN_TAG"
          docker pull "$GHCR_ONTRACK_UI:$RUN_TAG"
          docker tag "$GHCR_ONTRACK:$RUN_TAG" "nemerosa/ontrack:$BASE_VERSION"
          docker tag "$GHCR_ONTRACK_UI:$RUN_TAG" "nemerosa/ontrack-ui:$BASE_VERSION"

      # Only uiTest guards its compose dependency behind `isCI`, so only that variant needs the
      # stack started here. uiLdapTest and uiOidcTest dependOn their own composeUp
      # unconditionally (ontrack-web-tests/build.gradle.kts) and would otherwise start it twice.
      #
      # `-Pcoverage` is what pulls compose/docker-compose-coverage.yml into the Compose files, so
      # it belongs on this step as much as on the test one.
      - name: Start the environment
        if: matrix.variant == 'main'
        run: |
          coverage_args=""
          if [ "${COVERAGE:-false}" = "true" ]; then
            coverage_args="-Pcoverage"
          fi
          # shellcheck disable=SC2086  # deliberate: empty or a single word
          ./gradlew :ontrack-kdsl-acceptance:kdslAcceptanceTestComposeUp $coverage_args \
            --stacktrace --console plain

      # Playwright reads --shard from the command line only, so the Gradle build appends it to the
      # npm arguments from these properties. At 1 of 1 - ldap and oidc - it is left off entirely and
      # the whole suite runs, exactly as before.
      - name: UI tests
        id: test
        run: |
          coverage_args=""
          if [ "${COVERAGE:-false}" = "true" ]; then
            coverage_args="-Pcoverage"
          fi
          # shellcheck disable=SC2086  # deliberate: empty or a single word
          ./gradlew ":ontrack-web-tests:${{ matrix.task }}" $coverage_args \
            -Dshard.index=${{ matrix.shard }} \
            -Dshard.total=${{ matrix.shards }} \
            --stacktrace \
            --console plain

      # `main` only, and that asymmetry is the point. Only `uiTest` guards its Compose dependency
      # behind `isCI`, so only that leg's stack is owned by the workflow and still up at this point;
      # `uiLdapTest` and `uiOidcTest` bring their own up and take it down as a finalizer, with the
      # dump ordered before it (#1819), so their data has already left the container by now and a
      # dump here would only find nothing listening.
      #
      # Like the KDSL one, this runs whatever the tests did: the data is in the agent, not in a
      # file the suite writes, so a red leg's coverage is as collectable as a green one's.
      - name: Dump the coverage of the backend container
        if: ${{ always() && env.COVERAGE == 'true' && matrix.variant == 'main' }}
        run: |
          ./gradlew :ontrack-kdsl-acceptance:kdslAcceptanceTestCoverageDump -Pcoverage \
            --stacktrace --console plain

      # PLAYWRIGHT is validated from ui-tests-report, which has no span of its own worth
      # reporting — collecting artefacts takes seconds where the tests take minutes. Each variant
      # therefore hands its own job duration over inside its report artefact, and the reporting job
      # takes the slowest, which is the wall clock of the three parallel legs.
      - name: Record the run time
        if: ${{ !cancelled() && steps.test.outcome != '' }}
        # Bookkeeping for a nice-to-have number: it must never be what turns a passing UI test
        # run red.
        continue-on-error: true
        env:
          STARTED: ${{ steps.job_start.outputs.started }}
        run: |
          set -euo pipefail
          if [ -z "${STARTED:-}" ]; then
            echo "The UI tests never started; nothing to record."
            exit 0
          fi
          mkdir -p "ontrack-web-tests/reports/${{ matrix.variant }}/junit"
          echo "$(( $(date +%s) - STARTED ))" \
            > "ontrack-web-tests/reports/${{ matrix.variant }}/junit/run-time.txt"

      # All the legs land on one PLAYWRIGHT stamp, so the reports are collected and validated once
      # in ui-tests-report rather than once per leg.
      # always(), not !cancelled(): a leg killed by timeout-minutes counts as cancelled, and
      # skipping the upload there is what left the report job with a partial, all-green set.
      #
      # Every artefact below carries the shard as well as the variant: two legs of the same variant
      # would otherwise be uploading under one name.
      - name: Upload the JUnit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-junit-${{ matrix.variant }}-${{ matrix.shard }}
          path: |
            ontrack-web-tests/reports/${{ matrix.variant }}/junit/*.xml
            ontrack-web-tests/reports/${{ matrix.variant }}/junit/run-time.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload the HTML report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-html-${{ matrix.variant }}-${{ matrix.shard }}
          path: ontrack-web-tests/reports/${{ matrix.variant }}/html/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload the KDSL logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: kdsl-logs-ui-${{ matrix.variant }}-${{ matrix.shard }}
          path: ontrack-kdsl-acceptance/build/logs/**
          if-no-files-found: ignore
          retention-days: 7

      # always(), not !cancelled(): see the coverage uploads in `build`. The file inside is named
      # after its session — `ui-main-2.exec`, `ui-ldap.exec` — not after this artefact.
      - name: Upload the UI test coverage
        if: ${{ always() && env.COVERAGE == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-ui-${{ matrix.variant }}-${{ matrix.shard }}
          path: build/jacoco/*.exec
          if-no-files-found: ignore
          retention-days: 7

  # ---------------------------------------------------------------------------------------------
  # One PLAYWRIGHT validation for every leg of the matrix. Validating from each matrix job would
  # create one run per leg on the same stamp and the promotion would then read whichever landed
  # last.
  # ---------------------------------------------------------------------------------------------

  ui-tests-report:
    name: UI tests report
    needs: [setup, yontrack, ui-tests]
    if: ${{ !cancelled() && needs.setup.outputs.full_run == 'true' && needs.ui-tests.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Collect the JUnit reports
        id: collect
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: playwright-junit-*
          path: playwright-junit

      # Rebuild the layout the stamp's glob expects: reports/<variant>/junit/*.xml
      #
      # The artefacts are named `<variant>-<shard>`, and the shard is dropped here so the reports
      # land under the variant they belong to rather than inventing a `main-1` variant. The
      # shards of `main` do not collide: the Gradle build names their reports report-1.xml,
      # report-2.xml and so on.
      - name: Lay the reports out
        id: layout
        if: ${{ !cancelled() && steps.collect.outcome != '' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          for dir in playwright-junit/playwright-junit-*; do
            [ -d "$dir" ] || continue
            leg="${dir##*playwright-junit-}"
            variant="${leg%-*}"
            mkdir -p "ontrack-web-tests/reports/$variant/junit"
            cp "$dir"/*.xml "ontrack-web-tests/reports/$variant/junit/" || true
          done
          find ontrack-web-tests/reports -name '*.xml' -print

      - name: Link to the Yontrack build
        if: ${{ !cancelled() }}
        uses: nemerosa/ontrack-github-actions-cli-library/ontrack-cli-workflow-build@v1.0.3
        with:
          project: ${{ needs.yontrack.outputs.project }}
          yontrack-url: ${{ vars.YONTRACK_URL }}
          yontrack-token: ${{ secrets.YONTRACK_TOKEN }}
          version: ${{ env.YONTRACK_CLI_VERSION }}

      # If the reports never made it here the stamp still has to say so, rather than the job
      # dying quietly and leaving PLAYWRIGHT absent from the build.
      - name: Validate PLAYWRIGHT
        if: ${{ !cancelled() && steps.layout.outcome != '' }}
        env:
          LAYOUT_OUTCOME: ${{ steps.layout.outcome }}
          UI_TESTS_RESULT: ${{ needs.ui-tests.result }}
        run: |
          # The slowest of the legs, written by each one into its artefact. Left empty
          # when no artefact arrived at all — a made-up duration is worse than none, so the flag
          # is then omitted and the rest of the run info still goes out.
          run_time="$(cat playwright-junit/playwright-junit-*/run-time.txt 2>/dev/null \
            | sort -n | tail -n 1 || true)"
          run_time_flag=""
          if [ -n "$run_time" ]; then
            run_time_flag="--run-time $run_time"
          fi
          # A variant that fails or times out uploads nothing, and a partial set of artefacts is
          # indistinguishable from a complete one: the reports that *did* arrive are all green,
          # so validating them alone stamped PLAYWRIGHT passed while a whole variant had died.
          # The matrix result decides, not what turned up.
          if [ "$LAYOUT_OUTCOME" != "success" ] || [ "$UI_TESTS_RESULT" != "success" ]; then
            # shellcheck disable=SC2086  # deliberate: see YONTRACK_RUN_INFO
            yontrack validate --validation PLAYWRIGHT --status FAILED \
              $run_time_flag $YONTRACK_RUN_INFO
          else
            # shellcheck disable=SC2086  # deliberate: see YONTRACK_RUN_INFO
            yontrack validate --validation PLAYWRIGHT \
              junit --pattern "ontrack-web-tests/reports/*/junit/*.xml" --fail-when-no-results \
              $run_time_flag $YONTRACK_RUN_INFO
          fi

  # ---------------------------------------------------------------------------------------------
  # Test coverage: the reports and the six sets of figures (#1821).
  #
  # Where the rest of `initiative: coverage` becomes visible. The five test jobs above collect
  # JaCoCo execution data — the Gradle test JVMs directly (#1818), the backend *container* of the
  # acceptance stacks over TCP (#1819) — and Jest writes its own summary (#1820). This job turns
  # all of it into one HTML report per backend test type, one merged report whose *Sessions* page
  # is the class-level origin view, and the figures #1822 records as COVERAGE.* stamps.
  #
  # `!cancelled()` rather than a success check on the test jobs: a red suite still produces
  # coverage, and that figure is worth having. `build` is the exception — it is what produces the
  # class files every report is measured against.
  #
  # A *skipped* suite is different from a failed one: SKIP_KDSL_ACCEPTANCE or SKIP_NEXT_UI_TESTS
  # means a whole type was never meant to run, and there is no honest merged figure to compute, so
  # the job does not run at all rather than reporting a drop that is really an absence.
  #
  # The logic lives in scripts/coverage-report.sh and scripts/coverage-metrics.sh, not here. #1823
  # gives a contributor the same reports and the same figures from Gradle, and one definition that
  # both paths call is the only way CI and a local run cannot disagree about what "72.4" means.
  # ---------------------------------------------------------------------------------------------

  coverage:
    name: Coverage report
    needs: [setup, yontrack, build, build-ui, integration, kdsl, ui-tests]
    if: >-
      ${{ !cancelled()
        && needs.setup.outputs.coverage == 'true'
        && needs.yontrack.result != 'failure'
        && needs.build.result == 'success'
        && needs.integration.result != 'skipped'
        && needs.kdsl.result != 'skipped'
        && needs.ui-tests.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # `complete` says whether every leg reported and `metrics` is the JSON document whose contract
    # is in coverage-metrics.sh. This job records them itself, as the six COVERAGE.* stamps
    # (#1822); they stay as outputs because they are the only machine-readable summary of the run
    # and cost nothing.
    outputs:
      complete: ${{ steps.check.outcome }}
      metrics: ${{ steps.metrics.outputs.metrics }}
    steps:
      # The run time reported for this job's validations is measured from here. A `run:` step is
      # the earliest point a workflow can observe: the runner's own "Set up job" precedes every
      # step and is not visible to any of them.
      - name: Record the job start
        id: job_start
        run: echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7

      # jacococli is a plain JVM tool; nothing here runs Gradle.
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: "25"

      # Before the reports, not after: a report step that fails must still be able to send its
      # six FAILED stamps. The build this job runs for is always registered — `coverage` is only
      # ever true on a run where `full_run` is true too, so the `yontrack` job has run.
      - name: Link to the Yontrack build
        id: link
        uses: nemerosa/ontrack-github-actions-cli-library/ontrack-cli-workflow-build@v1.0.3
        with:
          project: ${{ needs.yontrack.outputs.project }}
          yontrack-url: ${{ vars.YONTRACK_URL }}
          yontrack-token: ${{ secrets.YONTRACK_TOKEN }}
          version: ${{ env.YONTRACK_CLI_VERSION }}

      - name: Collect the coverage artefacts
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          path: coverage-artifacts

      - name: Lay the execution data out
        run: |
          set -euo pipefail
          mkdir -p coverage-artifacts
          ls coverage-artifacts
          scripts/coverage-report.sh collect coverage-artifacts coverage-exec

      # The loud half of the promise #1819 made when it let a failed dump warn instead of failing:
      # the missing file is the signal, and this is where it is read. A shard whose artefact never
      # arrived, or a leg whose dump produced nothing, leaves its session out and is named here.
      #
      # Asked per backend test type rather than all-or-nothing (#1822): each type's answer becomes
      # one stamp, either `ok` or a one-line reason that goes straight into a FAILED run's
      # description. `coverage-status.txt` is what the stamps step reads; a file that is not there
      # is not the same as one saying everything is fine, and that script treats it as such.
      #
      # `continue-on-error` so that the reports are still built and uploaded: they are useful even
      # when a leg is missing, and the incomplete legs have stamps of their own to go to.
      - name: Check that every leg reported
        id: check
        continue-on-error: true
        env:
          COVERAGE_INTEGRATION_SHARDS: ${{ env.INTEGRATION_SHARDS }}
          COVERAGE_KDSL_SHARDS: ${{ env.KDSL_SHARDS }}
          COVERAGE_UI_MAIN_SHARDS: ${{ env.UI_MAIN_SHARDS }}
        run: |
          set -uo pipefail
          # What the execution data itself says, for the record. Informational: the status below is
          # what decides, and it reads the files rather than jacococli's output format.
          scripts/coverage-report.sh execinfo coverage-exec || true

          scripts/coverage-report.sh status coverage-exec > coverage-status.txt
          status=$?
          cat coverage-status.txt
          exit $status

      # COVERAGE_TREE is the `coverage-classes` artefact of the `build` job: the exact production
      # classes that ran, and their sources. This runner's own checkout has the sources but never
      # the classes, and a report measured against classes compiled here would not be the ones the
      # container executed.
      - name: Build the reports
        id: report
        env:
          COVERAGE_TREE: coverage-artifacts/coverage-classes
        run: |
          set -euo pipefail
          scripts/coverage-report.sh report coverage-exec coverage-reports

          # The Jest report, passed through. It is the frontend half of the picture and there is
          # nothing to merge it with — COVERAGE.UI_UNIT comes from its own summary, not from JaCoCo.
          if [ -d coverage-artifacts/coverage-jest ]; then
            mkdir -p coverage-reports/jest
            cp -R coverage-artifacts/coverage-jest/. coverage-reports/jest/
          fi

      # Run whatever the completeness check said. The figures of a type whose legs all reported are
      # computed from that type's own report and are right regardless of what another type lost;
      # which of them may be *sent* is decided one step down, per stamp.
      #
      # `continue-on-error`: when no figure can be computed at all — a report missing, the Jest
      # summary gone — the six stamps still go out, as FAILED. A stamp that never arrives is a
      # hole in the history that nothing explains; a red one says what happened.
      - name: Compute the figures
        id: metrics
        continue-on-error: true
        env:
          COVERAGE_JEST_SUMMARY: coverage-artifacts/coverage-jest/coverage-summary.json
        run: |
          set -euo pipefail
          scripts/coverage-metrics.sh coverage-reports coverage-reports/coverage-metrics.json

      # 30 days: these are what a Yontrack validation run links to, and what anyone looking at a
      # figure goes to in order to understand it.
      - name: Upload the coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-reports
          path: coverage-reports/**
          if-no-files-found: warn
          retention-days: 30

      # After the upload, so that the artefact every stamp's description points at exists by the
      # time the stamp does.
      #
      # The six COVERAGE.* stamps (#1822). Recording only — declared with the `metrics` data type
      # in .yontrack/ci.yaml, in no promotion, no threshold — so a stamp is PASSED whenever its
      # figures exist and FAILED when its test type lost its execution data.
      #
      # Which figure may be sent for which stamp, given what a run lost, is the whole judgement of
      # that issue, so it lives in scripts/coverage-validate.sh where it is tested
      # (scripts/coverage-validate-test.sh) rather than in workflow YAML where it is not. Its
      # header states the rules; the short of it is that an incomplete type sends FAILED with the
      # missing sessions named, COVERAGE.TOTAL follows any incomplete type, and the types that did
      # report keep their `line` and `branch` but lose `unique_line`, which is measured against the
      # other types and inflates as soon as one of them is missing.
      #
      # #1821 failed the whole job on a gap, because there was then nowhere else to put the
      # signal. There is now: a FAILED stamp with its reason lands on the build, stays in the
      # history and charts, and gates nothing. Reddening `main` for a flaky UI leg that lost its
      # artefact would assert that the product is broken, which is a different and much louder
      # claim than the one being made. The run still says so — see the warning at the end.
      - name: Record the COVERAGE.* stamps
        if: ${{ !cancelled() && steps.link.outcome == 'success' }}
        env:
          STARTED: ${{ steps.job_start.outputs.started }}
          COVERAGE_REPORTS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          run_time_flag=""
          if [ -n "${STARTED:-}" ]; then
            run_time_flag="--run-time $(( $(date +%s) - STARTED ))"
          fi
          # shellcheck disable=SC2086  # deliberate: see YONTRACK_RUN_INFO
          scripts/coverage-validate.sh coverage-status.txt coverage-reports/coverage-metrics.json \
            -- $run_time_flag $YONTRACK_RUN_INFO

      - name: Summarise the reports
        if: always()
        env:
          CHECK: ${{ steps.check.outcome }}
        run: |
          {
            echo "### Coverage reports"
            echo
            echo "In the \`coverage-reports\` artefact of this run:"
            echo
            echo "| Path | What |"
            echo "|------|------|"
            echo "| \`merged/html/index.html\` | every backend test type merged; \`jacoco-sessions.html\` says which leg covered what |"
            echo "| \`unit/html/index.html\` | JVM unit tests |"
            echo "| \`integration/html/index.html\` | integration tests |"
            echo "| \`kdsl/html/index.html\` | KDSL acceptance tests, from inside the backend container |"
            echo "| \`ui/html/index.html\` | Playwright tests, from inside the backend container |"
            echo "| \`jest/index.html\` | frontend unit tests |"
            echo "| \`*/jacoco.xml\` | what the figures are computed from |"
            echo "| \`coverage-metrics.json\` | the six sets of figures |"
            if [ "$CHECK" != "success" ]; then
              echo
              echo "**Some legs reported no execution data.** Their \`COVERAGE.*\` stamps are FAILED"
              echo "on the Yontrack build and name what was missing; the types that did report keep"
              echo "their \`line\` and \`branch\` but no \`unique_line\`, and \`COVERAGE.TOTAL\` is FAILED."
              echo "See the *Check that every leg reported* step."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # An incomplete set is never a smaller number — that is what the FAILED stamps above are
      # for — but it must not be quiet either. An annotation, not a failure: the claim being made
      # is "a coverage leg lost its data", and failing the run would make it "the build is
      # broken". See the stamps step for the whole of that argument (#1822).
      - name: Warn on an incomplete set
        if: ${{ always() && steps.check.outcome == 'failure' }}
        run: |
          echo "::warning::Some test legs reported no coverage execution data. The affected COVERAGE.* stamps are FAILED on the Yontrack build and name what was missing; the others carry no unique_line."

  # ---------------------------------------------------------------------------------------------
  # Trivy scan of the two Docker images, reported as CHML counts (#1749).
  #
  # The run-tagged images `build` and `build-ui` push: the Jib backend image carries the jars and the UI image
  # Next's standalone node_modules, so this covers the runtime dependencies of both tiers. It is
  # where the dependency counts in Yontrack come from - Dependabot alerts are not reported.
  #
  # Every full run, on every branch, so that a feature branch bringing in a vulnerable dependency
  # shows it before it is merged. It needs only the two build jobs, so it runs alongside `integration`, `kdsl`
  # and `ui-tests` and adds no wall-clock time to the run.
  #
  # Findings never fail this job: they only drive the stamps, WARNING from the first HIGH and
  # FAILED from the first CRITICAL (.yontrack/ci.yaml). A scanner *error* does fail it, and still
  # records a FAILED stamp so the build does not simply lack one.
  #
  # The scan and the counting live in .github/actions/security-image-scan and
  # scripts/security-image-scan.sh, shared with the nightly rescan (#1751). Accepted risks go in
  # .trivyignore.yaml, each with a statement and an expiry.
  # ---------------------------------------------------------------------------------------------

  security-images:
    name: Security scan of the images
    needs: [setup, yontrack, build, build-ui]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.build-ui.result == 'success' && needs.setup.outputs.full_run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # A job-level block replaces the workflow's, so everything this job needs is restated.
    # `security-events: write` is for the SARIF upload; `packages: read` is for pulling the images.
    permissions:
      contents: read
      packages: read
      security-events: write
    steps:
      # The run time reported for this job's validations is measured from here. A `run:` step is
      # the earliest point a workflow can observe: the runner's own "Set up job" precedes every
      # step and is not visible to any of them.
      - name: Record the job start
        id: job_start
        run: echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"

      # Pinned by commit SHA, like every action this job uses - see the composite action's header.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Trivy pulls the images straight from the registry with the Docker credentials, rather than
      # through the daemon: no `docker pull` of a backend image it only needs to read.
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Before the scans, so that a scan that errors can still report its FAILED stamp.
      - name: Link to the Yontrack build
        uses: nemerosa/ontrack-github-actions-cli-library/ontrack-cli-workflow-build@v1.0.3
        with:
          project: ${{ needs.yontrack.outputs.project }}
          yontrack-url: ${{ vars.YONTRACK_URL }}
          yontrack-token: ${{ secrets.YONTRACK_TOKEN }}
          version: ${{ env.YONTRACK_CLI_VERSION }}

      - name: Scan the backend image
        id: backend
        uses: ./.github/actions/security-image-scan
        with:
          image: ${{ env.GHCR_ONTRACK }}:${{ env.RUN_TAG }}
          category: trivy-image-backend

      # !cancelled(), not the implicit success(): an error on the backend image must not leave the
      # UI image unscanned.
      - name: Scan the UI image
        id: ui
        if: ${{ !cancelled() }}
        uses: ./.github/actions/security-image-scan
        with:
          image: ${{ env.GHCR_ONTRACK_UI }}:${{ env.RUN_TAG }}
          category: trivy-image-ui

      # `outcome` is empty only when the step was skipped. Anything but success means the scan
      # itself went wrong, and the counts are then absent rather than zero - a scan that did not
      # happen must never read as a clean image.
      - name: Validate SECURITY.IMAGE.BACKEND
        if: ${{ !cancelled() && steps.backend.outcome != '' }}
        env:
          OUTCOME: ${{ steps.backend.outcome }}
          CRITICAL: ${{ steps.backend.outputs.critical }}
          HIGH: ${{ steps.backend.outputs.high }}
          MEDIUM: ${{ steps.backend.outputs.medium }}
          LOW: ${{ steps.backend.outputs.low }}
          STARTED: ${{ steps.job_start.outputs.started }}
        run: |
          run_time_flag=""
          if [ -n "${STARTED:-}" ]; then
            run_time_flag="--run-time $(( $(date +%s) - STARTED ))"
          fi
          if [ "$OUTCOME" = "success" ]; then
            # shellcheck disable=SC2086  # deliberate: see YONTRACK_RUN_INFO
            yontrack validate --validation SECURITY.IMAGE.BACKEND \
              chml --critical "$CRITICAL" --high "$HIGH" --medium "$MEDIUM" --low "$LOW" \
              $run_time_flag $YONTRACK_RUN_INFO
          else
            # shellcheck disable=SC2086  # deliberate: see YONTRACK_RUN_INFO
            yontrack validate --validation SECURITY.IMAGE.BACKEND --status FAILED \
              $run_time_flag $YONTRACK_RUN_INFO
          fi

      - name: Validate SECURITY.IMAGE.UI
        if: ${{ !cancelled() && steps.ui.outcome != '' }}
        env:
          OUTCOME: ${{ steps.ui.outcome }}
          CRITICAL: ${{ steps.ui.outputs.critical }}
          HIGH: ${{ steps.ui.outputs.high }}
          MEDIUM: ${{ steps.ui.outputs.medium }}
          LOW: ${{ steps.ui.outputs.low }}
          STARTED: ${{ steps.job_start.outputs.started }}
        run: |
          run_time_flag=""
          if [ -n "${STARTED:-}" ]; then
            run_time_flag="--run-time $(( $(date +%s) - STARTED ))"
          fi
          if [ "$OUTCOME" = "success" ]; then
            # shellcheck disable=SC2086  # deliberate: see YONTRACK_RUN_INFO
            yontrack validate --validation SECURITY.IMAGE.UI \
              chml --critical "$CRITICAL" --high "$HIGH" --medium "$MEDIUM" --low "$LOW" \
              $run_time_flag $YONTRACK_RUN_INFO
          else
            # shellcheck disable=SC2086  # deliberate: see YONTRACK_RUN_INFO
            yontrack validate --validation SECURITY.IMAGE.UI --status FAILED \
              $run_time_flag $YONTRACK_RUN_INFO
          fi

      # The findings mirror (#1869). self.dev runs 5.x and takes CHML only, so on `v6` - and only
      # there - the Trivy reports themselves also go to v6.dev, which runs 6.0 with the licence for
      # the native formats. Never fails the job: self.dev is the instance of record, and every
      # failure of the mirror is a warning. See scripts/security-findings-mirror.sh.
      - name: Is the findings mirror on?
        id: mirror
        if: ${{ !cancelled() }}
        run: scripts/security-findings-mirror.sh enabled "$GITHUB_REF_NAME"

      - name: Mirror the image findings onto v6.dev
        if: ${{ !cancelled() && steps.mirror.outputs.enabled == 'true' }}
        continue-on-error: true
        env:
          V6_URL: ${{ vars.V6_URL || 'https://v6.dev.yontrack.com' }}
          V6_TOKEN: ${{ secrets.V6_TOKEN }}
          BACKEND_REPORT: ${{ steps.backend.outputs.report-dir }}/trivy.json
          UI_REPORT: ${{ steps.ui.outputs.report-dir }}/trivy.json
          BACKEND_OUTCOME: ${{ steps.backend.outcome }}
          UI_OUTCOME: ${{ steps.ui.outcome }}
          STARTED: ${{ steps.job_start.outputs.started }}
        run: |
          run_time_flag=""
          if [ -n "${STARTED:-}" ]; then
            run_time_flag="--run-time $(( $(date +%s) - STARTED ))"
          fi
          scripts/security-findings-mirror.sh configure "$V6_URL" "$V6_TOKEN"
          # A scan that errored has no report worth mirroring - self.dev already has its FAILED.
          if [ "$BACKEND_OUTCOME" = "success" ]; then
            # shellcheck disable=SC2086  # deliberate: see YONTRACK_RUN_INFO
            scripts/security-findings-mirror.sh publish "$YONTRACK_BRANCH_NAME" "$YONTRACK_BUILD_NAME" \
              SECURITY.IMAGE.BACKEND trivy IMAGE "$BACKEND_REPORT" $run_time_flag $YONTRACK_RUN_INFO
          fi
          if [ "$UI_OUTCOME" = "success" ]; then
            # shellcheck disable=SC2086  # deliberate: see YONTRACK_RUN_INFO
            scripts/security-findings-mirror.sh publish "$YONTRACK_BRANCH_NAME" "$YONTRACK_BUILD_NAME" \
              SECURITY.IMAGE.UI trivy IMAGE "$UI_REPORT" $run_time_flag $YONTRACK_RUN_INFO
          fi

      # Keeps the switch back to self.dev from being forgotten at the 6.0 cutover (#1875): on
      # `main` and `release/*`, a 6.x build warns while self.dev still runs 5.x, and fails once it
      # runs 6.x. After the validations, so that the stamps are recorded either way.
      - name: Check the security findings are not left behind
        if: ${{ !cancelled() }}
        run: scripts/security-findings-mirror.sh guard "$GITHUB_REF_NAME" VERSION

      - name: Summarise the counts
        if: ${{ !cancelled() }}
        env:
          BACKEND: ${{ steps.backend.outputs.critical }}/${{ steps.backend.outputs.high }}/${{ steps.backend.outputs.medium }}/${{ steps.backend.outputs.low }}
          UI: ${{ steps.ui.outputs.critical }}/${{ steps.ui.outputs.high }}/${{ steps.ui.outputs.medium }}/${{ steps.ui.outputs.low }}
        run: |
          {
            echo "### Fixable vulnerabilities in the images (critical/high/medium/low)"
            echo
            echo "| Image | Counts |"
            echo "|-------|--------|"
            echo "| backend | \`$BACKEND\` |"
            echo "| UI | \`$UI\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------------------------
  # Documentation.
  #
  # The Jenkins Documentation stage never built the site: buildDocs is wired into `build`, so it
  # relied on `./gradlew build` having produced ontrack-docs/site/. On a separate runner this job
  # builds it itself — including the ontrack-docs integration tests, which are what write
  # docs/content/generated/ (gitignored, and referenced from ~11 places in the mkdocs nav).
  #
  # It runs on *every* full run, not only at release time (#1668). Nothing may be rebuilt at
  # release time, so the site is built once while the build is being made and carried forward as
  # a GitHub Actions artefact; `release.yml` (#1672) downloads that artefact and pushes it to S3
  # under the final version. The 90-day retention is therefore a real release deadline — a build
  # left at GOLD-pending longer than that loses its docs, which `release.yml` reports explicitly
  # rather than papering over with a rebuild. See doc/dev-guide/docs-artifact.md.
  #
  # One stamp: `DOCS`, meaning the site built and was archived. Reported on every full run, and
  # gates BRONZE (#1669). `DOCUMENTATION` — the S3 publication — used to be reported here too and
  # now lives in `release.yml`, which is the only thing that publishes anything (#1673). It keeps
  # that name there: it carries the validation history of every past release, and renaming it
  # would orphan all of it.
  #
  # `needs` is [setup, yontrack] and nothing more. The job runs its own
  # `:ontrack-docs:integrationTest :ontrack-docs:buildDocs` from scratch and consumes no output of
  # `build`, `integration`, `kdsl` or `ui-tests`, so waiting on them only delayed it. Being
  # genuinely parallel is what makes gating BRONZE on `DOCS` nearly free in wall-clock.
  # ---------------------------------------------------------------------------------------------

  docs:
    name: Documentation
    needs: [setup, yontrack]
    if: >-
      ${{ !cancelled()
        && needs.setup.result == 'success'
        && needs.yontrack.result != 'failure'
        && needs.setup.outputs.full_run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # The run time reported for this job's validations is measured from here. A `run:` step is
      # the earliest point a workflow can observe: the runner's own "Set up job" precedes every
      # step and is not visible to any of them. Everything after this — checkout, toolchain setup,
      # cache restore — is part of what the job costs and is counted.
      - name: Record the job start
        id: job_start
        run: echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The nemerosa/ontrack-build image carried a global git identity, and the tests rely on
      # it: GitRepo.commit() runs `git commit` in a freshly `git init`ed repo, which fails
      # outright on a runner with no user.name/user.email. init.defaultBranch matches what the
      # image set, so the branch names the tests assert on stay the same.
      - name: Configure git
        run: |
          git config --global user.email "yontrack@nemerosa.net"
          git config --global user.name "Yontrack"
          git config --global init.defaultBranch main

      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ needs.setup.outputs.gradle_cache_read_only }}

      # python3 and venv are already on ubuntu-latest, which createVenv/installDeps need.
      - name: Install graphviz
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y graphviz

      # Before the build, not after: a docs build that fails must still be able to report a
      # FAILED `DOCS` stamp, and `yontrack validate` needs the build to have been resolved.
      - name: Link to the Yontrack build
        uses: nemerosa/ontrack-github-actions-cli-library/ontrack-cli-workflow-build@v1.0.3
        with:
          project: ${{ needs.yontrack.outputs.project }}
          yontrack-url: ${{ vars.YONTRACK_URL }}
          yontrack-token: ${{ secrets.YONTRACK_TOKEN }}
          version: ${{ env.YONTRACK_CLI_VERSION }}

      - name: Build the documentation
        id: build_docs
        run: |
          ./gradlew :ontrack-docs:integrationTest :ontrack-docs:buildDocs \
            --stacktrace \
            --console plain

      # The rendered site, carried forward to the release. `if-no-files-found: error` is the
      # point of the step: an empty artefact would only be discovered months later, by
      # `release.yml`, on the one day it cannot be fixed by rebuilding.
      #
      # The path is the directory, so the site's own files sit at the root of the artefact —
      # `index.html` at the top, not `site/index.html`. The name is fixed rather than versioned:
      # `release.yml` reaches the artefact through the CI run recorded on the build (#1671) and
      # resolves the *base* version, which is not the version this run was named for.
      #
      # `overwrite` because the name is fixed and v4 rejects a duplicate with a 409: without it,
      # re-running just this job after a transient failure would die here and DOCS could never go
      # green for that run.
      #
      # 90 days is a request, not a guarantee - GitHub clamps it to the repository's own artefact
      # retention setting, so the effective release deadline is whichever is shorter.
      - name: Archive the documentation
        id: artifact
        uses: actions/upload-artifact@v7
        with:
          name: docs-site
          path: ontrack-docs/site
          if-no-files-found: error
          overwrite: true
          retention-days: 90

      - name: Validate DOCS
        if: ${{ !cancelled() && steps.build_docs.outcome != '' }}
        env:
          BUILD_OUTCOME: ${{ steps.build_docs.outcome }}
          ARTIFACT_OUTCOME: ${{ steps.artifact.outcome }}
          STARTED: ${{ steps.job_start.outputs.started }}
        run: |
          run_time_flag=""
          if [ -n "${STARTED:-}" ]; then
            run_time_flag="--run-time $(( $(date +%s) - STARTED ))"
          fi
          if [ "$BUILD_OUTCOME" = "success" ] && [ "$ARTIFACT_OUTCOME" = "success" ]; then
            status=PASSED
          else
            status=FAILED
          fi
          # shellcheck disable=SC2086  # deliberate: see YONTRACK_RUN_INFO
          yontrack validate --validation DOCS --status "$status" \
            $run_time_flag $YONTRACK_RUN_INFO
