# Passive DAST scan of the demo instance, reporting SECURITY.DAST (#1765).
#
# Part of `initiative: security-scans`, DAST track. The design is docs/grilling/2026-09-dast.md;
# what the scanners read is security/dast/, and what every later DAST issue builds on is the
# split described there: the scanner reports everything, and scripts/security-dast.sh decides what
# it counts for. Three scanners run, one after the other, and each has its `normalize-*` converter
# feeding the same `report` step and the same SECURITY.DAST validation run:
#
#   * OWASP ZAP (#1765) - passive rules over a crawl of the UI and every root query of the API;
#   * graphql-cop (#1766) - GraphQL-specific weaknesses: introspection, alias, batch and depth abuse,
#     GET-based queries, field suggestions;
#   * Nuclei (#1766) - deployment-shaped problems: exposed actuators and files, default credentials,
#     known Spring / Keycloak / Next.js CVEs, and so the yontrack-chart defaults the demo runs on.
#
# The API - ZAP's API pass and graphql-cop - is scanned once as each of the three scanner roles of
# security/dast/casc.yaml (#1769): scan-admin, scan-readonly and scan-project. The UI and Nuclei are
# scanned unauthenticated, once. Findings are de-duplicated by rule and URL across the passes before
# they are counted, and the private report says which role saw each one.
#
# #1767 runs the same script with DAST_KIND=active.
#
# Passive means no request that changes state ever leaves a scanner. There is no active scan, no
# fuzzing, no attack payload and - the one that matters on a shared instance - no GraphQL mutation.
# ZAP is fed a schema with no mutation root, so a mutation is not filtered out, it is not
# expressible; graphql-cop's one test that sends a mutation is excluded, and the exclusion is
# checked against its source before it runs; Nuclei runs no template tagged intrusive, dos, fuzz or
# bruteforce, and that is checked against the templates it selected. Both GraphQL scanners are
# proved afterwards, from their own record of what they sent, to have sent no mutation.
# security/dast/graphql/README.md explains it.
#
# ---------------------------------------------------------------------------------------------
# DISCLOSURE. This repository is public: its workflow logs are readable by any signed-in GitHub
# user. A DAST report is a working checklist against every deployment that has not upgraded yet,
# so:
#
#   * this workflow prints COUNTS ONLY - never a URL, a parameter or a piece of evidence;
#   * it uploads NO ARTIFACT, deliberately. Do not add one;
#   * the full detail goes to the private yontrack/security-reports, one file per run;
#   * the validation run points at this workflow run, never at the report;
#   * nothing goes to code scanning - see "No SARIF" below.
#
# Anything a scanner writes to its own stdout goes through `scripts/security-dast.sh scrub`
# before it can reach the log. If you add a step here, it prints a number or it prints nothing.
# ---------------------------------------------------------------------------------------------
#
# Nothing in ci.yml or in any promotion depends on this workflow: SECURITY.DAST is reporting only.
# A scanner error fails the run and reports no stamp - a scan that did not happen must never read
# as a clean instance.
#
# No SARIF. The first real run (35087242240) uploaded one under the `dast-zap` category and
# GitHub accepted it without a warning - then rendered **zero alerts** out of 40 results. A DAST
# finding is located by a URL, and code scanning maps a result to a line of a file in the
# repository; there is nothing for it to point at. Inventing a plausible file per rule would be
# worse than no alert at all, so the upload is dropped and the private report is the source of
# truth, which is what docs/grilling/2026-09-dast.md provided for. Do not re-add it without
# re-measuring: this is a statement about what GitHub did, not about what it might do.
#
# `dast-graphql` and `dast-nuclei` were not tried, and that is a decision rather than an omission
# (#1766). Their findings are located the same way - graphql-cop's by the endpoint, Nuclei's by the
# matched URL - so GitHub has the same nothing to place them on; and the request detail that would
# make either useful carries the token (graphql-cop's `curl_verify`) or the exact path of an exposure
# (Nuclei's `matched-at`) into a repository whose Security tab is not where those belong.
#
# Every action is pinned by commit SHA and the ZAP image by digest, like the other security
# workflows; .github/dependabot.yml keeps the action pins up to date. graphql-cop and Nuclei are not
# images: each is downloaded at a fixed version and refused unless it matches the SHA-256 below,
# and graphql-cop's Python dependencies are installed with --require-hashes. Dependabot does not see
# those pins - moving one is a reviewed change to this file.
name: DAST passive

on:
  # The moment a new BRONZE build is live and freshly seeded. demo-smoke.yml is what deploys the
  # demo's dataset and re-applies its CasC, so this is also the only moment the instance is in a
  # known state.
  workflow_run:
    workflows: ["Demo smoke"]
    types:
      - completed

  # New ZAP rules appear even in weeks when Yontrack does not change, and a demo that has not been
  # redeployed still deserves a current verdict. Monday morning, off the hour.
  schedule:
    - cron: "17 3 * * 1"

  workflow_dispatch:

# Shared with demo-smoke.yml, and that is the whole point: the seed wipes and rebuilds the demo,
# so a reset running under a scan would have the scanner crawling an instance that is being
# deleted around it. Queue rather than cancel - a cancelled scan reports no stamp at all.
concurrency:
  group: demo-instance
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Pinned: an unpinned CLI lets a Yontrack release turn a green pipeline red in a repository
  # nobody touched. 5.2.0 and not the 5.1.1 the other security workflows pin, because the build
  # lookup this shares with demo-smoke.yml needs `build search --with-display-name`, which 5.1.1
  # does not have - see scripts/yontrack-build.sh.
  #
  # `validate` is always called with --project/--branch/--build spelled out: the typed subcommands
  # read the build from their flag only and ignore YONTRACK_BUILD_NAME (yontrack/yontrack-cli#73).
  YONTRACK_CLI_VERSION: "5.2.0"
  # Pinned by digest, not by the `stable` tag. A scanner whose version moves under you turns
  # "three new findings" into "or maybe three new rules", which is the one question a report must
  # never leave open.
  # DAST_SCANNERS below records the ZAP version this digest carries in every report: 2.17.0, as ZAP
  # itself reports it in its JSON report (run 35102207018). The 2.16.1 first written here did not
  # match the image. Move the two together.
  ZAP_IMAGE: ghcr.io/zaproxy/zaproxy@sha256:781a2bdaea47324e7bab583e2263f21d257b0aee61ed51521a5be45f5f5081ef
  # graphql-cop 1.16, as the commit its tag points at and the SHA-256 of GitHub's archive of it.
  # It publishes no image of this release (the Docker Hub `latest` is older), so it runs from source
  # in a digest-pinned Python, with the dependencies of security/dast/graphql-cop/requirements.txt.
  # 3.10 because graphql-cop pins simplejson 3.17.6, which has wheels up to 3.10 and would otherwise
  # be compiled on the runner. Move the four together.
  GRAPHQL_COP_VERSION: "1.16"
  GRAPHQL_COP_REF: 2b7e086efae672f28b419c7fcdfe6b48d846c9dc
  GRAPHQL_COP_SHA256: 4168ee12735fcc8a40bf7184b73a4c25277434c68431bfbc3231a425d0c66aed
  GRAPHQL_COP_PYTHON_IMAGE: python:3.10-slim@sha256:fd76ade0c607f27677bc04be3c60749f400eedc941d9e72967e19a4cedff80c2
  # The graphql-cop tests that never run against the demo, comma-separated, by the names graphql-cop
  # registers them under. `get_based_mutation` sends `mutation cop {__typename}` over GET: it writes
  # nothing, but it is a mutation on a shared instance with an admin token, which this scan does not
  # send. `graphql-cop-preflight` fails the run if any other registered test mentions a mutation.
  GRAPHQL_COP_EXCLUDED: get_based_mutation
  # Nuclei 3.11.1, with the SHA-256 its release publishes in nuclei_3.11.1_checksums.txt, and the
  # nuclei-templates release v10.4.8 as the commit its tag points at and the SHA-256 of GitHub's
  # archive of it. The templates are pinned separately because the engine's default is to download
  # the newest ones when it starts - which would turn "a new finding" into "or maybe a new template".
  NUCLEI_VERSION: "3.11.1"
  NUCLEI_SHA256: ea63d4ae232808cd7c6bc00d0142428e231fab59dae01042246097d195835ab6
  NUCLEI_TEMPLATES_VERSION: "v10.4.8"
  NUCLEI_TEMPLATES_REF: e5f19e6144135e107962bb943231413796fd7fe7
  NUCLEI_TEMPLATES_SHA256: 0dc334333848bd189a589247d6f4eed0d0f9cb9956c00cc45c569630817aaf43
  # The demo, not the Yontrack instance the validation is reported to.
  DEMO_URL: ${{ vars.DEMO_URL || 'https://demo.dev.yontrack.com' }}
  # Where the reports go. Private, and the only place any detail is allowed to exist.
  REPORTS_REPOSITORY: yontrack/security-reports

jobs:
  passive:
    name: Passive scan of the demo
    # A fork that enabled Actions would otherwise scan this organisation's demo with credentials
    # it does not have, and file reports it cannot write.
    if: >-
      github.repository == 'yontrack/yontrack'
      && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    # ZAP takes about fifteen minutes, Nuclei about ten at its rate limit, graphql-cop seconds.
    timeout-minutes: 90
    permissions:
      # Read only. No `security-events: write` - nothing is uploaded to code scanning, see the
      # "No SARIF" note in the header.
      contents: read
    env:
      DAST_KIND: passive
      DAST_TARGET: ${{ vars.DEMO_URL || 'https://demo.dev.yontrack.com' }}
      DAST_RUN_ID: ${{ github.run_id }}
      DAST_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      DAST_SCANNERS: >-
        OWASP ZAP 2.17.0 (passive rules, GraphQL add-on, query-only schema; UI unauthenticated,
        API once per scanner role);
        graphql-cop 1.16 (every test but get_based_mutation, once per scanner role);
        Nuclei 3.11.1 with nuclei-templates v10.4.8 (HTTP templates, no intrusive, dos, fuzz or
        bruteforce tag, 10 requests per second)
      YONTRACK_PROJECT: yontrack
      YONTRACK_BRANCH: main
      # The scanner accounts of security/dast/casc.yaml (#1769), in the order their passes run.
      # Each logs in with the Actions secret named after it - DAST_SCAN_ADMIN_PASSWORD for
      # scan-admin - through the demo realm's client. `scripts/security-dast.sh login` accepts
      # these three and no other. The realm is DAST_TARGET/keycloak/realms/ontrack, derived by the
      # script: as a variable here, its URL would be printed in every step's environment.
      DAST_ROLES: scan-admin scan-readonly scan-project
      DAST_KEYCLOAK_CLIENT_ID: yontrack-client
      # The longest a pass may take, in seconds: a token valid for less is refused before the pass
      # rather than expiring during it. ZAP's API pass waits up to ten minutes for the passive rules
      # and took about a minute on the demo; graphql-cop takes seconds.
      DAST_ZAP_PASS_BUDGET: "1800"
      DAST_GRAPHQL_COP_PASS_BUDGET: "600"
    steps:
      # The run time reported for the validation is measured from here, and so is the duration in
      # the report. A `run:` step is the earliest point a workflow can observe.
      - name: Record the job start
        id: job_start
        run: |
          set -euo pipefail
          {
            echo "started=$(date +%s)"
            echo "date=$(date -u +%Y-%m-%d)"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      # Installed directly rather than through ontrack-github-actions-cli-config, which registers
      # a build as a side effect. This workflow reports on a build that already exists - the one
      # running on the demo - and must not create one.
      - name: Install the Yontrack CLI
        env:
          YONTRACK_URL: ${{ vars.YONTRACK_URL }}
          YONTRACK_TOKEN: ${{ secrets.YONTRACK_TOKEN }}
        run: |
          set -euo pipefail
          curl -sSfL -o /usr/local/bin/yontrack \
            "https://github.com/nemerosa/ontrack-cli/releases/download/${YONTRACK_CLI_VERSION}/yontrack-linux-amd64"
          chmod +x /usr/local/bin/yontrack
          # --cli only: the bare `version` also asks the server, which is not configured yet.
          yontrack version --cli
          yontrack config create prod "$YONTRACK_URL" --token "$YONTRACK_TOKEN" --override

      # ------------------------------------------------------------------------------------
      # 1. Prepare, and log in as the three scanner roles.
      #
      # The scan runs as the accounts of security/dast/casc.yaml (#1769), not as the demo
      # admin: `scan-admin` (global ADMINISTRATOR), `scan-readonly` (global READ_ONLY) and
      # `scan-project` (PARTICIPANT on one seeded project), so that what a read-only or a
      # project-scoped user reaches is scanned too. DEMO_TOKEN is not used by this workflow.
      #
      # Each logs in by a Keycloak password grant on the demo realm. Its access token goes to a
      # file in $RUNNER_TEMP/dast/tokens, readable by the runner's user only, is registered as a
      # mask, and is redacted by `scrub` and `report` wherever it appears. An account that cannot
      # log in, or that the API does not map to its CasC group, stops the run: a scan that went
      # on unauthenticated would report a cleaner API than there is.
      # ------------------------------------------------------------------------------------

      # The query-only schema, and the reason a mutation cannot be generated. `query-schema` fails
      # the run if the derived schema still declares a mutation or subscription root.
      - name: Prepare the scan
        id: prepare
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/dast"
          mkdir -p "$work/out" "$work/graphql" "$work/zap"
          ( umask 077 && mkdir -p "$work/tokens" )
          scripts/security-dast.sh query-schema \
            ontrack-web-core/ontrack.graphql "$work/graphql/query-only.graphql"
          echo "work=$work" >> "$GITHUB_OUTPUT"
          # Where every later step's `scrub` and `report` find the tokens to redact.
          echo "DAST_TOKEN_DIR=$work/tokens" >> "$GITHUB_ENV"

      # Also asks the demo which version it is running: `whoami` is one authenticated query, and
      # the version rides along with it.
      - name: Log in as the scanner roles
        id: login
        env:
          DAST_SCAN_ADMIN_PASSWORD: ${{ secrets.DAST_SCAN_ADMIN_PASSWORD }}
          DAST_SCAN_READONLY_PASSWORD: ${{ secrets.DAST_SCAN_READONLY_PASSWORD }}
          DAST_SCAN_PROJECT_PASSWORD: ${{ secrets.DAST_SCAN_PROJECT_PASSWORD }}
          DEMO_KEYCLOAK_CLIENT_SECRET: ${{ secrets.DEMO_KEYCLOAK_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          for role in $DAST_ROLES; do
            scripts/security-dast.sh login "$role" "$DAST_TOKEN_DIR"
            scripts/security-dast.sh whoami "$role" "$DAST_TOKEN_DIR"
          done

      # ------------------------------------------------------------------------------------
      # 2. Which build that is.
      #
      # Nothing tells this workflow which version to scan - a schedule and a workflow_run carry
      # no inputs - so it asked the demo, and now resolves that version back to a build exactly
      # as demo-smoke.yml does, through the same function. The stamp therefore lands on the same
      # build DEMO.SMOKE landed on, by construction rather than by coincidence.
      # ------------------------------------------------------------------------------------

      - name: Resolve the build
        id: resolve
        env:
          DEMO_VERSION: ${{ steps.login.outputs.version }}
          DEMO_PROJECT: ${{ env.YONTRACK_PROJECT }}
          DEMO_BRANCH: ${{ env.YONTRACK_BRANCH }}
        run: scripts/demo-smoke.sh resolve

      # ------------------------------------------------------------------------------------
      # 3. The one thing that stops the run rather than counting.
      #
      # The Spring Boot management port is unauthenticated by design and must never be routed
      # from outside the cluster. If it answers, that is an incident - not a MEDIUM to add to a
      # tally - and the scan does not proceed to dress it up as one.
      # ------------------------------------------------------------------------------------

      - name: Check that the management port is not exposed
        run: scripts/security-dast.sh actuator "$DAST_TARGET"

      # ------------------------------------------------------------------------------------
      # 4. ZAP.
      #
      # Two plans. security/dast/zap/passive.yaml crawls the UI once, unauthenticated;
      # security/dast/zap/passive-api.yaml scans /graphql once per scanner role.
      #
      # ZAP's stdout goes to a file and is never printed raw. Two reasons, both verified against
      # the pinned image rather than assumed: its progress lines carry every URL it crawls, and
      # when it loads the plan it echoes each job's parameters back - including the replacer's
      # replacement string, which is the bearer token. On a failure the tail of it is printed
      # through `scripts/security-dast.sh scrub`, which redacts both and leaves enough to tell a
      # crashed container from a refused connection.
      #
      # The ZAP image runs as its own uid, so everything it reads has to be readable by another
      # user and the directories traversable - `a+rX` - and out/, which it writes its reports
      # into, writable by it.
      # ------------------------------------------------------------------------------------

      - name: Run the ZAP passive scan of the UI, unauthenticated
        env:
          WORK: ${{ steps.prepare.outputs.work }}
        run: |
          set -uo pipefail
          pass="$WORK/zap/ui"
          mkdir -p "$pass/out"
          cp security/dast/zap/passive.yaml "$pass/passive.yaml"
          chmod -R a+rX "$pass"
          chmod 777 "$pass/out"
          # `|| rc=$?` rather than reading $? on the next line: GitHub runs a `run:` block under
          # `bash -e`, which `set -uo pipefail` does not undo, so a bare failing command would
          # abort the step before anything could be said about why.
          rc=0
          docker run --rm \
            -v "$pass:/zap/wrk:rw" \
            -e DAST_TARGET="$DAST_TARGET" \
            "$ZAP_IMAGE" \
            zap.sh -cmd -autorun /zap/wrk/passive.yaml > "$pass/zap.log" 2>&1 || rc=$?
          echo "ZAP (UI, unauthenticated) finished with exit code $rc."
          if [ "$rc" -ne 0 ]; then
            echo "--- last lines of the ZAP log, URLs and credentials removed ---"
            tail -n 100 "$pass/zap.log" | scripts/security-dast.sh scrub
            exit "$rc"
          fi
          # The plan sends nothing to /graphql but a GET with no query; held to it all the same.
          scripts/security-dast.sh assert-no-mutations "$pass/out/messages.har"

      # One pass per role, one after the other, each with a token obtained right before it: a
      # pass must not outlive its token. `login` refuses a token valid for less than the pass's
      # budget, and `assert-authenticated` then proves from the HAR that no request to /graphql
      # was answered 401 - so an expiry mid-pass fails the run instead of scanning the rest of the
      # API as nobody. The demo's realm issues tokens for an hour; a pass takes a couple of minutes.
      #
      # `render-plan` fills in the one value ZAP will not: the Automation Framework expands
      # `${...}` in job parameters but not inside a replacer rule, so a plan left as committed
      # would send the literal placeholder and scan the API unauthenticated. No token on the
      # `docker run` command line or in its environment, where /proc would show it.
      #
      # After each pass, the two checks that observe what went over the wire: no mutation, and
      # authenticated throughout. Counts only.
      - name: Run the ZAP passive scan of the API, once per scanner role
        env:
          DAST_SCAN_ADMIN_PASSWORD: ${{ secrets.DAST_SCAN_ADMIN_PASSWORD }}
          DAST_SCAN_READONLY_PASSWORD: ${{ secrets.DAST_SCAN_READONLY_PASSWORD }}
          DAST_SCAN_PROJECT_PASSWORD: ${{ secrets.DAST_SCAN_PROJECT_PASSWORD }}
          DEMO_KEYCLOAK_CLIENT_SECRET: ${{ secrets.DEMO_KEYCLOAK_CLIENT_SECRET }}
          WORK: ${{ steps.prepare.outputs.work }}
        run: |
          set -uo pipefail
          for role in $DAST_ROLES; do
            echo "--- ZAP, API, as $role ---"
            pass="$WORK/zap/api-$role"
            mkdir -p "$pass/out" "$pass/graphql"
            cp "$WORK/graphql/query-only.graphql" "$pass/graphql/query-only.graphql"
            scripts/security-dast.sh login "$role" "$DAST_TOKEN_DIR" "$DAST_ZAP_PASS_BUDGET" || exit 1
            scripts/security-dast.sh render-plan \
              security/dast/zap/passive-api.yaml "$pass/passive-api.yaml" "$role" || exit 1
            chmod -R a+rX "$pass"
            chmod 777 "$pass/out"
            rc=0
            docker run --rm \
              -v "$pass:/zap/wrk:rw" \
              -e DAST_TARGET="$DAST_TARGET" \
              "$ZAP_IMAGE" \
              zap.sh -cmd -autorun /zap/wrk/passive-api.yaml > "$pass/zap.log" 2>&1 || rc=$?
            # The rendered copy holds the token; the pass is over, and so is its need for it.
            rm -f "$pass/passive-api.yaml"
            echo "ZAP (API, $role) finished with exit code $rc."
            if [ "$rc" -ne 0 ]; then
              echo "--- last lines of the ZAP log, URLs and credentials removed ---"
              tail -n 100 "$pass/zap.log" | scripts/security-dast.sh scrub
              exit "$rc"
            fi
            scripts/security-dast.sh assert-no-mutations "$pass/out/messages.har" || exit 1
            scripts/security-dast.sh assert-authenticated "$pass/out/messages.har" || exit 1
          done

      # ------------------------------------------------------------------------------------
      # 5. graphql-cop.
      #
      # What a spider cannot see on /graphql: introspection, field suggestions, alias, batch and
      # directive overloading, queries recursing without a depth limit, queries accepted over GET
      # or as a form. About a dozen requests per role, each one query of `__typename` or of the
      # introspection types.
      # ------------------------------------------------------------------------------------

      # The pinned source, checked for a test that could send a mutation before a single request
      # goes out, with the run-time configuration that reads the token from a file. The source
      # is the same for every role, so it is checked once; what each role's pass sent is checked
      # after it.
      - name: Prepare graphql-cop
        env:
          WORK: ${{ steps.prepare.outputs.work }}
        run: |
          set -euo pipefail
          cop="$WORK/graphql-cop"
          scripts/security-dast.sh fetch \
            "https://github.com/dolevf/graphql-cop/archive/${GRAPHQL_COP_REF}.tar.gz" \
            "$GRAPHQL_COP_SHA256" "$cop/graphql-cop.tar.gz"
          mkdir -p "$cop/src"
          tar -xzf "$cop/graphql-cop.tar.gz" -C "$cop/src" --strip-components=1
          # The upstream config.py plus the token header, read from a headers file - see the file.
          cp security/dast/graphql-cop/config.py "$cop/src/config.py"
          cp security/dast/graphql-cop/requirements.txt "$cop/requirements.txt"
          scripts/security-dast.sh graphql-cop-preflight "$cop/src" "$GRAPHQL_COP_EXCLUDED"
          echo "graphql-cop $GRAPHQL_COP_VERSION (commit $GRAPHQL_COP_REF), in $GRAPHQL_COP_PYTHON_IMAGE."

      # Its stdout is the JSON result, and each entry of it carries the request the test sent,
      # token included - so it goes to a file and is never printed. stderr (pip, a traceback) is
      # printed only on a failure, and only scrubbed.
      #
      # Once per role, each right after a fresh login, like ZAP's API passes. The endpoint and the
      # exclusions are arguments of the container's `sh -c`, not interpolated into it. The token is
      # in neither: it is in the role's headers file, mounted read-only and removed after its pass.
      - name: Run graphql-cop, once per scanner role
        env:
          DAST_SCAN_ADMIN_PASSWORD: ${{ secrets.DAST_SCAN_ADMIN_PASSWORD }}
          DAST_SCAN_READONLY_PASSWORD: ${{ secrets.DAST_SCAN_READONLY_PASSWORD }}
          DAST_SCAN_PROJECT_PASSWORD: ${{ secrets.DAST_SCAN_PROJECT_PASSWORD }}
          DEMO_KEYCLOAK_CLIENT_SECRET: ${{ secrets.DEMO_KEYCLOAK_CLIENT_SECRET }}
          WORK: ${{ steps.prepare.outputs.work }}
        run: |
          set -uo pipefail
          cop="$WORK/graphql-cop"
          for role in $DAST_ROLES; do
            echo "--- graphql-cop, as $role ---"
            scripts/security-dast.sh login "$role" "$DAST_TOKEN_DIR" "$DAST_GRAPHQL_COP_PASS_BUDGET" || exit 1
            scripts/security-dast.sh render-graphql-cop-headers "$cop/headers-$role.json" "$role" || exit 1
            rc=0
            # shellcheck disable=SC2016  # deliberate: expanded by the container's shell, from its arguments
            docker run --rm \
              -v "$cop:/cop:ro" \
              -e GRAPHQL_COP_HEADERS="/cop/headers-$role.json" \
              -e PYTHONDONTWRITEBYTECODE=1 \
              "$GRAPHQL_COP_PYTHON_IMAGE" \
              sh -c 'pip install --quiet --no-cache-dir --disable-pip-version-check --root-user-action=ignore \
                       --require-hashes --only-binary :all: --target /tmp/deps -r /cop/requirements.txt 1>&2 \
                     && PYTHONPATH=/tmp/deps exec python /cop/src/graphql-cop.py -t "$0" -o json -e "$1"' \
              "$DAST_TARGET/graphql" "$GRAPHQL_COP_EXCLUDED" \
              > "$WORK/out/graphql-cop-$role.out" 2> "$WORK/graphql-cop-$role.log" || rc=$?
            rm -f "$cop/headers-$role.json"
            echo "graphql-cop ($role) finished with exit code $rc."
            if [ "$rc" -ne 0 ]; then
              echo "--- last lines of the graphql-cop log, URLs and credentials removed ---"
              tail -n 30 "$WORK/graphql-cop-$role.log" | scripts/security-dast.sh scrub
              exit "$rc"
            fi
            # The graphql-cop counterpart of the ZAP check: every test reports the request it sent,
            # and none of them may be a mutation or a subscription. Counts only.
            scripts/security-dast.sh assert-graphql-cop-no-mutations "$WORK/out/graphql-cop-$role.out" || exit 1
          done

      # ------------------------------------------------------------------------------------
      # 6. Nuclei.
      #
      # The template selection, the excluded tags and the rate limit are
      # security/dast/nuclei/passive.yaml. Unauthenticated, deliberately: what Nuclei looks for -
      # an exposed actuator, a served .git, a default password - is what an attacker without a
      # token reaches, and an admin token on a login template is not something to find out about.
      # ------------------------------------------------------------------------------------

      # The engine and the templates, each checked against its pin, then the selection checked
      # against the excluded tags before anything is sent.
      - name: Prepare Nuclei
        env:
          WORK: ${{ steps.prepare.outputs.work }}
        run: |
          set -euo pipefail
          nuclei="$WORK/nuclei"
          scripts/security-dast.sh fetch \
            "https://github.com/projectdiscovery/nuclei/releases/download/v${NUCLEI_VERSION}/nuclei_${NUCLEI_VERSION}_linux_amd64.zip" \
            "$NUCLEI_SHA256" "$nuclei/nuclei.zip"
          unzip -q -o "$nuclei/nuclei.zip" nuclei -d "$nuclei/bin"
          scripts/security-dast.sh fetch \
            "https://github.com/projectdiscovery/nuclei-templates/archive/${NUCLEI_TEMPLATES_REF}.tar.gz" \
            "$NUCLEI_TEMPLATES_SHA256" "$nuclei/templates.tar.gz"
          mkdir -p "$nuclei/templates"
          tar -xzf "$nuclei/templates.tar.gz" -C "$nuclei/templates" --strip-components=1
          echo "Nuclei $NUCLEI_VERSION with nuclei-templates $NUCLEI_TEMPLATES_VERSION (commit $NUCLEI_TEMPLATES_REF)."
          # -tl lists what this configuration selects, and sends nothing.
          "$nuclei/bin/nuclei" -config security/dast/nuclei/passive.yaml -t "$nuclei/templates" \
            -tl -duc -nc > "$nuclei/templates.list" 2>&1
          scripts/security-dast.sh nuclei-preflight "$nuclei/templates.list" security/dast/nuclei/passive.yaml

      # Nuclei prints every match to stdout as it finds it, URL and template included, so both of
      # its streams go to a file that is never printed. On a failure, only its fatal lines are, and
      # scrubbed. `nuclei-summary` then prints the final statistics - counts - and fails a run that
      # did not finish, gave up on the target, or lost matches, because Nuclei exits 0 on all three.
      - name: Run Nuclei
        env:
          WORK: ${{ steps.prepare.outputs.work }}
        run: |
          set -uo pipefail
          nuclei="$WORK/nuclei"
          # Nuclei writes no file when nothing matched, and no match is a result.
          : > "$WORK/out/nuclei.jsonl"
          rc=0
          "$nuclei/bin/nuclei" -config security/dast/nuclei/passive.yaml -t "$nuclei/templates" \
            -u "$DAST_TARGET" -duc -nc -omit-raw -jsonl -o "$WORK/out/nuclei.jsonl" \
            -stats -si 60 -sj > "$WORK/nuclei.log" 2>&1 || rc=$?
          echo "Nuclei finished with exit code $rc."
          if [ "$rc" -ne 0 ]; then
            echo "--- fatal lines of the Nuclei log, URLs removed ---"
            grep -E '^\[FTL\]' "$WORK/nuclei.log" | tail -n 20 | scripts/security-dast.sh scrub
            exit "$rc"
          fi
          scripts/security-dast.sh nuclei-summary "$WORK/nuclei.log" "$WORK/out/nuclei.jsonl" "$DAST_TARGET"

      # ------------------------------------------------------------------------------------
      # 7. Count, report, publish.
      # ------------------------------------------------------------------------------------

      - name: Count the findings and write the report
        id: report
        env:
          WORK: ${{ steps.prepare.outputs.work }}
          DAST_VERSION: ${{ steps.login.outputs.version }}
          DAST_BUILD: ${{ steps.resolve.outputs.build }}
          DAST_DATE: ${{ steps.job_start.outputs.date }}
          DAST_STARTED: ${{ steps.job_start.outputs.started }}
        run: |
          set -euo pipefail
          # One findings document per pass, each naming the role it ran as - none for the
          # unauthenticated ones, which the report attributes to `unauthenticated`.
          documents=()
          scripts/security-dast.sh normalize-zap "$WORK/zap/ui/out/zap.json" > "$WORK/out/findings-zap-ui.json"
          documents+=("$WORK/out/findings-zap-ui.json")
          for role in $DAST_ROLES; do
            scripts/security-dast.sh normalize-zap "$WORK/zap/api-$role/out/zap.json" "$role" \
              > "$WORK/out/findings-zap-$role.json"
            documents+=("$WORK/out/findings-zap-$role.json")
          done
          for role in $DAST_ROLES; do
            scripts/security-dast.sh normalize-graphql-cop "$WORK/out/graphql-cop-$role.out" \
              "$GRAPHQL_COP_VERSION" "$role" > "$WORK/out/findings-graphql-cop-$role.json"
            documents+=("$WORK/out/findings-graphql-cop-$role.json")
          done
          scripts/security-dast.sh normalize-nuclei "$WORK/out/nuclei.jsonl" \
            "$NUCLEI_VERSION (templates $NUCLEI_TEMPLATES_VERSION)" > "$WORK/out/findings-nuclei.json"
          documents+=("$WORK/out/findings-nuclei.json")
          # One report, one set of counts, one validation run. The documents are de-duplicated by
          # rule and URL across roles before counting; the per-tool and per-role splits are in the
          # report only.
          scripts/security-dast.sh report "$WORK/out/report.md" "${documents[@]}"
          echo "path=$(scripts/security-dast.sh report-path)" >> "$GITHUB_OUTPUT"

      # The private repository, and the only place the detail exists. The token is fine-grained
      # to Contents on that repository alone: it cannot reach this one.
      - name: Publish the report
        env:
          GH_TOKEN: ${{ secrets.SECURITY_REPORTS_TOKEN }}
          WORK: ${{ steps.prepare.outputs.work }}
          DAST_VERSION: ${{ steps.login.outputs.version }}
          DAST_DATE: ${{ steps.job_start.outputs.date }}
          REPORT_PATH: ${{ steps.report.outputs.path }}
        run: scripts/security-dast.sh publish "$REPORTS_REPOSITORY" "$REPORT_PATH" "$WORK/out/report.md"

      # ------------------------------------------------------------------------------------
      # 8. Report to Yontrack.
      #
      # No `if:` at all, which is the deliberate opposite of what demo-smoke.yml does with
      # DEMO.SMOKE, and the issue's "Failure semantics" is why: a scanner error fails the run and
      # reports NO stamp. The two stamps carry different meanings. DEMO.SMOKE gates SILVER, so an
      # absent one silently stalls a promotion and a FAILED one is the honest signal; nothing at
      # all depends on SECURITY.DAST, so an absent one stalls nothing and says the true thing -
      # this build has not been scanned. A FAILED stamp would say the opposite: that it was
      # scanned and came back bad.
      #
      # Counts that could not be produced are never reported as zero either way. A scan that did
      # not happen must not read as a clean instance.
      # ------------------------------------------------------------------------------------

      - name: Validate SECURITY.DAST
        env:
          CRITICAL: ${{ steps.report.outputs.critical }}
          HIGH: ${{ steps.report.outputs.high }}
          MEDIUM: ${{ steps.report.outputs.medium }}
          LOW: ${{ steps.report.outputs.low }}
          STARTED: ${{ steps.job_start.outputs.started }}
          BUILD: ${{ steps.resolve.outputs.build }}
          VERSION: ${{ steps.login.outputs.version }}
        run: |
          set -euo pipefail
          run_time_flag=""
          if [ -n "${STARTED:-}" ]; then
            run_time_flag="--run-time $(( $(date +%s) - STARTED ))"
          fi
          run_info="--source-type github-workflow --source-uri $DAST_RUN_URL"
          run_info="$run_info --trigger-type ${GITHUB_EVENT_NAME} --trigger-data $VERSION"
          # shellcheck disable=SC2086  # deliberate: run info is a set of flags, not one word
          yontrack validate \
            --project "$YONTRACK_PROJECT" --branch "$YONTRACK_BRANCH" --build "$BUILD" \
            --validation SECURITY.DAST \
            chml --critical "$CRITICAL" --high "$HIGH" --medium "$MEDIUM" --low "$LOW" \
            $run_time_flag $run_info

      # ------------------------------------------------------------------------------------
      # 9. The summary. Counts only - check what you add here.
      # ------------------------------------------------------------------------------------

      - name: Summarise the counts
        if: ${{ !cancelled() }}
        env:
          VERSION: ${{ steps.login.outputs.version }}
          BUILD: ${{ steps.resolve.outputs.build }}
          CRITICAL: ${{ steps.report.outputs.critical }}
          HIGH: ${{ steps.report.outputs.high }}
          MEDIUM: ${{ steps.report.outputs.medium }}
          LOW: ${{ steps.report.outputs.low }}
          FINDINGS: ${{ steps.report.outputs.findings }}
          SUPPRESSED: ${{ steps.report.outputs.suppressed }}
          REPORT_PATH: ${{ steps.report.outputs.path }}
        run: |
          {
            echo "### Passive DAST scan of the demo — \`${VERSION:-unknown}\`"
            echo
            echo "| CRITICAL | HIGH | MEDIUM | LOW |"
            echo "|---|---|---|---|"
            echo "| ${CRITICAL:-?} | ${HIGH:-?} | ${MEDIUM:-?} | ${LOW:-?} |"
            echo
            echo "ZAP, graphql-cop and Nuclei together, the API passes run as each of the three scanner"
            echo "roles, de-duplicated and counted per rule, after suppressions; informational findings dropped."
            echo "${FINDINGS:-?} rule(s) counted, ${SUPPRESSED:-?} instance(s) suppressed."
            echo
            echo "Reported as \`SECURITY.DAST\` on build \`${BUILD:-unknown}\` of"
            echo "\`$YONTRACK_PROJECT/$YONTRACK_BRANCH\`."
            echo
            echo "The findings themselves are in \`$REPORTS_REPOSITORY\` at"
            echo "\`${REPORT_PATH:-not published}\`, split by scanner and by role — never here, never as an artifact,"
            echo "and not in the Security tab: see the \"No SARIF\" note in this workflow."
          } >> "$GITHUB_STEP_SUMMARY"
