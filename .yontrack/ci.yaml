version: v1
configuration:
  defaults:
    branch:
      autoVersioning:
        configurations: []
      validations:
        BUILD:
          tests: {}
        UI_UNIT:
          tests: {}
        INTEGRATION:
          tests: {}
        KDSL.ACCEPTANCE:
          tests: {}
        PLAYWRIGHT:
          tests: {}
        # Fixable vulnerabilities in the two Docker images, counted by Trivy and reported by the
        # `security-images` job in ci.yml on every full run (#1749). The images carry the jars and
        # Next's standalone node_modules, so these are the runtime dependencies of both tiers.
        #
        # WARNING from the first HIGH, FAILED from the first CRITICAL. Not in any promotion yet:
        # they soak first, and are expected to join SILVER later.
        SECURITY.IMAGE.BACKEND:
          chml:
            warningLevel: HIGH
            warningValue: 1
            failedLevel: CRITICAL
            failedValue: 1
        SECURITY.IMAGE.UI:
          chml:
            warningLevel: HIGH
            warningValue: 1
            failedLevel: CRITICAL
            failedValue: 1
        # Open CodeQL security alerts of the pushed branch, by security severity, counted from the
        # code-scanning alerts API - so a dismissed false positive lowers the count - and reported
        # by the `report` job of .github/workflows/codeql.yml once every language is analysed
        # (#1750). Code-quality alerts, which have no security severity, are not counted.
        #
        # Same thresholds as the image scans, and likewise in no promotion yet.
        SECURITY.CODE:
          chml:
            warningLevel: HIGH
            warningValue: 1
            failedLevel: CRITICAL
            failedValue: 1
        # Open secret-scanning alerts of the repository, counted by the nightly
        # .github/workflows/security-rescan.yml and reported on the newest released build only
        # (#1751). Repository-wide and not a property of a release, which is why it is reported
        # once rather than on every build the rescan touches.
        #
        # One open alert fails: a leaked credential has no acceptable count. `okIfGreater: false`
        # is what says that more is worse - the threshold type reads high as good by default.
        #
        # Spelled as the data type's class name rather than as the `number` alias #1748 added:
        # the alias reaches an instance only with the release that carries it, and
        # `CIConfigurationParserImpl` rejects a name it does not know outright, which would fail
        # the CI configuration on every push. The class name is what the alias resolves to and
        # every version understands it. Switch to `number` once the instance runs a release with
        # #1748 in it.
        #
        # Not in any promotion, like the other SECURITY stamps.
        SECURITY.SECRETS:
          net.nemerosa.ontrack.extension.general.validation.ThresholdNumberValidationDataType:
            failureThreshold: 0
            okIfGreater: false
        # Findings of the passive DAST scan of the demo instance, counted after suppressions by
        # .github/workflows/dast-passive.yml and reported on the build the demo is running
        # (#1765). One count per scanner rule, not per affected URL; informational findings are
        # dropped, and ZAP has no Critical, so a passive ZAP-only run never produces one.
        #
        # Lower thresholds than the other SECURITY stamps on purpose: these are findings against a
        # deployment that is actually reachable, so one MEDIUM is worth a look and one HIGH is
        # worth stopping for. The scan is still reporting only - the stamp is in no promotion, and
        # nothing in ci.yml depends on the workflow. What the numbers mean and where the detail
        # lives: security/dast/README.md.
        SECURITY.DAST:
          chml:
            warningLevel: MEDIUM
            warningValue: 1
            failedLevel: HIGH
            failedValue: 1
        # Reported by the `docs` job in ci.yml, which now runs on every full run: the site
        # built and was archived as a run artefact for the release to carry forward (#1668).
        # Distinct from DOCUMENTATION below, which records the S3 publication at release time
        # and keeps that name because every past release's history hangs off it. BRONZE
        # requires it since #1669.
        DOCS: {}
        # Reported by .github/workflows/demo-smoke.yml, which the demo slot dispatches once
        # it has marked the deployment done. SILVER, below, requires it.
        DEMO.SMOKE: {}
        # The four publication stamps, all reported by .github/workflows/release.yml, which the
        # GOLD workflow below dispatches. They are what RELEASE is granted on: GOLD triggers the
        # publication, RELEASE records that it succeeded (#1672, #1673).
        DOCKER.HUB: {}
        GITHUB.RELEASE: {}
        DOCUMENTATION: {}
        # A check rather than a publication: the release page is hand-written end-user prose in
        # the wiki, produced before GOLD is granted (#1670), and this records that it is there
        # and reachable from the index. The GitHub release links to it.
        WIKI: {}
      promotions:
        # DOCS sits here so that a docs build breaking is seen on the commit that broke it,
        # rather than at release time when it blocks the release. It costs BRONZE nothing:
        # the `docs` job depends only on [setup, yontrack], so it runs alongside the tests
        # and finishes well before them (#1668, #1669).
        BRONZE:
          validations:
            - BUILD
            - UI_UNIT
            - INTEGRATION
            - KDSL.ACCEPTANCE
            - PLAYWRIGHT
            - DOCS
        # No workflow node of its own: BRONZE is what admits a build to the demo slot, the
        # slot deploys it and dispatches demo-smoke.yml, and DEMO.SMOKE landing green is the
        # last prerequisite - so auto-promotion grants SILVER by itself.
        #
        # What is declared here is deliberately the WEAKER of the two meanings SILVER carries:
        # BRONZE alone, i.e. "the build is green". The `^main$` block under `custom.configs`
        # adds DEMO.SMOKE back, so on main SILVER still means "running on the demo and verified
        # there", which is what GOLD gets decided on. On a release branch nothing adds it, and
        # SILVER means "green on the release branch" - a patch is never deployed to the demo
        # (that would roll the demo back off the current minor) and stamping DEMO.SMOKE by hand
        # would assert a verification that never happened. GOLD stays the human gate either way;
        # only what SILVER attests changes (#1702).
        #
        # Do NOT tidy the `^main$` block back into here. `PromotionLevelConfiguration.merge` is
        # additive only - `validations = (validations + other.validations).distinct()` - so a
        # `custom.configs` block can ADD a validation to a promotion but can never remove one.
        # Whatever the defaults declare is imposed on every branch, so "declare DEMO.SMOKE here
        # and override it away on release/*" is not expressible. Hence the inversion: the
        # defaults declare the weakest form and each branch kind adds what it can satisfy.
        SILVER:
          promotions:
            - BRONZE
        # The human gate, and the only promotion in this chain granted by hand: what it records
        # is that someone looked at the demo running this exact build and wrote the release notes
        # for it. Its workflow below dispatches the publication (#1673).
        #
        # `dependsOn`, NOT `promotions`, and the difference is the whole point. `promotions:
        # [SILVER]` - the obvious way to write "GOLD comes after SILVER" - is what
        # `AutoPromotionPropertyTypeConfigurator` turns into an auto-promotion property, and
        # `AutoPromotionPrerequisites.areSatisfied` would then hold the instant SILVER was
        # granted: GOLD would fire by itself and publish every build that passed the demo smoke
        # tests, which is the opposite of a human gate.
        #
        # `dependsOn` sets the promotion *dependencies* property instead. Nothing grants GOLD on
        # its own, and `PromotionRunDependenciesCheckExtension` refuses to grant it by hand on a
        # build that is not at SILVER. Manual, and still ordered.
        GOLD:
          dependsOn:
            - SILVER
        # A receipt, not a trigger. GOLD starts release.yml, release.yml reports these four, and
        # auto-promotion then grants RELEASE - so RELEASE means "publication completed". Keying
        # it on GOLD plus its own triggers' results is why both levels exist: a promotion whose
        # validations were its own triggers would be circular.
        #
        # On main, nothing can be released until the demo pipeline works end to end, since
        # RELEASE requires GOLD requires SILVER requires DEMO.SMOKE. That is the intended
        # constraint, not a side effect (#1673). On a release branch SILVER does not require
        # DEMO.SMOKE - see the SILVER comment above - so a patch is gated on GOLD alone (#1702).
        RELEASE:
          promotions:
            - GOLD
          validations:
            - DOCKER.HUB
            - GITHUB.RELEASE
            - DOCUMENTATION
            - WIKI
      workflows:
        # Granting GOLD is what publishes. The build name cannot be passed - `${build}` renders
        # the display name, which is the `release` property, and no templating source exposes
        # the raw name - so the version goes across and release.yml resolves the build itself,
        # exactly as the demo slot does for demo-smoke.yml.
        #
        # `release_version` is left out on purpose: release.yml refuses anything but the base
        # version, which is already the default.
        GOLD:
          - name: On GOLD
            nodes:
              - id: release
                # The node timeout wraps the whole execution and defaults to 5 minutes, which is
                # about what release.yml takes - so it has to be raised too, and above the
                # channel's own timeout below, or the node would kill the wait first and report a
                # bare "Timeout" instead of the channel saying which run it gave up on.
                timeout: 1500
                executorId: notification
                data:
                  channel: github-workflow
                  channelConfig:
                    config: github.com
                    owner: yontrack
                    repository: yontrack
                    workflowId: release.yml
                    reference: main
                    # In Sync mode so that the checks are attached to the prommotion.
                    # If not, any failure of the release.yml workflow would not be visible.
                    callMode: SYNC
                    # How long to wait for release.yml in SYNC mode. The default is 30 seconds,
                    # far below the ~5 minutes the release takes: 20 minutes leaves ample margin.
                    timeoutSeconds: 1200
                    inputs:
                      - name: version
                        value: "${build.release}"
                      # Which Yontrack branch holds the build. `release.yml` resolves the version
                      # back to a build by display name in `<project>/<branch>`, and its `branch`
                      # input defaults to `main` - so without this a patch would be looked up on
                      # main and fail with "No build named 5.3.2-rc-N in yontrack/main" (#1702).
                      #
                      # This is the YONTRACK branch name, not the SCM one, which is exactly what
                      # release.yml wants: workflow inputs render with `PlainEventRenderer`
                      # (`render(entity, name) = name`) and NEW_PROMOTION_RUN's context carries
                      # `eventBranch`, so it yields `main` on main and `release-5.3` - the escaped
                      # form - on `release/5.3`. Safe on main: it renders what was already the
                      # default.
                      - name: branch
                        value: "${branch}"
        RELEASE:
          - name: On internal release
            nodes:
              - id: notification
                executorId: notification
                data:
                  channel: slack
                  channelConfig:
                    channel: '#internal-releases'
                    type: 'SUCCESS'
                  template: |
                    Yontrack ${build} has been released.
      
                    ${promotionRun.changelog?title=true&commitsOption=ALWAYS}
              - id: docs.yontrack.com
                executorId: notification
                data:
                  channel: github-workflow
                  channelConfig:
                    config: github.com
                    owner: yontrack
                    repository: doc.yontrack.com
                    workflowId: doc.yml
                    reference: main
                    callMode: ASYNC
      notificationsConfig:
        notifications:
          - name: On validation error
            events:
              - new_validation_run
            keywords: failed
            channel: slack
            channelConfig:
              channel: '#notifications'
              type: 'ERROR'
            contentTemplate: |
              Build ${build} has failed on ${validationStamp}.
          - name: On BRONZE
            promotion: BRONZE
            events:
              - new_promotion_run
            channel: slack
            channelConfig:
              channel: '#notifications'
              type: 'SUCCESS'
            contentTemplate: |
              Build ${build} has been promoted to ${promotionLevel}.
          # The message that hands the decision over: BRONZE says the build is green, SILVER
          # says it is running on the demo and was verified there - the point at which someone
          # has something to look at and a GOLD call to make.
          #
          # `${build}` renders the build's display name, which is its `release` property: the
          # version, as a link to the build. `${build.release}` renders that same string but
          # nothing at all on a build without the property, so the link is the safer form. The
          # demo URL is spelled out - no templating source turns an environment into a URL.
          #
          # The change log is what the GOLD call is actually made on, and `promotionRun` spans the
          # right interval for free: its "from build" is the last build promoted to the SAME level,
          # so on a SILVER run that is SILVER to SILVER, with no parameter needed to say so.
          #
          # It goes LAST because it can render nothing. `SemanticPromotionRunChangeLogTemplatingSource`
          # takes no `empty` parameter - the plain `changelog` source does - and returns "" whenever
          # there is no previous SILVER to measure from. Trailing it lets the message simply end;
          # anywhere higher leaves a hole above the call to action.
          #
          # `issues=true` is doing most of the work here, and deliberately.
          # `SemanticChangelogRenderingServiceImpl` drops every commit carrying no conventional-commit
          # type, silently, and this repository types about one commit in eight - but it references an
          # issue on nearly every one. So the issues section is the substance and the type sections are
          # the garnish, until #1690 changes that. Do NOT tidy the resulting bare `doc` section up with
          # `sections=doc=Documentation`: the mapped title gets no emoji, the sort that follows compares
          # titles and ignores emojis, so the two Documentation keys collide and one group's commits are
          # dropped outright. Fix the commit subjects instead (#1691).
          - name: On SILVER
            promotion: SILVER
            events:
              - new_promotion_run
            channel: slack
            channelConfig:
              channel: '#notifications'
              type: 'SUCCESS'
            contentTemplate: |
              ${build} is deployed to the demo and has passed its smoke tests.

              Demo: https://demo.dev.yontrack.com

              Have a look, then decide on GOLD.

              ${promotionRun.semanticChangelog?issues=true&emojis=true}
    project:
      environments:
        environments:
          - name: demo.dev.yontrack.com
            description: Public demo, running the last BRONZE build on main
            order: 50
            tags:
              - release
          - name: self.dev.yontrack.com
            order: 100
            tags:
              - release
        slots:
          - project: yontrack
            environments:
              - name: demo.dev.yontrack.com
                admissionRules:
                  - name: "branchPattern"
                    ruleId: "branchPattern"
                    ruleConfig:
                      includes:
                        - "main"
                      lastBranchOnly: true
                  - name: "promotion"
                    ruleId: "promotion"
                    ruleConfig:
                      promotion: "BRONZE"
                workflows:
                  # A pipeline is created in CANDIDATE and stays there until something
                  # asks for the deployment to start. Without this, the RUNNING workflow
                  # below never triggers and the pipeline sits as a candidate forever.
                  - trigger: "CANDIDATE"
                    name: "Starting the deployment"
                    nodes:
                      - id: "deploying"
                        description: "Moving the pipeline to running"
                        executorId: "slot-pipeline-deploying"
                        data: {}
                  - trigger: "RUNNING"
                    name: "Deploying"
                    nodes:
                      - id: "auto-versioning"
                        description: "Updating version"
                        executorId: "auto-versioning"
                        data:
                          targetProject: "yontrack-infra-gitops"
                          targetBranch: "main"
                          targetPath: "yontrack-helmfile.d/values/yontrack-demo/yontrack.yaml"
                          targetPropertyType: "yaml-path"
                          targetProperty: "image.tag"
                          # The build NAME is a timestamp-run pair (20260901055547-36), never
                          # a tag. The `release` property, which ci.yml sets on every build, is
                          # the version - 5.3.0-rc-36 on main - and that IS the durable GHCR tag
                          # pushed by #1661. Same reasoning as the self slot, see #1660.
                          targetVersion: "${build.release}"
                          autoApproval: true
                          prTitleTemplate: "Deploying ${sourceProject} version ${VERSION} to the demo"
                          prBodyTemplateFormat: "markdown"
                          prBodyTemplate: |
                            Deployment of ${sourceProject} version ${VERSION} to the demo environment.

                            ${av.semanticChangelog?issues=true&emojis=true}
                      - id: "deploy"
                        description: "Marking the deployment as finished"
                        executorId: "slot-pipeline-deployed"
                        data: {}
                        parents:
                          - id: "auto-versioning"
                      # "Deployed" here means the gitops PR merged, not that the pods are
                      # serving - ArgoCD has not even synced yet. demo-smoke.yml starts by
                      # polling the demo until the version it is given is the version
                      # answering, which is the check that closes that gap. See #1666.
                      #
                      # Only the version is passed: `${build}` would render the build's
                      # display name rather than its name, so the workflow resolves the build
                      # itself. `project` and `branch` are left to the workflow's own defaults
                      # (yontrack/main), which is also what this slot is scoped to.
                      - id: "smoke"
                        description: "Smoke-testing the demo deployment"
                        parents:
                          - id: "deploy"
                        executorId: "notification"
                        data:
                          channel: "github-workflow"
                          channelConfig:
                            config: github.com
                            owner: yontrack
                            repository: yontrack
                            workflowId: demo-smoke.yml
                            reference: main
                            callMode: ASYNC
                            inputs:
                              - name: version
                                value: "${build.release}"
              - name: self.dev.yontrack.com
                admissionRules:
                  # A RELEASE build is deployable from `main` and from a patch branch alike. The
                  # pattern reads the Yontrack branch name, so `release-5.4`, not `release/5.4`.
                  #
                  # One regex rather than two `includes` entries: the eligible-builds query ANDs
                  # its entries, so `main` and `release-.*` listed separately match no branch.
                  # Anchored because that query uses PostgreSQL's unanchored `~`.
                  #
                  # No `lastBranchOnly`: it orders branches by the version in their name, so any
                  # `release-*` branch would win over `main`, and no build of `main` could be
                  # deployed again while one exists.
                  - name: "branchPattern"
                    ruleId: "branchPattern"
                    ruleConfig:
                      includes:
                        - "^(main|release-.*)$"
                  - name: "promotion"
                    ruleId: "promotion"
                    ruleConfig:
                      promotion: "RELEASE"
                workflows:
                  # Same as the demo slot: without a CANDIDATE workflow asking for the
                  # deployment to start, the pipeline never leaves the candidate state
                  # and the RUNNING workflow below never triggers.
                  - trigger: "CANDIDATE"
                    name: "Starting the deployment"
                    nodes:
                      - id: "deploying"
                        description: "Moving the pipeline to running"
                        executorId: "slot-pipeline-deploying"
                        data: {}
                  - trigger: "RUNNING"
                    name: "Deploying"
                    nodes:
                      - id: "auto-versioning"
                        description: "Updating version"
                        executorId: "auto-versioning"
                        data:
                          targetProject: "yontrack-infra-gitops"
                          targetBranch: "main"
                          targetPath: "yontrack-helmfile.d/values/yontrack-self/yontrack.yaml"
                          targetPropertyType: "yaml-path"
                          targetProperty: "image.tag"
                          targetVersion: "${build.release}"
                          autoApproval: true
                          prTitleTemplate: "Deploying ${sourceProject} version ${VERSION}"
                          prBodyTemplateFormat: "markdown"
                          prBodyTemplate: |
                            Deployment of ${sourceProject} version ${VERSION}.

                            ${av.semanticChangelog?issues=true&emojis=true}
                      - id: "deploy"
                        description: "Marking the deployment as finished"
                        executorId: "slot-pipeline-deployed"
                        data: {}
                        parents:
                          - id: "auto-versioning"
                      - id: "end"
                        parents:
                          - id: "deploy"
                        description: "Notification"
                        executorId: "notification"
                        data:
                          channel: "slack"
                          template: "Deployment of ${build} in Production is finished"
                          channelConfig:
                            type: "INFO"
                            channel: "#notifications"
  custom:
    configs:
      # Keeps the public release announcement off feature branches, whose versions carry a branch
      # name and a short commit.
      #
      # The `-rc-<run>` alternative is load-bearing since #1673: `EnvironmentRegexCondition` uses
      # `Regex.matches()`, a FULL match, and `ci.yml` no longer produces a bare `5.3.0` for any
      # build at all - every build on main and release/* is a candidate now, and the release is
      # published from one of them by release.yml. Without the alternative this block matches
      # nothing, and the `#releases` subscription below silently stops being configured.
      - conditions:
          - name: environment-regex
            config:
              name: VERSION
              regex: '\d+\.\d+\.\d+(-rc-\d+)?'
        branch:
          notificationsConfig:
            notifications:
            - name: On RELEASE
              promotion: RELEASE
              events:
                - new_promotion_run
              channel: slack
              channelConfig:
                channel: '#releases'
                type: 'SUCCESS'
              contentTemplate: |
                Yontrack ${build} has been released.

                ${promotionRun.changelog?title=true&commitsOption=OPTIONAL}

      # SILVER on main: adds the demo verification on top of the default's BRONZE, restoring
      # "deployed to the demo and verified there" for a normal release.
      #
      # This belongs here and not in `defaults.branch.promotions.SILVER`, however much it looks
      # like it belongs there - see the SILVER comment above. The merge is additive only, so
      # anything the defaults declare is imposed on release branches too, and a patch has no
      # DEMO.SMOKE to give. The defaults carry the weakest form; this block adds the main-only
      # part (#1702).
      #
      # `BranchCondition` uses `Regex.matches()`, a full match, so the anchors are for the reader
      # rather than for the engine - `main` would behave identically. They are kept because the
      # `^release/.*$` block below genuinely needs the `.*`, and the two read as a pair.
      - conditions:
          - name: branch
            config: '^main$'
        branch:
          promotions:
            SILVER:
              validations:
                - DEMO.SMOKE

      # SILVER on a release branch: the same promotion means something else, so it says something
      # else. The default's text - "deployed to the demo", "has passed its smoke tests", a demo
      # URL to go and look at - is false on all three counts for a patch.
      #
      # Notifications merge differently from promotions, and that is what makes this possible at
      # all: `NotificationsCIConfigExtension.mergeConfig` uses `syncForward` with
      # `equality { i, j -> i.name == j.name }`, so a same-named `On SILVER` REPLACES the default's
      # subscription instead of adding a second one. The name therefore has to stay in step with
      # the default's above, or this silently becomes an extra message rather than a replacement.
      #
      # The item is spelled out in full rather than leaning on the field-level merge: what a
      # reader needs from this block is what actually gets sent on a release branch.
      #
      # `${branch}` renders the YONTRACK branch name, so the message reads `release-5.3` and not
      # `release/5.3`. The change log goes last for the same reason as in the default: it can
      # render nothing, and trailing it lets the message simply end.
      - conditions:
          - name: branch
            config: '^release/.*$'
        branch:
          notificationsConfig:
            notifications:
              - name: On SILVER
                promotion: SILVER
                events:
                  - new_promotion_run
                channel: slack
                channelConfig:
                  channel: '#notifications'
                  type: 'SUCCESS'
                contentTemplate: |
                  ${build} is green on ${branch}.

                  Verify the fix, then decide on GOLD.

                  ${promotionRun.semanticChangelog?issues=true&emojis=true}
