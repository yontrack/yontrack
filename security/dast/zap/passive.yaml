# ZAP Automation Framework plan — PASSIVE scan of the Yontrack demo instance (#1765): the UI part,
# UNAUTHENTICATED.
#
# Run by .github/workflows/dast-passive.yml, once, in the pinned ZAP container:
#
#     zap.sh -cmd -autorun /zap/wrk/passive.yaml
#
# The API is the other plan, security/dast/zap/passive-api.yaml, run once per scanner role (#1769).
# They were one plan until the roles came: the UI is scanned unauthenticated by design (grilling
# outcome, "Two scans, two targets" - it goes through the same API, which is scanned authenticated),
# so running it three times would scan the same pages three times and attribute what it found there
# to accounts that never sent a token to it.
#
# Passive means exactly one thing here: **no request that changes state ever leaves ZAP**. There
# is no activeScan job, no fuzzing, no attack payload, and no GraphQL mutation — see the
# `graphql` job below and security/dast/graphql/README.md. The demo is a shared, seeded instance
# that gates SILVER; a scan that wrote to it would break the very pipeline it is watching.
#
# `${...}` are environment variables, substituted by the Automation Framework:
#
#   DAST_TARGET   the demo, no trailing slash (vars.DEMO_URL)
#
# No token of any kind: nothing in this plan authenticates.
#
# NOTHING IS DISABLED HERE, on purpose. Every rule stays on and the report keeps every finding:
# what a rule *counts for* is decided afterwards by scripts/security-dast.sh from
# security/dast/zap/rules.tsv and security/dast/suppressions.yaml, so that the private report
# always shows what the scanner actually saw. See security/dast/README.md.

env:
  contexts:
    - name: yontrack-demo
      urls:
        - "${DAST_TARGET}/"
      # \Q…\E quotes the target literally: a bare interpolation would leave the dots of the host
      # name as regex wildcards, and `demo.dev.yontrack.com.*` also matches `demoXdev…evil.com`.
      includePaths:
        - "\\Q${DAST_TARGET}\\E.*"
      excludePaths:
        # Signing out, and the fingerprinted Next bundles, which are megabytes of the same two
        # findings.
        - ".*/logout.*"
        - ".*/signout.*"
        - ".*/_next/static/.*"
  parameters:
    # A scanner error is a failed run reporting no stamp, not a clean scan — see the issue's
    # "Failure semantics". Warnings are not: a spider that found fewer URLs than a default test
    # expects is a small demo, not a broken scan.
    failOnError: true
    failOnWarning: false
    # To ZAP's own stdout, which the workflow captures to a file and never prints raw: progress
    # lines carry the URLs being crawled. Kept on because it is the only diagnostic a failed run
    # has, and scripts/security-dast.sh scrubs URLs out of anything that reaches the log.
    progressToStdout: true

jobs:

  # -------------------------------------------------------------------------------------------
  # There is deliberately no `addOns` job.
  #
  # The `graphql` and `replacer` add-ons this plan needs both ship in the pinned image, and the
  # Automation Framework's addOns job "no longer does anything" - it warns and is ignored. Pinning
  # the image by digest is what makes the add-on set reproducible; an `install` list would only
  # look like it was doing that.
  # -------------------------------------------------------------------------------------------

  # -------------------------------------------------------------------------------------------
  # Passive scanning configuration. Every rule on, in-scope only.
  # -------------------------------------------------------------------------------------------
  - type: passiveScan-config
    parameters:
      # Per rule, not overall: a header missing on every page of the UI is one finding with ten
      # example URLs, which is what the report wants, rather than several hundred instances of it.
      maxAlertsPerRule: 10
      scanOnlyInScope: true
      enableTags: false

  # -------------------------------------------------------------------------------------------
  # No authentication: see the header. The one header this plan adds is below.
  # -------------------------------------------------------------------------------------------
  - type: replacer
    rules:
      # An Origin, on the two endpoints that have a CORS configuration at all.
      #
      # Without it the CORS misconfiguration is invisible: Spring only emits
      # `Access-Control-Allow-Origin` in answer to a request that carries an `Origin`, a scanner
      # does not send one by default, and the rule that reports a permissive policy (10098) has
      # nothing to look at. The first real run proved the point - it reported the missing headers
      # and not the `allowed-origins: "*"` sitting in application.yml (#1771). Kept after that fix: it
      # is what shows the permissive policy gone, and what would show it back.
      #
      # A header on a read request. It changes nothing on the instance, which is what keeps this
      # a passive scan; the value is a domain that cannot exist, so a server that echoes it back
      # is saying something about its policy rather than about that name.
      - description: "Origin, so that the CORS response headers are emitted at all"
        url: ".*/(graphql|hook).*"
        matchType: req_header
        matchString: "Origin"
        replacementString: "https://dast.invalid"
        tokenProcessing: false

  # -------------------------------------------------------------------------------------------
  # The targets that are named rather than discovered.
  #
  # The spider below finds what is linked; these are the ones that matter and are not: /mobile is
  # a separate app shell with no link from the desktop root, the /api/auth/* endpoints are called
  # by NextAuth from JavaScript, and /hook/secured/** is POST-only so nothing ever links to it.
  #
  # All GET. The hook endpoint answers 405 to a GET, which is the point: the response headers are
  # what is being scanned, and a GET cannot ingest anything.
  # -------------------------------------------------------------------------------------------
  - type: requestor
    requests:
      - url: "${DAST_TARGET}/"
        method: GET
      - url: "${DAST_TARGET}/mobile"
        method: GET
      - url: "${DAST_TARGET}/api/health"
        method: GET
      - url: "${DAST_TARGET}/api/auth/session"
        method: GET
      - url: "${DAST_TARGET}/api/auth/providers"
        method: GET
      - url: "${DAST_TARGET}/api/auth/csrf"
        method: GET
      - url: "${DAST_TARGET}/api/auth/signin"
        method: GET
      - url: "${DAST_TARGET}/graphql"
        method: GET
      - url: "${DAST_TARGET}/hook/secured/github/ingestion"
        method: GET

  # -------------------------------------------------------------------------------------------
  # The crawl. The traditional spider, not the AJAX one: it costs minutes rather than tens of
  # them, and the UI's client-rendered pages all go through /graphql, which is scanned directly.
  #
  # `postForm: false` is load-bearing: it is what stops the spider from submitting the forms it
  # finds on a live, shared instance.
  # -------------------------------------------------------------------------------------------
  - type: spider
    parameters:
      context: yontrack-demo
      url: "${DAST_TARGET}/"
      maxDuration: 5
      maxDepth: 5
      maxChildren: 20
      postForm: false
      processForm: false
      handleODataParametersVisited: false
      acceptCookies: true
    tests:
      # The default test expects 100 URLs and warns below that. The demo signs users in through
      # Keycloak, so an unauthenticated crawl legitimately reaches a handful of pages; INFO says
      # so in the ZAP log without colouring the run.
      - type: stats
        statistic: automation.spider.urls.added
        operator: ">="
        value: 1
        onFail: INFO

  # -------------------------------------------------------------------------------------------
  # Let the passive rules finish on everything the jobs above put through the proxy.
  # -------------------------------------------------------------------------------------------
  - type: passiveScan-wait
    parameters:
      maxDuration: 10

  # -------------------------------------------------------------------------------------------
  # Every request ZAP sent, as a HAR.
  #
  # Not a report and never published: it is read once, on the runner, by
  # `scripts/security-dast.sh assert-no-mutations`, which fails the workflow if any request body
  # carried a GraphQL mutation or subscription. This plan sends nothing to /graphql but one GET
  # with no query - the check holds it to that all the same.
  # -------------------------------------------------------------------------------------------
  - type: export
    parameters:
      fileName: /zap/wrk/out/messages.har
      type: har
      source: history

  # -------------------------------------------------------------------------------------------
  # The report. One file, read by scripts/security-dast.sh, which counts it and writes the
  # markdown report pushed to the private yontrack/security-reports. It never becomes a workflow
  # artifact.
  #
  # There is no SARIF report here any more, and that was measured rather than assumed. Run
  # 35087242240 uploaded one under the `dast-zap` category: GitHub accepted it without a warning
  # and turned 40 results into **zero alerts**. A DAST finding is located by URL, and code
  # scanning maps a result to a line of a file in the repository - there is nothing for it to
  # point at. The alternative would be to invent a file location per rule, which is worse than no
  # alert: an alert on a line that has nothing to do with the finding. So the upload is dropped
  # and the private report is the source of truth, exactly as docs/grilling/2026-09-dast.md
  # provided for.
  #
  # Every risk and every confidence, including informational and false-positive: the filtering is
  # the counting layer's job, and a report that filters first cannot be reviewed.
  # -------------------------------------------------------------------------------------------
  - type: report
    parameters:
      template: traditional-json
      reportDir: /zap/wrk/out
      reportFile: zap
      reportTitle: "Yontrack passive DAST"
      reportDescription: "Passive ZAP scan of the Yontrack demo instance, UI, unauthenticated"
      displayReport: false
    risks: [info, low, medium, high]
    confidences: [falsepositive, low, medium, high, confirmed]
