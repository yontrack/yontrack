# Scanner rule → what to change in Yontrack, and where.
#
# Read by `scripts/security-dast.sh report`, which prints the mitigation under each rule of the
# markdown report pushed to yontrack/security-reports. A rule with no entry here is reported as
# "no mitigation recorded", which is the signal to add one — see security/dast/README.md.
#
# The point of the file is that a report is readable months later by someone who did not run the
# scan: a rule title says what is wrong, this says what to do about it in *this* codebase — the
# class, the configuration key, the chart value, the issue where it is being fixed.
#
# Matching follows the same rule as suppressions.yaml: an entry matches a finding when every field
# it declares matches, as an anchored regular expression, and a field it does not declare matches
# anything. `scanner`, `rule` (the tool's own rule id) and `name` (the rule title) can be declared;
# there is no `url` — a mitigation is about the rule, not about where it was seen.
#
# Seeded with the four findings decided up front in docs/grilling/2026-09-dast.md, "Known
# findings", so that the very first report explains itself rather than listing expected noise.
version: 1

mitigations:

  # -----------------------------------------------------------------------------------------
  # Missing security headers on the Next.js UI — expected on the first run, fixed by #1770.
  # -----------------------------------------------------------------------------------------
  - id: ui-security-headers
    scanner: "zap"
    rule: "10020|10021|10035|10038|10063|90004"
    title: "Security response headers missing on the UI"
    issue: "https://github.com/yontrack/yontrack/issues/1770"
    change: >-
      Done by #1770: `headers()` in `ontrack-web-core/next.config.js`, built by
      `components/security/securityHeaders.js`, sends X-Content-Type-Options, Referrer-Policy,
      Permissions-Policy, `Content-Security-Policy: frame-ancestors 'self'` with
      X-Frame-Options, and a report-only Content-Security-Policy on every route, `/mobile` and
      `/api/*` included. If this fires again, check that the deployed image carries that build,
      then which header the finding names. Enforcing the full CSP, which ZAP may keep reporting while
      it is report-only, is a later decision taken from the browsers' report-only messages. HSTS
      (rule 10035) is deliberately NOT set by the application: it is the ingress's to set, since
      it is the component that terminates TLS and knows whether every hostname under the domain
      is HTTPS-only.

  # -----------------------------------------------------------------------------------------
  # Permissive CORS — reported by the first run, fixed by #1771.
  # -----------------------------------------------------------------------------------------
  - id: permissive-cors
    scanner: "zap"
    rule: "10098"
    title: "Cross-domain misconfiguration: any origin is allowed"
    issue: "https://github.com/yontrack/yontrack/issues/1771"
    change: >-
      Done by #1771: `spring.graphql.cors` is gone from
      `ontrack-ui/src/main/resources/config/application.yml`, and `WebConfig.addCorsMappings` maps
      `/graphql/**`, `/rest/**` and `/extension/**` only when
      `ontrack.config.security.cors.allowed-origins` lists origins, allowing those and no others;
      `/hook/secured/**` is never mapped. `WebSecurityConfig` answers the preflights from the same
      mappings. The default is empty, so no response carries `Access-Control-Allow-Origin`. If this
      fires again, check first that the deployed image carries that build, then whether the
      instance sets the property, and to what: a `*` in the list reopens exactly this finding.
      Covered by `CorsDefaultIT` and `CorsAllowlistIT` in `ontrack-ui`.

  # -----------------------------------------------------------------------------------------
  # graphql-cop (#1766). Rule ids are graphql-cop's test names. Listed before the introspection
  # entry below, whose name pattern would otherwise also claim the circular query: the first
  # entry that matches is the one a report prints.
  # -----------------------------------------------------------------------------------------
  - id: graphql-query-cost
    scanner: "graphql-cop"
    rule: "alias_overloading|batch_query|directive_overloading|field_duplication|circular_query_introspection"
    title: "No limit on the cost of a GraphQL query"
    issue: "https://github.com/yontrack/yontrack/issues/1766"
    change: >-
      Denial of service, not disclosure: one request can make the server do an unbounded amount of
      work - a hundred aliases, repeated directives, a batch, or a selection recursing through the
      introspection types. Yontrack's schema is deeply nested (project, branch, build, links …), so
      the same applies to ordinary queries. The GraphQL engine is set up in
      `ontrack-ui-graphql/src/main/java/net/nemerosa/ontrack/graphql/GraphQLConfiguration.kt`, which
      configures no limit today. graphql-java provides `MaxQueryDepthInstrumentation` and
      `MaxQueryComplexityInstrumentation`, and Spring for GraphQL applies an `Instrumentation` bean;
      any limit must be measured against the deepest queries the UI and the CLI send first, or it
      breaks them. `batch_query` firing would be a surprise - Spring for GraphQL does not accept an
      array of operations - so check first what in front of the backend answered.
  - id: graphql-csrf
    scanner: "graphql-cop"
    rule: "get_method_support|post_based_csrf|get_based_mutation"
    title: "GraphQL accepted outside a JSON POST (CSRF shape)"
    issue: "https://github.com/yontrack/yontrack/issues/1766"
    change: >-
      Only exploitable as cross-site request forgery if a browser attaches the credentials by
      itself, and the API takes none it would: `WebSecurityConfig` makes it stateless, with CSRF
      protection disabled because authentication is an `X-Ontrack-Token` or `Authorization` header,
      which a cross-site form or link cannot set. If a cookie-based session on `/graphql` is ever
      introduced, this becomes real and the fix is to refuse anything but `POST` with
      `Content-Type: application/json` on `/graphql`.
  - id: graphql-field-suggestions
    scanner: "graphql-cop"
    rule: "field_suggestions"
    title: "GraphQL error messages suggest field names"
    issue: "https://github.com/yontrack/yontrack/issues/1766"
    change: >-
      Discloses what introspection already does, and introspection is accepted (see
      suppressions.yaml): the schema is public. Worth a suppression with that statement rather than
      a change, unless introspection is ever turned off - in which case graphql-java's validation
      messages have to lose their "Did you mean" suggestions at the same time, or they rebuild the
      schema field by field.
  - id: graphql-ide
    scanner: "graphql-cop"
    rule: "detect_graphiql"
    title: "A GraphQL IDE is served"
    issue: "https://github.com/yontrack/yontrack/issues/1766"
    change: >-
      `spring.graphql.graphiql.enabled` in `ontrack-ui/src/main/resources/config/application.yml`
      (off by default in Spring for GraphQL). If it fires, find which page answered: the Next.js UI
      also matches on the word "GraphiQL".

  # -----------------------------------------------------------------------------------------
  # Nuclei (#1766). Rule ids are template ids. Exposed files and default credentials are
  # incidents on the demo, not counts to live with. The actuator entry comes first: `springboot-env`
  # is an actuator endpoint, not an env file.
  # -----------------------------------------------------------------------------------------
  - id: springboot-actuator-nuclei
    scanner: "nuclei"
    rule: "springboot-.*|jolokia-.*|spring-.*"
    title: "Spring Boot actuator endpoint reachable"
    issue: "https://github.com/yontrack/yontrack/issues/1772"
    change: >-
      See the `actuator-exposure` entry: the management port 8800 is unauthenticated by design and
      must never be routed from outside the cluster (yontrack/yontrack-chart#110). The workflow
      stops before any scanner runs if the management port answers, so a Nuclei finding here means
      an actuator path answered on the public port instead - check the ingress rules, and whether
      the instance moved `management.server.port` back onto the application port.
  - id: exposed-files
    scanner: "nuclei"
    rule: "git-.*|.*-env|.*dotenv.*|.*-config-file|.*backup.*"
    title: "A file that should never be served is served"
    issue: "https://github.com/yontrack/yontrack/issues/1766"
    change: >-
      Neither the image nor the chart serves a repository or an environment file: the backend
      serves the API and the Next.js server serves its build output. Check first what answered -
      the finding's instance in this report says which path - and whether it is a real file or a
      page the UI returns for every path; then the ingress rules of the deployment in
      yontrack/yontrack-chart. A real one is an incident: rotate whatever the file contains.
  - id: default-credentials
    scanner: "nuclei"
    rule: ".*default-login.*"
    title: "Default credentials accepted"
    issue: "https://github.com/yontrack/yontrack/issues/1766"
    change: >-
      An incident, whichever component it is. On the demo the likeliest is Keycloak's admin
      account: its credentials come from the chart values (`auth.keycloak.*` in
      yontrack/yontrack-chart) and the deployment's secrets in yontrack/yontrack-infra-gitops, and
      must never be a default. Change them, then check the chart does not ship a usable default.

  # -----------------------------------------------------------------------------------------
  # GraphQL introspection — accepted, see suppressions.yaml. Kept here so that a report still
  # explains it if the suppression ever expires.
  # -----------------------------------------------------------------------------------------
  - id: graphql-introspection
    name: ".*[Ii]ntrospection.*"
    title: "GraphQL introspection is enabled"
    issue: "https://github.com/yontrack/yontrack/issues/1765"
    change: >-
      Accepted, not fixed: `spring.graphql.schema.introspection.enabled` stays `true`. The schema
      is public — committed as `ontrack-web-core/ontrack.graphql` and published with the
      documentation — and the UI needs it. Suppressed in security/dast/suppressions.yaml with that
      statement.

  # -----------------------------------------------------------------------------------------
  # The management port. Not expected from the demo — the chart must not route 8800 at all — and
  # `.github/workflows/dast-passive.yml` stops the run outright if it answers. Here so that a
  # report of any other instance says what to do.
  # -----------------------------------------------------------------------------------------
  - id: actuator-exposure
    name: ".*([Aa]ctuator|[Ss]pring [Bb]oot|/manage).*"
    title: "Spring Boot management endpoints are reachable"
    issue: "https://github.com/yontrack/yontrack/issues/1772"
    change: >-
      The management port 8800 (`/manage`) is unauthenticated by design — see `WebSecurityConfig`
      — so reaching it from outside the cluster is a deployment fault, not an application one. The
      shipped defaults were narrowed by #1772 (`management.endpoints.web.exposure.include` is
      `health,info,prometheus`, `show-details: when-authorized`, the account endpoint disabled),
      and the chart must never route the management port to an ingress
      (yontrack/yontrack-chart#110). If this fires on the demo, treat it as an incident: the port
      is exposed, whatever the endpoints on it happen to be.

  # -----------------------------------------------------------------------------------------
  # Version and technology disclosure. Low, and worth a line rather than an issue.
  # -----------------------------------------------------------------------------------------
  - id: version-disclosure
    scanner: "zap"
    rule: "10036|10037"
    title: "Server and framework versions in the response headers"
    change: >-
      The demo answers with the `Server` and `X-Powered-By` headers of Next.js and of the ingress.
      Yontrack publishes its own version over `/graphql` (`info { version { full } }`) to any
      authenticated caller and the demo runs the newest build by construction, so this discloses
      nothing an attacker could not ask for; `poweredByHeader: false` in
      `ontrack-web-core/next.config.js` removes half of it for free if it is ever worth doing.
