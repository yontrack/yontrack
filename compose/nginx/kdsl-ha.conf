# The proxy of compose/docker-compose-kdsl-ha.yml (#2076): plain round-robin over the two backends.
#
# A test fixture only. In production the load balancing is the Kubernetes Service's, and nothing of
# this file goes to the chart.

upstream yontrack {
    server ontrack-a:8080;
    server ontrack-b:8080;
}

server {
    listen 8080;

    # Uploads: CasC files, SCM payloads.
    client_max_body_size 100m;

    location / {
        proxy_pass http://yontrack;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;

        # A request that fails on one backend is never replayed on the other: the retry would hide
        # the very failure the cross-replica tests are there to see.
        proxy_next_upstream off;

        # Which backend answered, so that a test can check that both are reached. `always`: on an
        # error response too.
        add_header X-Yontrack-Upstream $upstream_addr always;
    }
}
