# Middleware for the local development stack.
#
# Every published port is parameterised so that several checkouts can run
# their own stack side by side; the defaults reproduce the historical ports,
# so running this file directly behaves exactly as it always has.
#
# Started and stopped through scripts/dev-stack.sh -- see DEVELOPMENT.md.

services:

  postgresql:
    image: postgres:17
    environment:
      POSTGRES_DB: ontrack
      POSTGRES_USER: ontrack
      POSTGRES_PASSWORD: ontrack
    ports:
      - "${YONTRACK_DEV_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ontrack -d ontrack" ]
      interval: 10s
      timeout: 5s
      retries: 5

  influxdb:
    profiles:
      - influxdb
    image: influxdb:1.11.8
    ports:
      - "${YONTRACK_DEV_INFLUXDB_PORT:-8086}:8086"

  # Keycloak keeps no state between runs: it has no database, so the
  # development realm below is re-imported on every start and edits to it take
  # effect immediately. Anything created by hand in the admin console is lost
  # on a restart, which is the intended trade.
  keycloak:
    image: quay.io/keycloak/keycloak:26.2.5
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: "${YONTRACK_DEV_KEYCLOAK_URL:-http://localhost:8008}"
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "${YONTRACK_DEV_KEYCLOAK_PORT:-8008}:8080"
    command:
      - start-dev
      - --import-realm
    volumes:
      - ./keycloak/import/dev:/opt/keycloak/data/import
      - ./keycloak/themes/yontrack:/opt/keycloak/themes/yontrack
    healthcheck:
      # The Keycloak image ships no curl, so probe the management port over
      # bash's own TCP redirection.
      test: [ "CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q '200 OK' <&3" ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  rabbit:
    image: rabbitmq:4.1.3-management
    hostname: rabbit
    environment:
      RABBITMQ_DEFAULT_USER: ontrack
      RABBITMQ_DEFAULT_PASS: ontrack
    ports:
      - "${YONTRACK_DEV_RABBIT_MGMT_PORT:-15672}:15672"
      - "${YONTRACK_DEV_RABBIT_PORT:-5672}:5672"
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  # S3-compatible storage for the evidence of the audit trail (#1962).
  # pgsty/silo is the community fork of MinIO -- the upstream image is no
  # longer published -- pinned by release and digest. Its bucket is created at
  # start by minio/start.sh, and the service is healthy once it exists. The
  # objects are kept in a volume, like the database, until `down --clean`.
  # buildSrc's `Minio` holds the image, bucket and credentials, and `MinioTest`
  # keeps this file in step with it.
  minio:
    image: "pgsty/silo:RELEASE.2026-09-16T00-00-00Z@sha256:635197cb9f36d01bee221d34d1c7d7960f6a95c48b0b6c01d99cd13bdae51a46"
    entrypoint: [ "/bin/sh", "/yontrack/start.sh" ]
    environment:
      MINIO_ROOT_USER: yontrack-minio
      MINIO_ROOT_PASSWORD: yontrack-minio-secret
      YONTRACK_MINIO_BUCKET: yontrack-audit-trail
    ports:
      - "${YONTRACK_DEV_MINIO_PORT:-19000}:9000"
      - "${YONTRACK_DEV_MINIO_CONSOLE_PORT:-19001}:9001"
    volumes:
      - ./minio/start.sh:/yontrack/start.sh:ro
      - minio_data:/data
    healthcheck:
      test: [ "CMD-SHELL", "test -f /tmp/yontrack-bucket-ready && silo healthcheck --quiet" ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

volumes:
  postgres_data:
  minio_data:
