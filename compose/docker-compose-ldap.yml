services:

  # To test this is working
  #
  # Looking for users:
  #
  # ldapsearch -x -H ldap://localhost:389 -D "cn=admin,dc=nemerosa,dc=com" -w admin -b "ou=users,dc=nemerosa,dc=com"
  #
  ldap:
    image: osixia/openldap:1.5.0
    environment:
      LDAP_ORGANISATION: Ontrack
      LDAP_DOMAIN: nemerosa.com
      LDAP_ADMIN_PASSWORD: admin
      LDAP_LOG_LEVEL: "256"
    ports:
      - '389:389'
      - '636:636'
    command:
      - --loglevel
      - debug
      - --copy-service
    volumes:
      - ./keycloak/import/ldap/bootstrap:/container/service/slapd/assets/config/bootstrap/ldif/custom

  postgresql-keycloak:
    image: postgres:17
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    ports:
      - "6543:6543"
    volumes:
      - keycloak_postgres_data:/var/lib/postgresql/data

  keycloak:
    image: quay.io/keycloak/keycloak:26.2.5
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL_HOST: postgresql-keycloak
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
    ports:
      - "8008:8080"
    command:
      - start-dev
      - --import-realm
    volumes:
      - ./keycloak/import/ldap:/opt/keycloak/data/import
    depends_on:
      - postgresql-keycloak

  # Rabbit MQ
  rabbit:
    image: rabbitmq:4.1.3-management
    hostname: rabbit
    environment:
      RABBITMQ_DEFAULT_USER: ontrack
      RABBITMQ_DEFAULT_PASS: ontrack
    ports:
      - "15672:15672"
      - "5672:5672"

  postgresql:
    image: postgres:17
    environment:
      POSTGRES_DB: ontrack
      POSTGRES_USER: ontrack
      POSTGRES_PASSWORD: ontrack
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  keycloak_postgres_data:
  postgres_data:
