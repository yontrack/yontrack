# Middleware for the integration tests (`./gradlew integrationTest`).
#
# Every published port is parameterised so that several checkouts can run
# their integration tests side by side; the defaults reproduce the historical
# ports, so running this file directly behaves exactly as it always has.
#
# Started and stopped by the Gradle Docker Compose plugin, which is given the
# project name and the ports by `ItStack` in buildSrc -- see
# docs/adr/0012-parallel-integration-test-stacks.md.

services:

  # Database
  db:
    image: postgres:17
    command: postgres -c 'max_connections=300'
    environment:
      POSTGRES_DB      : ontrack
      POSTGRES_USER    : ontrack
      POSTGRES_PASSWORD: ontrack
    ports:
      - "${YONTRACK_IT_POSTGRES_PORT:-5432}:5432"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.2.0
    ports:
      - "${YONTRACK_IT_ELASTIC_PORT:-9200}:9200"
    environment:
      - "discovery.type=single-node"
      - "xpack.security.enabled=false"
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=1s || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  # Rabbit MQ
  rabbit:
    image: rabbitmq:4.1.3-management
    restart: always
    hostname: rabbit
    environment:
      RABBITMQ_DEFAULT_USER: ontrack
      RABBITMQ_DEFAULT_PASS: ontrack
    ports:
      - "${YONTRACK_IT_RABBIT_MGMT_PORT:-15672}:15672"
      - "${YONTRACK_IT_RABBIT_PORT:-5672}:5672"

  # Vault
  # Non production setup
  # See https://hub.docker.com/_/vault/
  vault:
    image: "vault:1.3.2"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: "test"
    cap_add:
      - "IPC_LOCK"
    ports:
      - "${YONTRACK_IT_VAULT_PORT:-8200}:8200"

  # S3-compatible storage for the evidence of the audit trail (#1962).
  # pgsty/silo is the community fork of MinIO -- the upstream image is no
  # longer published -- pinned by release and digest. Its bucket is created at
  # start by minio/start.sh, and the service is healthy once it exists.
  # buildSrc's `Minio` holds the image, bucket and credentials, and `MinioTest`
  # keeps this file in step with it.
  minio:
    image: "pgsty/silo:RELEASE.2026-09-16T00-00-00Z@sha256:635197cb9f36d01bee221d34d1c7d7960f6a95c48b0b6c01d99cd13bdae51a46"
    entrypoint: [ "/bin/sh", "/yontrack/start.sh" ]
    environment:
      MINIO_ROOT_USER: yontrack-minio
      MINIO_ROOT_PASSWORD: yontrack-minio-secret
      YONTRACK_MINIO_BUCKET: yontrack-audit-trail
    ports:
      - "${YONTRACK_IT_MINIO_PORT:-19000}:9000"
    volumes:
      - ./minio/start.sh:/yontrack/start.sh:ro
    # Nothing to keep between runs: the data lives in memory.
    tmpfs:
      - /data
    healthcheck:
      test: [ "CMD-SHELL", "test -f /tmp/yontrack-bucket-ready && silo healthcheck --quiet" ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
