services:

  # Ontrack container
  ontrack:
    image: "nemerosa/ontrack:latest"
    restart: always
    environment:
      PROFILE: prod,cors
      JAVA_OPTIONS: "${JAVA_OPTIONS:--Xms1024m -Xmx1024m}"
      # Database
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres/ontrack"
      # Elasticsearch
      SPRING_ELASTICSEARCH_URIS: "http://elasticsearch:9200"
      # Rabbit MQ
      SPRING_RABBITMQ_HOST: rabbit
      SPRING_RABBITMQ_USERNAME: ontrack
      SPRING_RABBITMQ_PASSWORD: ontrack
      # Running in test mode, not testing the configurations
      ONTRACK_CONFIG_CONFIGURATION_TEST: "false"
      # Next UI
      ONTRACK_CONFIG_UI_ENABLED: "true"
      ONTRACK_CONFIG_UI_URL: "http://localhost:3000" # External URL!
    depends_on:
      postgres:
        condition: service_started
      elasticsearch:
        condition: service_started
      rabbit:
        condition: service_started
    ports:
      - "8080:8080"
      # Management port - local access only, never publish it (#1772)
      - "127.0.0.1:8800:8800"

  # Ontrack UI
  ui:
    image: "nemerosa/ontrack-ui:latest"
    restart: always
    environment:
      ONTRACK_URL: http://ontrack:8080
      ONTRACK_UI_URL: http://localhost:3000
      ONTRACK_CONNECTION_LOGGING: "true"
      ONTRACK_CONNECTION_TRACING: "true"
    depends_on:
      ontrack:
        condition: service_started
    ports:
      - "3000:3000"

  # Postgresql database
  postgres:
    image: postgres:17
    restart: always
    environment:
      POSTGRES_DB: ontrack
      POSTGRES_USER: ontrack
      POSTGRES_PASSWORD: ontrack

  # ElasticSearch
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.2.0
    restart: always
    environment:
      - "discovery.type=single-node"
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - "xpack.security.enabled=false"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=1s || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  # Rabbit MQ
  rabbit:
    image: rabbitmq:4.1.3-management
    restart: always
    hostname: rabbit
    environment:
      RABBITMQ_DEFAULT_USER: ontrack
      RABBITMQ_DEFAULT_PASS: ontrack
